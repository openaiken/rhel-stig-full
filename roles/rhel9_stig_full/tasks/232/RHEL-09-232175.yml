---
# RHEL-09-232175 | V-257915
# RHEL 9 /var/log directory must be group-owned by root.
# CAT II (Medium) | CCI-001314

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-232175 | check /var/log group owner
  shell: |
    val=$(stat -c '%G' /var/log 2>/dev/null)
    echo "/var/log group owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /var/log must exist with group owner root"
    fi
  register: _232175_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-232175 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232175': {
        'status':
          'not_a_finding' if _232175_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232175_result.stdout | trim,
        'comments':
          'sudo chgrp root /var/log'
      }
    }) }}"
  tags: [validate]

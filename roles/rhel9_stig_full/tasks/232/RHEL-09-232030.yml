---
# RHEL-09-232030 | V-257886
# RHEL 9 /var/log/messages file must have mode 0640 or less permissive.
# CAT II (Medium) | CCI-001314

# The STIG allows the stated mode or anything less permissive. The formal
# role sets that exact mode, so in check mode a host with a stricter mode
# (e.g. 0600 where 0640 is the maximum) was reported open while compliant.
# Checked with a bitmask of the forbidden bits; a missing file is open.

- name: RHEL-09-232030 | check /var/log/messages mode
  shell: |
    mode=$(stat -c '%a' /var/log/messages 2>/dev/null)
    echo "/var/log/messages mode: ${mode:-(file not found)} (maximum 0640)"
    if [ -n "$mode" ] && [ $(( 8#$mode & 8#7137 )) -eq 0 ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /var/log/messages is missing or more permissive than 0640"
    fi
  register: _232030_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232030 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232030': {
        'status':
          'not_a_finding' if _232030_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232030_result.stdout | trim,
        'comments':
          'Set the mode: sudo chmod 0640 /var/log/messages (or stricter).'
      }
    }) }}"
  tags: [validate]

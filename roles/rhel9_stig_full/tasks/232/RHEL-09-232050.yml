---
# RHEL-09-232050 | V-257890
# All RHEL 9 local interactive user home directories must have mode 0750 or
# less permissive.
# CAT II (Medium) | CCI-000366

# Mode 0750 = rwxr-x---; /027 mask catches group write and any other-user bits.

- name: RHEL-09-232050 | find home directories with mode more permissive than 0750
  shell: >-
    awk -F: '($3 >= 1000) && ($3 < 65534) && ($7 !~ /nologin/) {print $6}' /etc/passwd | xargs -I{} stat -L -c '%a %n' {} 2>&1 | awk '$1 !~ /^[0-7]+$/ || and(strtonum("0" $1), 0027) {print}' || true
  register: _232050_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232050 | record home directory mode status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232050': {
        'status': 'not_a_finding' if not (_232050_result.stdout | trim) else 'open',
        'finding_details':
          'Interactive user home directories more permissive than 0750 (mode path):\n'
          ~ (_232050_result.stdout | trim if _232050_result.stdout | trim else '(none)'),
        'comments': 'Run chmod 0750 <dir> for each listed home directory.'
      }
    }) }}"
  tags: [validate]

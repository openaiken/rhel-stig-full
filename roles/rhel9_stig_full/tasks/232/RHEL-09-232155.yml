---
# RHEL-09-232155 | V-257911
# RHEL 9 /etc/shadow file must be group-owned by root.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-232155 | check /etc/shadow group owner
  shell: |
    val=$(stat -c '%G' /etc/shadow 2>/dev/null)
    echo "/etc/shadow group owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/shadow must exist with group owner root"
    fi
  register: _232155_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232155 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232155': {
        'status':
          'not_a_finding' if _232155_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232155_result.stdout | trim,
        'comments':
          'sudo chgrp root /etc/shadow'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-232170 | V-257914
# RHEL 9 /var/log directory must be owned by root.
# CAT II (Medium) | CCI-001314

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-232170 | check /var/log owner
  shell: |
    val=$(stat -c '%U' /var/log 2>/dev/null)
    echo "/var/log owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /var/log must exist with owner root"
    fi
  register: _232170_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-232170 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232170': {
        'status':
          'not_a_finding' if _232170_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232170_result.stdout | trim,
        'comments':
          'sudo chown root /var/log'
      }
    }) }}"
  tags: [validate]

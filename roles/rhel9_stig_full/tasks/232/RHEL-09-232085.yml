---
# RHEL-09-232085 | V-257897
# RHEL 9 /etc/shadow- file must have mode 0000 or less permissive to prevent
# unauthorized access.
# CAT II (Medium) | CCI-000366

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-232085 | check /etc/shadow- mode 0000
  shell: |
    mode=$(stat -c '%a' /etc/shadow- 2>/dev/null)
    echo "/etc/shadow- mode: ${mode:-(file not found)} (required 0)"
    if [ "$mode" = "0" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/shadow- must exist with mode 0000"
    fi
  register: _232085_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-232085 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232085': {
        'status':
          'not_a_finding' if _232085_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232085_result.stdout | trim,
        'comments':
          'sudo chmod 0000 /etc/shadow-'
      }
    }) }}"
  tags: [validate]

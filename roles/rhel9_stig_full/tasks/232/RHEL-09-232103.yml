---
# RHEL-09-232103 | V-270175
# RHEL 9 "/etc/audit/" must be owned by root.
# CAT II (Medium) | CCI-001314

- name: RHEL-09-232103 | get /etc/audit/ owner
  shell: stat -c "%U" /etc/audit
  register: _232103_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232103 | record /etc/audit/ ownership status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232103': {
        'status': 'not_a_finding' if (_232103_result.stdout | trim) == 'root' else 'open',
        'finding_details': '/etc/audit/ owner: ' ~ (_232103_result.stdout | trim),
        'comments': 'Run: chown root /etc/audit'
      }
    }) }}"
  tags: [validate]

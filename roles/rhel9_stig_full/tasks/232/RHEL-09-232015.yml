---
# RHEL-09-232015 | V-257883
# RHEL 9 library directories must have mode 755 or less permissive.
# CAT II (Medium) | CCI-001494

- name: RHEL-09-232015 | find library directories with mode more permissive than 755
  shell: >
    find -L /lib /lib64 /usr/lib /usr/lib64
    -xdev -type d -perm /022 2>/dev/null || true
  register: _232015_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232015 | record library directory mode status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232015': {
        'status': 'not_a_finding' if not (_232015_result.stdout | trim) else 'open',
        'finding_details':
          'Library directories with mode > 755:\n'
          ~ (_232015_result.stdout | trim if _232015_result.stdout | trim else '(none)'),
        'comments': 'Run chmod 755 <dir> for each listed directory.'
      }
    }) }}"
  tags: [validate]

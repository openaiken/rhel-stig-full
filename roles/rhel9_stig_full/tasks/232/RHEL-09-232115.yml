---
# RHEL-09-232115 | V-257903
# RHEL 9 /etc/gshadow file must be group-owned by root.
# CAT II (Medium) | CCI-000366

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-232115 | check /etc/gshadow group owner
  shell: |
    val=$(stat -c '%G' /etc/gshadow 2>/dev/null)
    echo "/etc/gshadow group owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/gshadow must exist with group owner root"
    fi
  register: _232115_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-232115 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232115': {
        'status':
          'not_a_finding' if _232115_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232115_result.stdout | trim,
        'comments':
          'sudo chgrp root /etc/gshadow'
      }
    }) }}"
  tags: [validate]

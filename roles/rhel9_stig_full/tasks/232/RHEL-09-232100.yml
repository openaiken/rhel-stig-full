---
# RHEL-09-232100 | V-257900
# RHEL 9 /etc/group- file must be owned by root.
# CAT II (Medium) | CCI-000366

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-232100 | check /etc/group- owner
  shell: |
    val=$(stat -c '%U' /etc/group- 2>/dev/null)
    echo "/etc/group- owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/group- must exist with owner root"
    fi
  register: _232100_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-232100 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-232100': {
        'status':
          'not_a_finding' if _232100_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232100_result.stdout | trim,
        'comments':
          'sudo chown root /etc/group-'
      }
    }) }}"
  tags: [validate]

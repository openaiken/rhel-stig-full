---
# RHEL-09-271095 | V-258029
# RHEL 9 must disable the ability of a user to restart the system from the
# login screen.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271095 | check disable-restart-buttons (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.login-screen disable-restart-buttons 2>&1)
    if [ "$val" = "true" ]; then echo "PASS: disable-restart-buttons=$val"
    else echo "FAIL: disable-restart-buttons=${val:-no output} (required: true)"
    fi
  register: _271095_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-271095 | record disable-restart-buttons status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-271095': {
        'status':
          'not_applicable' if _271095_result.stdout is search('^NA:', multiline=True)
          else ('not_a_finding' if _271095_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271095_result.stdout | trim,
        'comments':
          'Set disable-restart-buttons=true in a dconf keyfile under '
          ~ '/etc/dconf/db/local.d/ in the [org/gnome/login-screen] section. '
          ~ 'Run dconf update.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-271045 | V-258019
# RHEL 9 must be able to initiate a session lock for all connection types
# using smart card when the smart card is removed.
# CAT II (Medium) | CCI-000056

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271045 | check smartcard removal-action (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.settings-daemon.peripherals.smartcard removal-action 2>&1)
    if [ "$val" = "'lock-screen'" ]; then echo "PASS: removal-action=$val"
    else echo "FAIL: removal-action=${val:-no output} (required: 'lock-screen')"
    fi
  register: _271045_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-271045 | record smartcard removal-action status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-271045': {
        'status':
          'not_applicable' if _271045_result.stdout is search('^NA:', multiline=True)
          else ('not_a_finding' if _271045_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271045_result.stdout | trim,
        'comments':
          'Set removal-action=lock-screen in a dconf keyfile under /etc/dconf/db/local.d/ '
          ~ 'in the [org/gnome/settings-daemon/peripherals/smartcard] section. '
          ~ 'Run dconf update.'
      }
    }) }}"
  tags: [validate]

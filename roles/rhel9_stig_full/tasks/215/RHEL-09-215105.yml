---
# RHEL-09-215105 | V-258241
# RHEL 9 must implement a FIPS 140-3-compliant systemwide cryptographic policy.
# CAT I (High) | CCI-002450
#
# Policy must start with "FIPS" — subpolicies (e.g. FIPS:STIG, FIPS:AD-SUPPORT)
# are explicitly permitted by the STIG. Also verifies CURRENT.pol for:
#   - Required hash algorithms: SHA2-256 SHA2-384 SHA2-512 SHA2-224
#                                SHA3-256 SHA3-384 SHA3-512 SHAKE-256
#   - No SHA1 or weak hashes in the hash line
#   - min_rsa_size >= 2048

- name: RHEL-09-215105 | get current crypto policy
  command: update-crypto-policies --show
  register: _215105_policy
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215105 | get hash and rsa_size from CURRENT.pol
  command: grep -E 'rsa_size|hash' /etc/crypto-policies/state/CURRENT.pol
  register: _215105_pol
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215105 | record FIPS crypto policy status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-215105': {
        'status':
          'not_a_finding'
          if (_215105_pol.stdout | trim
              and _215105_policy.stdout | trim | regex_search('^FIPS')
              and 'SHA2-256' in _215105_pol.stdout
              and 'SHA2-384' in _215105_pol.stdout
              and 'SHA2-512' in _215105_pol.stdout
              and 'SHA2-224' in _215105_pol.stdout
              and 'SHA3-256' in _215105_pol.stdout
              and 'SHA3-384' in _215105_pol.stdout
              and 'SHA3-512' in _215105_pol.stdout
              and 'SHAKE-256' in _215105_pol.stdout
              and 'SHA1' not in (_215105_pol.stdout | regex_search('hash\\s*=.*') | default(''))
              and (_215105_pol.stdout | regex_search('min_rsa_size\\s*=\\s*(\\d+)', '\\1') | default(['0']) | first | int) >= 2048)
          else 'open',
        'finding_details':
          'Crypto policy: ' ~ (_215105_policy.stdout | trim if _215105_policy.stdout | trim else '(no output)')
          ~ '\nPolicy starts with FIPS: '
          ~ ('yes' if _215105_policy.stdout | trim | regex_search('^FIPS') else 'NO')
          ~ '\nCURRENT.pol output: '
          ~ (_215105_pol.stdout | trim if _215105_pol.stdout | trim else '(no output - FINDING)')
          ~ '\nRequired hash algorithms present: '
          ~ ('yes' if ('SHA2-256' in _215105_pol.stdout and 'SHA2-384' in _215105_pol.stdout
                       and 'SHA2-512' in _215105_pol.stdout and 'SHA2-224' in _215105_pol.stdout
                       and 'SHA3-256' in _215105_pol.stdout and 'SHA3-384' in _215105_pol.stdout
                       and 'SHA3-512' in _215105_pol.stdout and 'SHAKE-256' in _215105_pol.stdout)
             else 'NO - check hash line for missing algorithms')
          ~ '\nSHA1 in hash line: '
          ~ ('YES - FINDING' if 'SHA1' in (_215105_pol.stdout | regex_search('hash\\s*=.*') | default(''))
             else 'no')
          ~ '\nmin_rsa_size: '
          ~ ((_215105_pol.stdout | regex_search('min_rsa_size\\s*=\\s*(\\d+)', '\\1') | default(['not found']) | first) | string),
        'comments':
          'Subpolicies are permitted (e.g. FIPS:STIG). '
          ~ 'To set: sudo update-crypto-policies --set FIPS:<subpolicy> && sudo reboot'
      }
    }) }}"
  tags: [validate]

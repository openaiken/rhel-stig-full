---
# RHEL-09-215020 | V-257827
# RHEL 9 must not have the sendmail package installed.
# CAT II (Medium) | CCI-000381

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-215020 | check sendmail is not installed
  shell: |
    if rpm -q --quiet sendmail; then state=installed; else state="not installed"; fi
    echo "sendmail: $state ($(rpm -q sendmail 2>&1 | head -1))"
    if [ "$state" = "not installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: sendmail must be not installed"
    fi
  register: _215020_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-215020 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-215020': {
        'status':
          'not_a_finding' if _215020_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _215020_result.stdout | trim,
        'comments':
          'Remove the package: sudo dnf remove sendmail'
      }
    }) }}"
  tags: [validate]

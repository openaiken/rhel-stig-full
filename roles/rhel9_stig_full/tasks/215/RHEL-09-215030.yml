---
# RHEL-09-215030 | V-257829
# RHEL 9 must not have the ypserv package installed.
# CAT II (Medium) | CCI-000381

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-215030 | check ypserv is not installed
  shell: |
    if rpm -q --quiet ypserv; then state=installed; else state="not installed"; fi
    echo "ypserv: $state ($(rpm -q ypserv 2>&1 | head -1))"
    if [ "$state" = "not installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: ypserv must be not installed"
    fi
  register: _215030_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-215030 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-215030': {
        'status':
          'not_a_finding' if _215030_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _215030_result.stdout | trim,
        'comments':
          'Remove the package: sudo dnf remove ypserv'
      }
    }) }}"
  tags: [validate]

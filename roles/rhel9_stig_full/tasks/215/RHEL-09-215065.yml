---
# RHEL-09-215065 | V-257836
# RHEL 9 must not have the quagga package installed.
# CAT II (Medium) | CCI-000366

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)
# An operational requirement documented with the ISSO is accepted
# (rhel9_attest_documented_exceptions).

- name: RHEL-09-215065 | check quagga is not installed
  shell: |
    if rpm -q --quiet quagga; then state=installed; else state="not installed"; fi
    echo "quagga: $state ($(rpm -q quagga 2>&1 | head -1))"
    if [ "$state" = "not installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: quagga must be not installed"
    fi
  register: _215065_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-215065 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-215065': {
        'status':
          'not_a_finding' if _215065_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-215065')
          else 'open'),
        'finding_details':
          _215065_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-215065') or '(none)'),
        'comments':
          'Remove the package: sudo dnf remove quagga'
      }
    }) }}"
  tags: [validate]

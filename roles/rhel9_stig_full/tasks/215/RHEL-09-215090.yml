---
# RHEL-09-215090 | V-257841
# RHEL 9 must have the rng-tools package installed.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-215090 | check rng-tools is installed
  shell: |
    if rpm -q --quiet rng-tools; then state=installed; else state="not installed"; fi
    echo "rng-tools: $state ($(rpm -q rng-tools 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: rng-tools must be installed"
    fi
  register: _215090_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215090 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-215090': {
        'status':
          'not_a_finding' if _215090_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _215090_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install rng-tools'
      }
    }) }}"
  tags: [validate]

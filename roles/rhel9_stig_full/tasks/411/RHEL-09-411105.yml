---
# RHEL-09-411105 | V-258060
# RHEL 9 must ensure account lockouts persist.
# CAT II (Medium) | CCI-000044

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.

- name: RHEL-09-411105 | check faillock dir
  shell: |
    shopt -s nullglob
    files=(/etc/security/faillock.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="dir" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    # pam_faillock.so arguments override faillock.conf (man pam_faillock): a
    # dir= on a PAM line is the value in effect. Two different values fail.
    pamv=$(grep -hE '^[[:space:]]*(auth|account)[[:space:]]+[^[:space:]]+[[:space:]]+pam_faillock[.]so' /etc/pam.d/system-auth /etc/pam.d/password-auth 2>/dev/null \
           | grep -oE '(^|[[:space:]])dir=[^[:space:]]+' | cut -d= -f2 | sort -u)
    if [ -n "$pamv" ]; then
      echo "pam_faillock.so argument overrides faillock.conf: dir=$(echo $pamv)"
      [ "$(echo "$pamv" | wc -l)" -eq 1 ] && val=$pamv || val=conflicting
    fi
    echo "dir (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'dir' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [ -n "$val" ] && [ "${val%/}" != "/var/run/faillock" ] && [ "${val%/}" != "/run/faillock" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: dir must name a nondefault tally directory"
    fi
  register: _411105_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-411105 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-411105': {
        'status':
          'not_a_finding' if _411105_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _411105_result.stdout | trim,
        'comments':
          'Set dir = /var/log/faillock in /etc/security/faillock.conf.'
      }
    }) }}"
  tags: [validate]

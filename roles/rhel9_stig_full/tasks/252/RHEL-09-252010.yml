---
# RHEL-09-252010 | V-257943
# RHEL 9 must have the chrony package installed.
# CAT II (Medium) | CCI-004923, CCI-001891

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-252010 | check chrony is installed
  shell: |
    if rpm -q --quiet chrony; then state=installed; else state="not installed"; fi
    echo "chrony: $state ($(rpm -q chrony 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: chrony must be installed"
    fi
  register: _252010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-252010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-252010': {
        'status':
          'not_a_finding' if _252010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _252010_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install chrony'
      }
    }) }}"
  tags: [validate]

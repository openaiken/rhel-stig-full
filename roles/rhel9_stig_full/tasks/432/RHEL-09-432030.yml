---
# RHEL-09-432030 | V-258087
# RHEL 9 must restrict privilege elevation to authorized personnel.
# CAT II (Medium) | CCI-002114

# Flags sudoers entries where the user spec is the literal word ALL, giving
# every user on the system unrestricted sudo. Named users/groups (including
# %wheel) are permitted and not flagged.
#
# The two prohibited patterns per the STIG are:
#   ALL  ALL=(ALL) ALL
#   ALL  ALL=(ALL:ALL) ALL
#
# IdM-managed rules are not in local files and are not checked here. Ensure
# IdM sudo rules are scoped to named groups/users, not the ALL user spec.

# NOTE: grep -hn prefixes every output line with "lineno:" (-h drops the
# filename), so every anchor below must allow that prefix. Bare '^\s*' anchors
# never match, which silently disables both the exclusions and the ALL match.
- name: RHEL-09-432030 | check sudoers for unrestricted ALL user-spec entries
  shell: |
    # The files sudo actually reads (visudo -c lists each one it parses):
    # sudo skips sudoers.d names containing a dot or ending in ~, and reads
    # sudoers.d at all only through an includedir line. Grepping the whole
    # directory counted settings sudo never sees.
    sudo_files=$(visudo -c 2>/dev/null | sed -n 's/: parsed OK$//p')
    [ -n "$sudo_files" ] || sudo_files=/etc/sudoers
    # Match lines where the first non-whitespace token (user/group spec) is
    # the bare word ALL, followed by a host/runas/command spec.
    # Exclude comment lines and Defaults/alias definitions.
    hits=$(grep -ihn '' $sudo_files 2>/dev/null \
           | grep -v '^[0-9]*:[[:space:]]*#' \
           | grep -v '^[0-9]*:[[:space:]]*Defaults' \
           | grep -v '^[0-9]*:[[:space:]]*\(User\|Runas\|Cmnd\|Host\)_Alias' \
           | grep -P '^[0-9]*:\s*ALL\s+' \
           | grep -v '%ALL' \
           || true)

    # also check for lines that explicitly grant (ALL:ALL) or (ALL) to any spec
    # but where the user spec itself is ALL
    if [ -z "$hits" ]; then
      echo "STATUS: PASS"
      echo "RAW: No unrestricted ALL user-spec entries found"
    else
      echo "STATUS: FAIL"
      echo "RAW: Unrestricted ALL entries found:"
      echo "$hits"
    fi

    # informational: show all non-comment privilege rules for reviewer
    echo ""
    echo "ALL LOCAL PRIVILEGE RULES (for review):"
    grep -ihn '' $sudo_files 2>/dev/null \
      | grep -v '^[0-9]*:[[:space:]]*#' \
      | grep -v '^[0-9]*:[[:space:]]*Defaults' \
      | grep -v '^[0-9]*:[[:space:]]*\(User\|Runas\|Cmnd\|Host\)_Alias' \
      | grep '=' \
      | sed '/^$/d' \
      || echo "(none)"
  register: _432030_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-432030 | record privilege elevation restriction status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-432030': {
        'status': 'not_a_finding' if _432030_result.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _432030_result.stdout | trim,
        'comments':
          'Replace ALL user-spec entries with named groups (e.g. %wheel). '
          ~ 'Verify IdM sudo rules are also scoped to named groups, not the ALL user spec.'
      }
    }) }}"
  tags: [validate]

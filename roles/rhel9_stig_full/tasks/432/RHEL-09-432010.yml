---
# RHEL-09-432010 | V-258083
# RHEL 9 must have the sudo package installed.
# CAT II (Medium) | CCI-002235

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-432010 | check sudo is installed
  shell: |
    if rpm -q --quiet sudo; then state=installed; else state="not installed"; fi
    echo "sudo: $state ($(rpm -q sudo 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: sudo must be installed"
    fi
  register: _432010_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-432010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-432010': {
        'status':
          'not_a_finding' if _432010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _432010_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install sudo'
      }
    }) }}"
  tags: [validate]

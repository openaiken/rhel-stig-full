---
# RHEL-09-654010 | V-258176
# RHEL 9 must audit uses of the "execve" system call.
# CAT II (Medium) | CCI-002233, CCI-002234

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The formal role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654010 | read audit rules
  command: auditctl -l
  register: _654010_rules
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-654010 | record audit rule coverage
  vars:
    _654010_expected:
      - "-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k execpriv"
      - "-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k execpriv"
      - "-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k execpriv"
      - "-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k execpriv"
    _654010_cov: "{{ _654010_rules.stdout | default('') | rhel9_audit_coverage(_654010_expected) }}"
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654010': {
        'status':
          'not_a_finding'
          if (_654010_rules.rc | default(1) == 0 and _654010_cov.loaded > 0 and _654010_cov.missing | length == 0)
          else 'open',
        'finding_details': _654010_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

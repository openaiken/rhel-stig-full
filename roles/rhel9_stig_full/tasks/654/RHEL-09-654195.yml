---
# RHEL-09-654195 | V-258213
# Successful/unsuccessful uses of the reboot command in RHEL 9 must generate
# an audit record.
# CAT II (Medium) | CCI-000172

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The formal role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654195 | read audit rules
  command: auditctl -l
  register: _654195_rules
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-654195 | record audit rule coverage
  vars:
    _654195_expected:
      - "-a always,exit -S all -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-reboot"
    _654195_cov: "{{ _654195_rules.stdout | default('') | rhel9_audit_coverage(_654195_expected) }}"
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654195': {
        'status':
          'not_a_finding'
          if (_654195_rules.rc | default(1) == 0 and _654195_cov.loaded > 0 and _654195_cov.missing | length == 0)
          else 'open',
        'finding_details': _654195_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

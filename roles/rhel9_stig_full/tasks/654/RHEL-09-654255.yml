---
# RHEL-09-654255 | V-258225
# RHEL 9 must generate audit records for all account creations, modifications,
# disabling, and termination events that affect /var/log/lastlog.
# CAT II (Medium) | CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-002884

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The formal role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654255 | read audit rules
  command: auditctl -l
  register: _654255_rules
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-654255 | record audit rule coverage
  vars:
    _654255_expected:
      - "-a always,exit -F arch=b32 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins"
      - "-a always,exit -F arch=b64 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins"
    _654255_cov: "{{ _654255_rules.stdout | default('') | rhel9_audit_coverage(_654255_expected) }}"
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654255': {
        'status':
          'not_a_finding'
          if (_654255_rules.rc | default(1) == 0 and _654255_cov.loaded > 0 and _654255_cov.missing | length == 0)
          else 'open',
        'finding_details': _654255_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

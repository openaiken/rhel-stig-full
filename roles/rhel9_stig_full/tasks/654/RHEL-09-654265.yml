---
# RHEL-09-654265 | V-258227
# RHEL 9 must take appropriate action when a critical audit processing failure
# occurs.
# CAT II (Medium) | CCI-000139, CCI-000140

# The STIG reads /etc/audit/audit.rules, the file augenrules generates from
# rules.d. The formal role checks for its own line in rules.d/audit.rules, so a
# host setting this in another rules.d file was reported open while compliant.
# auditctl applies the last -f. Availability documented as the overriding
# concern is accepted (rhel9_attest_documented_exceptions).

- name: RHEL-09-654265 | check audit failure mode -f 2
  shell: |
    rules=$(grep -vE '^[[:space:]]*(#|$)' /etc/audit/audit.rules 2>/dev/null)
    val=$(echo "$rules" | awk '$1 == "-f" { v = $2 } END { print v }')
    echo "-f in audit.rules (last wins): ${val:-(not set)}"
    if [ "$val" = "2" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: -f must be 2"
    fi
  register: _654265_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-654265 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654265': {
        'status':
          'not_a_finding' if _654265_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-654265')
          else 'open'),
        'finding_details':
          _654265_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-654265') or '(none)'),
        'comments':
          'Add -f 2 to a file in /etc/audit/rules.d/ and run augenrules --load.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-654225 | V-258219
# RHEL 9 must generate audit records for all account creations, modifications,
# disabling, and termination events that affect /etc/group.
# CAT II (Medium) | CCI-000018, CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-001403, CCI-001404, CCI-001405, CCI-002130, CCI-000015, CCI-002884, CCI-002132

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The DISA Ansible role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654225 | read audit rules
  command: auditctl -l
  register: _654225_rules
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-654225 | record audit rule coverage
  vars:
    _654225_expected:
      - "-a always,exit -F arch=b32 -F path=/etc/group -F perm=wa -k identity"
      - "-a always,exit -F arch=b64 -F path=/etc/group -F perm=wa -k identity"
    _654225_cov: "{{ _654225_rules.stdout | default('') | rhel9_audit_coverage(_654225_expected) }}"
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654225': {
        'status':
          'not_a_finding'
          if (_654225_rules.rc | default(1) == 0 and _654225_cov.loaded > 0 and _654225_cov.missing | length == 0)
          else 'open',
        'finding_details': _654225_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

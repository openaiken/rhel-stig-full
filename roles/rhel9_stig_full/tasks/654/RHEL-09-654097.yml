---
# RHEL-09-654097 | V-279936
# RHEL 9 must audit any script or executable called by cron as root or by any
# privileged user.
# CAT II (Medium) | CCI-000172

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The formal role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654097 | read audit rules
  command: auditctl -l
  register: _654097_rules
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-654097 | record audit rule coverage
  vars:
    _654097_expected:
      - "-a always,exit -F arch=b64 -S execve -F subj_type=crond_t -F euid=0 -k cron_exec"
      - "-a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F euid=0 -k cron_exec"
      - "-a always,exit -F arch=b64 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec"
      - "-a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec"
    _654097_cov: "{{ _654097_rules.stdout | default('') | rhel9_audit_coverage(_654097_expected) }}"
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-654097': {
        'status':
          'not_a_finding'
          if (_654097_rules.rc | default(1) == 0 and _654097_cov.loaded > 0 and _654097_cov.missing | length == 0)
          else 'open',
        'finding_details': _654097_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

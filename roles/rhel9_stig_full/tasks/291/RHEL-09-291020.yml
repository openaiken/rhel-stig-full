---
# RHEL-09-291020 | V-258036
# RHEL 9 must have the USBGuard package enabled.
# CAT II (Medium) | CCI-001958, CCI-003959

# The formal role only manages this service where usbguard is installed, so
# on a host without it the rule had no result and rendered as not_reviewed.
# Not a finding for a VM with no USB peripherals (rhel9_attest_usbguard_na),
# or where the SA documents another blocking mechanism
# (rhel9_attest_usbguard_compliant + rhel9_attest_usbguard_method), matching
# RHEL-09-291030.

- name: RHEL-09-291020 | check usbguard service state
  shell: |
    rpm -q usbguard &>/dev/null || echo "usbguard package not installed"
    echo "usbguard: $(systemctl is-active usbguard 2>&1)"
  register: _291020_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-291020 | record usbguard service status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-291020': {
        'status':
          'not_a_finding' if rhel9_attest_usbguard_na | bool
          else ('not_a_finding' if _291020_result.stdout is search('^usbguard: active$', multiline=True)
          else ('not_a_finding' if rhel9_attest_usbguard_compliant | bool
          else 'open')),
        'finding_details':
          (_291020_result.stdout | trim)
          ~ '\nAttestation (rhel9_attest_usbguard_na): '
          ~ (rhel9_attest_usbguard_na | bool | string | lower)
          ~ '\nAttestation (rhel9_attest_usbguard_compliant): '
          ~ (rhel9_attest_usbguard_compliant | bool | string | lower)
          ~ '\nSA documented method: '
          ~ (rhel9_attest_usbguard_method if rhel9_attest_usbguard_method else '(not provided)'),
        'comments':
          'Install and enable usbguard: sudo dnf install usbguard; '
          ~ 'sudo systemctl enable --now usbguard. For a VM with no USB peripherals '
          ~ 'set rhel9_attest_usbguard_na: true; for another blocking mechanism set '
          ~ 'rhel9_attest_usbguard_compliant: true and rhel9_attest_usbguard_method.'
      }
    }) }}"
  tags: [validate]

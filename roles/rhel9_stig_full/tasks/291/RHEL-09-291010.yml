---
# RHEL-09-291010 | V-258034
# RHEL 9 must be configured to disable USB mass storage.
# CAT II (Medium) | CCI-000778, CCI-001958, CCI-003959

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Both lines the STIG shows are required, uncommented, in any file it lists
# (install <module> /bin/false, and blacklist <module>); the module name is
# matched as a whole word. /bin/true is accepted as well: either prevents
# loading. A use documented with the ISSO is accepted
# (rhel9_attest_documented_exceptions).

- name: RHEL-09-291010 | check usb-storage module is disabled
  shell: |
    lines=$(grep -hsE '^[[:space:]]*(install|blacklist)[[:space:]]+usb-storage([[:space:]]|$)' /etc/modprobe.conf /etc/modprobe.d/*)
    echo "modprobe lines for usb-storage: $(echo "$lines" | tr '\n' ' ')"
    inst=$(echo "$lines" | grep -E '^[[:space:]]*install[[:space:]]+usb-storage[[:space:]]+/(usr/)?bin/(false|true)[[:space:]]*$')
    bl=$(echo "$lines" | grep -E '^[[:space:]]*blacklist[[:space:]]+usb-storage[[:space:]]*$')
    if [ -n "$inst" ] && [ -n "$bl" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: both install usb-storage /bin/false and blacklist usb-storage are required"
    fi
  register: _291010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-291010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-291010': {
        'status':
          'not_a_finding' if _291010_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-291010')
          else 'open'),
        'finding_details':
          _291010_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-291010') or '(none)'),
        'comments':
          'Add install usb-storage /bin/false and blacklist usb-storage to a file in /etc/modprobe.d/.'
      }
    }) }}"
  tags: [validate]

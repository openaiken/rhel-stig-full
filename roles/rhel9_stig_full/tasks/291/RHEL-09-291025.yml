---
# RHEL-09-291025 | V-258037
# RHEL 9 must enable Linux audit logging for the USBGuard daemon.
# CAT III (Low) | CCI-000169

# The DISA Ansible role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The DISA Ansible role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.
# Not a finding for a VM with no USB peripherals (rhel9_attest_usbguard_na).

- name: RHEL-09-291025 | check usbguard AuditBackend
  shell: |
    shopt -s nullglob
    files=(/etc/usbguard/usbguard-daemon.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="AuditBackend" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "AuditBackend (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'AuditBackend' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [[ "${val,,}" =~ ^(linuxaudit)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: AuditBackend must be LinuxAudit"
    fi
  register: _291025_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-291025 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-291025': {
        'status':
          'not_a_finding' if _291025_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_usbguard_na | bool)
          else 'open'),
        'finding_details':
          _291025_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_usbguard_na): '
          ~ (rhel9_attest_usbguard_na | bool | string | lower),
        'comments':
          'Set AuditBackend=LinuxAudit in /etc/usbguard/usbguard-daemon.conf.'
      }
    }) }}"
  tags: [validate]

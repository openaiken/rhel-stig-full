---
# RHEL-09-231020 | V-257845
# RHEL 9 must use a separate file system for /var.
# CAT III (Low) | CCI-000366

# Checks that /var is mounted as a separate filesystem.

- name: RHEL-09-231020 | check /var is a separate filesystem
  shell: awk '$2 == "/var"' /proc/mounts
  register: _231020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231020 | record /var separate filesystem status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231020': {
        'status': 'not_a_finding' if (_231020_result.stdout | trim) else 'open',
        'finding_details':
          '/proc/mounts entry: '
          ~ (_231020_result.stdout | trim if _231020_result.stdout | trim else '(not a separate mount - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - /var is a separate filesystem'
             if (_231020_result.stdout | trim)
             else 'OPEN - /var is not on a separate filesystem'),
        'comments': 'Requires a dedicated partition or logical volume. Configure in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231100 | V-257861
# RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot directory.
# CAT II (Medium) | CCI-001764

# Checks that /boot is mounted with the nosuid option.
# An empty result means /boot is not separately mounted, which is also a finding.

- name: RHEL-09-231100 | get /boot mount options
  shell: awk '$2 == "/boot" { print $4 }' /proc/mounts
  register: _231100_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-231100 | record /boot nosuid mount option status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231100': {
        'status':
          'not_a_finding'
          if ('nosuid' in (_231100_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/boot mount options: '
          ~ (_231100_result.stdout | default('') | trim
             if _231100_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nosuid is set on /boot'
             if ('nosuid' in (_231100_result.stdout | default('')))
             else 'OPEN - nosuid not found in /boot mount options'),
        'comments': 'Add nosuid to the /boot entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

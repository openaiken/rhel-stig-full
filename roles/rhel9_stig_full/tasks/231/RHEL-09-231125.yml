---
# RHEL-09-231125 | V-257866
# RHEL 9 must mount /tmp with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /tmp is mounted with the nodev option.
# An empty result means /tmp is not separately mounted, which is also a finding.

- name: RHEL-09-231125 | get /tmp mount options
  shell: awk '$2 == "/tmp" { print $4 }' /proc/mounts
  register: _231125_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231125 | record /tmp nodev mount option status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231125': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231125_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/tmp mount options: '
          ~ (_231125_result.stdout | default('') | trim
             if _231125_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /tmp'
             if ('nodev' in (_231125_result.stdout | default('')))
             else 'OPEN - nodev not found in /tmp mount options'),
        'comments': 'Add nodev to the /tmp entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231095 | V-257860
# RHEL 9 must mount /boot with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /boot is mounted with the nodev option.
# An empty result means /boot is not separately mounted, which is also a finding.

- name: RHEL-09-231095 | get /boot mount options
  shell: awk '$2 == "/boot" { print $4 }' /proc/mounts
  register: _231095_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231095 | record /boot nodev mount option status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231095': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231095_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/boot mount options: '
          ~ (_231095_result.stdout | default('') | trim
             if _231095_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /boot'
             if ('nodev' in (_231095_result.stdout | default('')))
             else 'OPEN - nodev not found in /boot mount options'),
        'comments': 'Add nodev to the /boot entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231040 | V-257849
# RHEL 9 file system automount function must be disabled unless required.
# CAT II (Medium) | CCI-000778, CCI-001958

# autofs must be masked or disabled. Not applicable if not installed.

- name: RHEL-09-231040 | check autofs service state
  command: systemctl is-enabled autofs
  register: _231040_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231040 | record autofs status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231040': {
        'status':
          'not_applicable'
          if 'Failed to get unit file state' in (_231040_result.stdout | default(''))
             or _231040_result.rc == 1 and not (_231040_result.stdout | trim)
          else ('not_a_finding'
                if (_231040_result.stdout | trim) in ['masked', 'disabled']
                else 'open'),
        'finding_details':
          'systemctl is-enabled autofs: '
          ~ (_231040_result.stdout | trim if _231040_result.stdout | trim else '(not installed)')
          ~ '\nResult: '
          ~ ('not_applicable - autofs is not installed'
             if 'Failed to get unit file state' in (_231040_result.stdout | default(''))
                or _231040_result.rc == 1 and not (_231040_result.stdout | trim)
             else ('not_a_finding - autofs is ' ~ (_231040_result.stdout | trim)
                   if (_231040_result.stdout | trim) in ['masked', 'disabled']
                   else 'OPEN - autofs is enabled; must be masked or disabled')),
        'comments': 'To remediate: sudo systemctl mask autofs'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231145 | V-257870
# RHEL 9 must mount /var/log with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /var/log is mounted with the nodev option.
# An empty result means /var/log is not separately mounted, which is also a finding.

- name: RHEL-09-231145 | get /var/log mount options
  shell: awk '$2 == "/var/log" { print $4 }' /proc/mounts
  register: _231145_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231145 | record /var/log nodev mount option status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231145': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231145_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/log mount options: '
          ~ (_231145_result.stdout | default('') | trim
             if _231145_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /var/log'
             if ('nodev' in (_231145_result.stdout | default('')))
             else 'OPEN - nodev not found in /var/log mount options'),
        'comments': 'Add nodev to the /var/log entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231075 | V-257856
# RHEL 9 must prevent files with the setuid and setgid bit set from being executed on file systems that are imported via Network File System (NFS).
# CAT II (Medium) | CCI-000366

# N/A if no NFS mounts are configured in /etc/fstab.
# All NFS fstab entries must have the nosuid option.

- name: RHEL-09-231075 | get all NFS entries from fstab
  shell: grep -Ei '^[^#].*\bnfs[0-9]?\b' /etc/fstab || true
  register: _231075_result_all
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-231075 | get NFS fstab entries missing nosuid
  shell: grep -Ei '^[^#].*\bnfs[0-9]?\b' /etc/fstab | grep -v 'nosuid' || true
  register: _231075_result_bad
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-231075 | record NFS nosuid status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231075': {
        'status':
          'not_applicable' if not (_231075_result_all.stdout | trim)
          else ('not_a_finding' if not (_231075_result_bad.stdout | trim) else 'open'),
        'finding_details':
          'NFS fstab entries: '
          ~ (_231075_result_all.stdout | trim if _231075_result_all.stdout | trim else '(none - not applicable)')
          ~ '\nEntries missing nosuid: '
          ~ (_231075_result_bad.stdout | trim if _231075_result_bad.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_applicable - no NFS mounts configured'
             if not (_231075_result_all.stdout | trim)
             else ('not_a_finding - all NFS mounts have nosuid'
                   if not (_231075_result_bad.stdout | trim)
                   else 'OPEN - one or more NFS mounts missing nosuid')),
        'comments': 'Add nosuid to all NFS entries in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231085 | V-257858
# RHEL 9 must prevent special devices on file systems that are used with removable media.
# CAT II (Medium) | CCI-000366

# Removable media: fstab entries whose type (vfat, fat, msdos, ntfs, ntfs3, exfat, iso9660, udf)
# is used for removable media, excluding /boot and /boot/efi, which are fixed
# disks (on UEFI, /boot/efi is always vfat). Fields are parsed exactly: the
# option must be a whole comma-separated token, not a substring of the line.
# This formerly missed CD/DVD types (iso9660, udf), and 231085/231090 did not
# exclude /boot/efi, reporting every stock host a finding.

- name: RHEL-09-231085 | get removable media entries from fstab
  shell: >-
    awk '!/^[[:space:]]*#/ && NF >= 4 && $3 ~ /^(vfat|fat|msdos|ntfs|ntfs3|exfat|iso9660|udf)$/ && $2 != "/boot" && $2 != "/boot/efi"' /etc/fstab
  register: _231085_result_all
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231085 | get removable media fstab entries missing nodev
  shell: >-
    awk '!/^[[:space:]]*#/ && NF >= 4 && $3 ~ /^(vfat|fat|msdos|ntfs|ntfs3|exfat|iso9660|udf)$/ && $2 != "/boot" && $2 != "/boot/efi" && ("," $4 ",") !~ /,nodev,/' /etc/fstab
  register: _231085_result_bad
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231085 | record removable media nodev status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231085': {
        'status':
          'not_a_finding' if not (_231085_result_all.stdout | trim)
          else ('not_a_finding' if not (_231085_result_bad.stdout | trim) else 'open'),
        'finding_details':
          'Removable media fstab entries: '
          ~ (_231085_result_all.stdout | trim if _231085_result_all.stdout | trim else '(none)')
          ~ '\nEntries missing nodev: '
          ~ (_231085_result_bad.stdout | trim if _231085_result_bad.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - no removable media entries in fstab'
             if not (_231085_result_all.stdout | trim)
             else ('not_a_finding - all removable media entries have nodev'
                   if not (_231085_result_bad.stdout | trim)
                   else 'OPEN - one or more removable media entries missing nodev')),
        'comments': 'Add nodev to all removable media entries in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

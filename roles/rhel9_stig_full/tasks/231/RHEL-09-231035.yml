---
# RHEL-09-231035 | V-257848
# RHEL 9 must use a separate file system for /var/tmp.
# CAT II (Medium) | CCI-000366

# Checks that /var/tmp is mounted as a separate filesystem.

- name: RHEL-09-231035 | check /var/tmp is a separate filesystem
  shell: awk '$2 == "/var/tmp"' /proc/mounts
  register: _231035_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231035 | record /var/tmp separate filesystem status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231035': {
        'status': 'not_a_finding' if (_231035_result.stdout | trim) else 'open',
        'finding_details':
          '/proc/mounts entry: '
          ~ (_231035_result.stdout | trim if _231035_result.stdout | trim else '(not a separate mount - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - /var/tmp is a separate filesystem'
             if (_231035_result.stdout | trim)
             else 'OPEN - /var/tmp is not on a separate filesystem'),
        'comments': 'Requires a dedicated partition or logical volume. Configure in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

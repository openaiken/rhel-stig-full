---
# RHEL-09-231070 | V-257855
# RHEL 9  must prevent code from being executed on file systems that are imported via Network File System (NFS).
# CAT II (Medium) | CCI-000366

# N/A if no NFS mounts are configured in /etc/fstab.
# All NFS fstab entries must have the noexec option.

- name: RHEL-09-231070 | get all NFS entries from fstab
  shell: grep -Ei '^[^#].*\bnfs[0-9]?\b' /etc/fstab || true
  register: _231070_result_all
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231070 | get NFS fstab entries missing noexec
  shell: grep -Ei '^[^#].*\bnfs[0-9]?\b' /etc/fstab | grep -v 'noexec' || true
  register: _231070_result_bad
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231070 | record NFS noexec status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231070': {
        'status':
          'not_applicable' if not (_231070_result_all.stdout | trim)
          else ('not_a_finding' if not (_231070_result_bad.stdout | trim) else 'open'),
        'finding_details':
          'NFS fstab entries: '
          ~ (_231070_result_all.stdout | trim if _231070_result_all.stdout | trim else '(none - not applicable)')
          ~ '\nEntries missing noexec: '
          ~ (_231070_result_bad.stdout | trim if _231070_result_bad.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_applicable - no NFS mounts configured'
             if not (_231070_result_all.stdout | trim)
             else ('not_a_finding - all NFS mounts have noexec'
                   if not (_231070_result_bad.stdout | trim)
                   else 'OPEN - one or more NFS mounts missing noexec')),
        'comments': 'Add noexec to all NFS entries in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

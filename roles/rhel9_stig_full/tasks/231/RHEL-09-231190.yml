---
# RHEL-09-231190 | V-257879
# RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection.
# CAT I (High) | CCI-001199, CCI-002475, CCI-002476

# Follows the STIG: every persistent filesystem other than /boot and /boot/efi
# must have a crypt device of type LUKS somewhere in its block device tree.
# The check formerly passed if any crypt device existed at all, so an
# encrypted swap or data volume passed a host whose / was plaintext.
# N/A if rhel9_attest_disk_encryption_na is true (hypervisor/storage provides
# encryption per documented organizational approval).

- name: RHEL-09-231190 | check each persistent filesystem for a LUKS parent
  shell: |
    n=0
    while read -r src tgt; do
      case "$tgt" in /boot|/boot/efi) continue ;; esac
      src=${src%%[*}   # bind mounts show as /dev/x[/subdir]
      n=$((n+1))
      crypt=$(lsblk -s -nr -o NAME,TYPE "$src" 2>/dev/null | awk '$2 == "crypt" {print $1; exit}')
      if [ -z "$crypt" ]; then
        echo "FAIL: $tgt ($src) has no crypt device in its block tree"
        continue
      fi
      type=$(cryptsetup status "$crypt" 2>/dev/null | awk '$1 == "type:" {print $2}')
      case "$type" in
        LUKS*) echo "PASS: $tgt ($src) is on $crypt ($type)" ;;
        *) echo "FAIL: $tgt ($src) crypt device $crypt is not LUKS (type: ${type:-unknown})" ;;
      esac
    done < <(findmnt -rn --real -o SOURCE,TARGET | awk '$1 ~ /^[/]dev[/]/')
    echo "FILESYSTEMS CHECKED: $n"
  register: _231190_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-231190 | record disk encryption status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-231190': {
        'status':
          'not_applicable' if rhel9_attest_disk_encryption_na | bool
          else ('not_a_finding'
                if (_231190_result.stdout is search('^FILESYSTEMS CHECKED: [1-9]', multiline=True)
                    and 'FAIL:' not in _231190_result.stdout)
                else 'open'),
        'finding_details':
          'Attestation N/A (rhel9_attest_disk_encryption_na): '
          ~ (rhel9_attest_disk_encryption_na | bool | string | lower)
          ~ '\n' ~ (_231190_result.stdout | trim)
          ~ '\nSA documented encryption method: '
          ~ (rhel9_attest_disk_encryption_method if rhel9_attest_disk_encryption_method else '(not provided)'),
        'comments':
          'Set rhel9_attest_disk_encryption_na: true in stig_attestation.yml '
          ~ 'if encryption is provided by a hypervisor or storage array per org approval, '
          ~ 'and document the method in rhel9_attest_disk_encryption_method. '
          ~ 'Otherwise configure LUKS full-disk encryption at installation time.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-652015 | V-258141
# RHEL 9 must have the packages required for encrypting offloaded audit logs
# installed.
# CAT II (Medium) | CCI-000803

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-652015 | check rsyslog-gnutls is installed
  shell: |
    if rpm -q --quiet rsyslog-gnutls; then state=installed; else state="not installed"; fi
    echo "rsyslog-gnutls: $state ($(rpm -q rsyslog-gnutls 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: rsyslog-gnutls must be installed"
    fi
  register: _652015_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-652015 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-652015': {
        'status':
          'not_a_finding' if _652015_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _652015_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install rsyslog-gnutls'
      }
    }) }}"
  tags: [validate]

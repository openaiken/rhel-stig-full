---
# RHEL-09-652040 | V-258146
# RHEL 9 must authenticate the remote logging server for offloading audit logs
# via rsyslog.
# CAT II (Medium) | CCI-001851

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Parsed across /etc/rsyslog.conf and /etc/rsyslog.d/*.conf, comments removed.
# Accepted in the legacy directive or an omfwd action block; the STIG makes
# the setting in a module block a finding.
# The STIG asks how logs are offloaded when rsyslog does not do it:
# rhel9_attest_alt_log_offload is accepted.

- name: RHEL-09-652040 | check rsyslog TLS peer authentication
  shell: |
    shopt -s nullglob
    conf=(/etc/rsyslog.conf /etc/rsyslog.d/*.conf)
    # RainerScript blocks, one per line: ACTION/MODULE/GLOBAL: <parameters>
    blocks=$(awk '
      { sub(/#.*/, ""); buf = buf " " $0 }
      END {
        s = buf
        while (match(s, /(action|module|global)[[:space:]]*\(/)) {
          kind = substr(s, RSTART, RLENGTH); sub(/[[:space:]]*\($/, "", kind)
          i = RSTART + RLENGTH; start = i; depth = 1
          while (i <= length(s) && depth > 0) {
            c = substr(s, i, 1); if (c == "(") depth++; else if (c == ")") depth--; i++
          }
          print toupper(kind) ": " substr(s, start, i - start - 1)
          s = substr(s, i)
        }
      }' "${conf[@]}" 2>/dev/null)
    legacy=$(grep -hiE '^[[:space:]]*\$' "${conf[@]}" 2>/dev/null)
    fwd=$(echo "$blocks" | grep -iE '^ACTION:.*type[[:space:]]*=[[:space:]]*"omfwd"')
    legacy_ok=$(echo "$legacy" | grep -iE '^[[:space:]]*\$ActionSendStreamDriverAuthMode[[:space:]]+x509/name[[:space:]]*$')
    action_ok=$(echo "$fwd" | grep -iE 'StreamDriver\.?AuthMode[[:space:]]*=[[:space:]]*"x509/name"')
    global_ok=$(echo "$blocks" | grep -iE '^GLOBAL:.*StreamDriver\.?AuthMode[[:space:]]*=[[:space:]]*"x509/name"')
    in_module=$(echo "$blocks" | grep -iE '^MODULE:.*StreamDriver\.?AuthMode')
    echo "legacy directive: ${legacy_ok:-(none)}"
    echo "omfwd actions: ${fwd:-(none)}"
    [ -n "$global_ok" ] && echo "global: $global_ok"
    [ -n "$in_module" ] && echo "MODULE BLOCK: $in_module"
    if [ -n "$in_module" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: StreamDriver\.?AuthMode is set in a module block, which the STIG makes a finding"
    elif [ -n "$legacy_ok" ] || [ -n "$action_ok" ] || [ -n "$global_ok" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: StreamDriverAuthMode x509/name is not configured"
    fi
  register: _652040_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-652040 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-652040': {
        'status':
          'not_a_finding' if _652040_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_alt_log_offload | bool)
          else 'open'),
        'finding_details':
          _652040_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_alt_log_offload): '
          ~ (rhel9_attest_alt_log_offload | bool | string | lower),
        'comments':
          'Set $ActionSendStreamDriverAuthMode x509/name, or StreamDriverAuthMode=x509/name in the omfwd action.'
      }
    }) }}"
  tags: [validate]

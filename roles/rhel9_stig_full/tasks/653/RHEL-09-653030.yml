---
# RHEL-09-653030 | V-258155
# RHEL 9 must allocate audit record storage capacity to store at least one
# week's worth of audit records.
# CAT II (Medium) | CCI-001849, CCI-001851

# Checks the SIZE of the partition holding the audit logs against the site
# threshold rhel9_audit_min_storage_gb (default 2GB, the owner decision; the
# STIG only calls 10GB typical). Free space is deliberately not the measure:
# auditd is expected to roll off old logs, so a full-but-rotating partition is
# fine. Size is taken from the block device, as provisioned; the filesystem
# size df reports is a few percent smaller (a 2GiB volume shows 1.94GiB), so
# comparing that would fail a volume created at exactly the threshold. Falls
# back to the df size when the source is not a block device.
#
# Not applicable when audit records are forwarded immediately to a remote
# facility (audisp-remote, SPLUNK heavy forwarder, etc.) such that extended
# local retention is not required — set rhel9_attest_audit_immediate_offload.

- name: RHEL-09-653030 | check audit log partition storage capacity
  shell: |
    conf=/etc/audit/auditd.conf
    if [ ! -f "$conf" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: $conf not found"
      exit 0
    fi

    log_file=$(grep -E '^\s*log_file\s*=' "$conf" | awk -F'=' '{print $2}' | xargs)
    log_file=${log_file:-/var/log/audit/audit.log}
    log_dir=$(dirname "$log_file")

    src=$(findmnt -no SOURCE --target "$log_dir" 2>/dev/null)
    mnt=$(findmnt -no TARGET --target "$log_dir" 2>/dev/null)
    dev_bytes=$(lsblk -bdno SIZE "$src" 2>/dev/null | head -1)
    fs_kb=$(df -P "$log_dir" 2>/dev/null | awk 'NR==2{print $2}')
    if [ -n "$dev_bytes" ]; then
      size_gb=$(awk -v b="$dev_bytes" 'BEGIN{printf "%.2f", b / 1073741824}')
      basis="block device"
    elif [ -n "$fs_kb" ]; then
      size_gb=$(awk -v k="$fs_kb" 'BEGIN{printf "%.2f", k / 1048576}')
      basis="filesystem (df)"
    else
      echo "STATUS: FAIL"
      echo "FAIL: could not determine the size of the partition holding $log_dir"
      exit 0
    fi
    min_gb=${AUDIT_MIN_STORAGE_GB:-2}

    if awk -v s="$size_gb" -v m="$min_gb" 'BEGIN{exit (s >= m ? 0 : 1)}'; then
      echo "STATUS: PASS"
      echo "PASS: ${size_gb}GB partition holds $log_dir (threshold: ${min_gb}GB, from ${basis})"
    else
      echo "STATUS: FAIL"
      echo "FAIL: only a ${size_gb}GB partition holds $log_dir (threshold: ${min_gb}GB, from ${basis})"
    fi
    echo "PARTITION: ${src:-unknown} mounted at ${mnt:-unknown}"
    df -P "$log_dir" | awk 'NR==2{printf "FILESYSTEM SIZE: %.2fGB  AVAIL: %.2fGB\n", $2/1048576, $4/1048576}'
  register: _653030_result
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    AUDIT_MIN_STORAGE_GB: "{{ rhel9_audit_min_storage_gb | default(2) }}"
  tags: [validate]

- name: RHEL-09-653030 | record audit storage capacity status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-653030': {
        'status':
          'not_applicable' if (rhel9_attest_audit_immediate_offload | default(false) | bool)
          else ('not_a_finding' if _653030_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open'),
        'finding_details':
          _653030_result.stdout | trim
          ~ '\nMinimum storage threshold (rhel9_audit_min_storage_gb): '
          ~ (rhel9_audit_min_storage_gb | default(2) | string)
          ~ 'GB\nAttestation (rhel9_attest_audit_immediate_offload): '
          ~ (rhel9_attest_audit_immediate_offload | default(false) | bool | string | lower)
          ~ '\nSA documented offload method: '
          ~ (rhel9_attest_audit_immediate_offload_method
             if rhel9_attest_audit_immediate_offload_method | default('')
             else '(not provided)'),
        'comments':
          'Resize the partition hosting /var/log/audit/ or relocate audit logs '
          ~ 'to a larger dedicated partition. Adjust rhel9_audit_min_storage_gb '
          ~ 'to match site requirements (default 2GB; the STIG calls 10GB typical). '
          ~ 'The partition size is checked, not free space: rotation is expected.'
      }
    }) }}"
  tags: [validate]

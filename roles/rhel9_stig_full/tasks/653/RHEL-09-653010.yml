---
# RHEL-09-653010 | V-258151
# RHEL 9 audit package must be installed.
# CAT II (Medium) | CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000159, CCI-000169, CCI-000172, CCI-001464, CCI-001487, CCI-003938, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-001914, CCI-002884, CCI-001814

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-653010 | check audit is installed
  shell: |
    if rpm -q --quiet audit; then state=installed; else state="not installed"; fi
    echo "audit: $state ($(rpm -q audit 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: audit must be installed"
    fi
  register: _653010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-653010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-653010': {
        'status':
          'not_a_finding' if _653010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _653010_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install audit'
      }
    }) }}"
  tags: [validate]

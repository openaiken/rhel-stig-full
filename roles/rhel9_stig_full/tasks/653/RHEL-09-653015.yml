---
# RHEL-09-653015 | V-258152
# RHEL 9 audit service must be enabled.
# CAT II (Medium) | CCI-000130, CCI-000131, CCI-000132, CCI-000133, CCI-000134, CCI-000135, CCI-000154, CCI-000158, CCI-000169, CCI-000172, CCI-001464, CCI-001487, CCI-003938, CCI-001875, CCI-001876, CCI-001877, CCI-001878, CCI-001879, CCI-001880, CCI-001881, CCI-001882, CCI-001889, CCI-001914, CCI-002884, CCI-004188, CCI-001814

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-653015 | check auditd is active
  shell: |
    active=$(systemctl is-active auditd 2>/dev/null)
    sub=$(systemctl show auditd -p SubState --value 2>/dev/null)
    echo "auditd: ActiveState=${active:-unknown} SubState=${sub:-unknown}"
    if [ "$active" = "active" ] && [ "$sub" = "running" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: auditd is not active and running"
    fi
  register: _653015_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-653015 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-653015': {
        'status':
          'not_a_finding' if _653015_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _653015_result.stdout | trim,
        'comments':
          'Enable and start it: sudo systemctl enable --now auditd'
      }
    }) }}"
  tags: [validate]

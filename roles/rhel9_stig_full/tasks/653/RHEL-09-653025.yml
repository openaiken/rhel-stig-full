---
# RHEL-09-653025 | V-258154
# RHEL 9 audit system must take appropriate action when the audit storage
# volume is full.
# CAT II (Medium) | CCI-000140

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The value is compared case-insensitively, as auditd reads it.

- name: RHEL-09-653025 | check disk_full_action
  shell: |
    val=$(grep -iE '^[[:space:]]*disk_full_action[[:space:]]*=' /etc/audit/auditd.conf 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '[:space:]')
    echo "disk_full_action (auditd.conf, last wins): ${val:-(not set)}"
    if [[ "${val^^}" =~ ^(SYSLOG|SINGLE|HALT)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: disk_full_action must be one of: SYSLOG, SINGLE, HALT"
    fi
  register: _653025_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-653025 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-653025': {
        'status':
          'not_a_finding' if _653025_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _653025_result.stdout | trim,
        'comments':
          'Set disk_full_action = HALT (or SYSLOG, SINGLE) in /etc/audit/auditd.conf.'
      }
    }) }}"
  tags: [validate]

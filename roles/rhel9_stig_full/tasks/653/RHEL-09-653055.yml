---
# RHEL-09-653055 | V-258160
# RHEL 9 audit system must take appropriate action when the audit files have
# reached maximum size.
# CAT II (Medium) | CCI-000140

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.
# The check text asks the SA for another mechanism when this is not set, so
# a documented exception is accepted (rhel9_attest_documented_exceptions).

- name: RHEL-09-653055 | check auditd max_log_file_action
  shell: |
    shopt -s nullglob
    files=(/etc/audit/auditd.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="max_log_file_action" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "max_log_file_action (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'max_log_file_action' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [[ "${val,,}" =~ ^(rotate|single)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: max_log_file_action must be ROTATE or SINGLE"
    fi
  register: _653055_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-653055 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-653055': {
        'status':
          'not_a_finding' if _653055_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-653055')
          else 'open'),
        'finding_details':
          _653055_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-653055') or '(none)'),
        'comments':
          'Set max_log_file_action = ROTATE in /etc/audit/auditd.conf.'
      }
    }) }}"
  tags: [validate]

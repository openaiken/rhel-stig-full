---
# RHEL-09-433015 | V-258090
# RHEL 9 fapolicy module must be enabled.
# CAT II (Medium) | CCI-001764, CCI-001774

# The formal role only manages this service where fapolicyd is installed, so
# on a host without it the rule had no result and rendered as not_reviewed.

- name: RHEL-09-433015 | check fapolicyd service state
  shell: |
    rpm -q fapolicyd &>/dev/null || echo "fapolicyd package not installed"
    echo "fapolicyd: $(systemctl is-active fapolicyd 2>&1)"
  register: _433015_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-433015 | record fapolicyd service status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-433015': {
        'status':
          'not_a_finding' if _433015_result.stdout is search('^fapolicyd: active$', multiline=True)
          else 'open',
        'finding_details': _433015_result.stdout | trim,
        'comments':
          'Install and enable fapolicyd: sudo dnf install fapolicyd; '
          ~ 'sudo systemctl enable --now fapolicyd.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-433010 | V-258089
# RHEL 9 fapolicy module must be installed.
# CAT II (Medium) | CCI-001764, CCI-001774

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-433010 | check fapolicyd is installed
  shell: |
    if rpm -q --quiet fapolicyd; then state=installed; else state="not installed"; fi
    echo "fapolicyd: $state ($(rpm -q fapolicyd 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: fapolicyd must be installed"
    fi
  register: _433010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-433010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-433010': {
        'status':
          'not_a_finding' if _433010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _433010_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install fapolicyd'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-214015 | V-257820 | fix
# RHEL 9 must check the GPG signature of software packages originating from
# external software repositories before installation.
# CAT I (High)
#
# Sets gpgcheck=1 in [main] of /etc/dnf/dnf.conf, the default for every
# repository that does not set its own (per-repository settings are
# RHEL-09-214025).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-214015 | fix
  block:
    - name: RHEL-09-214015 | set gpgcheck=1 in [main] of /etc/dnf/dnf.conf
      community.general.ini_file:
        path: /etc/dnf/dnf.conf
        section: main
        option: gpgcheck
        value: '1'
        no_extra_spaces: true
      register: _214015_fix

    - name: RHEL-09-214015 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-214015'] }}"
      when: (_214015_fix is changed)
  rescue:
    - name: RHEL-09-214015 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-214015': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-214015'] }}"

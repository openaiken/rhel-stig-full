---
# RHEL-09-253015 | V-257958 | fix
# RHEL 9 must ignore Internet Protocol version 4 (IPv4) Internet Control
# Message Protocol (ICMP) redirect messages.
# CAT II (Medium)
#
# Sets net.ipv4.conf.all.accept_redirects = 0 now and persists it in
# /etc/sysctl.d/zz-rhel9-stig-full.conf, named to load after every numbered
# file and /etc/sysctl.conf; fails if a later file still overrides it.
# ignoreerrors skips a key this kernel does not have (e.g. IPv6 disabled); the
# re-check then still reports it.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-253015 | fix
  block:
    - name: RHEL-09-253015 | set net.ipv4.conf.all.accept_redirects = 0
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.accept_redirects
        value: '0'
        sysctl_file: /etc/sysctl.d/zz-rhel9-stig-full.conf
        sysctl_set: true
        reload: false
        ignoreerrors: true
        state: present
      register: _253015_fix

    - name: RHEL-09-253015 | read the value that wins at boot
      ansible.builtin.shell: |
        /usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
          | grep -E '^[[:space:]]*-?net[.]ipv4[.]conf[.]all[.]accept_redirects[[:space:]]*=' | tail -1 | cut -d= -f2- \
          | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
      register: _253015_boot
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: RHEL-09-253015 | fail if another file overrides it at boot
      ansible.builtin.fail:
        msg: "net.ipv4.conf.all.accept_redirects was set, but the last value in the sysctl configuration is {{ _253015_boot.stdout | trim | default('(none)', true) }}, so it reverts at boot"
      when: not ansible_check_mode and (_253015_boot.stdout | trim) != '0'

    - name: RHEL-09-253015 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-253015'] }}"
      when: (_253015_fix is changed)
  rescue:
    - name: RHEL-09-253015 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-253015': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-253015'] }}"

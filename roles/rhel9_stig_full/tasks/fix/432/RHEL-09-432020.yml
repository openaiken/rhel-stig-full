---
# RHEL-09-432020 | V-258085 | fix
# RHEL 9 must use the invoking user's password for privilege escalation when
# using "sudo".
# CAT II (Medium)
#
# Adds Defaults !targetpw, !rootpw and !runaspw to /etc/sudoers.d/rhel9-stig-
# full, each only if no sudoers file sets it already; a token found in several
# files is left for a person (the check requires exactly one). Validated with
# visudo.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-432020 | fix
  block:
    - name: RHEL-09-432020 | find sudoers files that set each token
      ansible.builtin.shell: grep -rlisE '^[^#]*Defaults.*{{ item }}' /etc/sudoers /etc/sudoers.d/ || true
      loop: ['!targetpw', '!rootpw', '!runaspw']
      register: _432020_files
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-432020 | stop if a token is set in several files
      ansible.builtin.fail:
        msg: "{{ item.item }} is set in several files ({{ item.stdout_lines | join(', ') }}); keep exactly one"
      loop: "{{ _432020_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout_lines | length > 1

    - name: RHEL-09-432020 | add the missing tokens
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/rhel9-stig-full
        line: 'Defaults {{ item.item }}'
        create: true
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      loop: "{{ _432020_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout_lines | length == 0
      register: _432020_fix

    - name: RHEL-09-432020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-432020'] }}"
      when: (_432020_fix is changed)
  rescue:
    - name: RHEL-09-432020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-432020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-432020'] }}"

---
# RHEL-09-432010 | V-258083 | fix
# RHEL 9 must have the sudo package installed.
# CAT II (Medium)
#
# Installs sudo.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-432010 | fix
  block:
    - name: RHEL-09-432010 | install sudo
      ansible.builtin.dnf:
        name: sudo
        state: present
      register: _432010_fix

    - name: RHEL-09-432010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-432010'] }}"
      when: (_432010_fix is changed)
  rescue:
    - name: RHEL-09-432010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-432010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-432010'] }}"

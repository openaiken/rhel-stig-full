---
# RHEL-09-271030 | V-258016 | fix
# RHEL 9 must disable the graphical user interface autorun function unless
# required.
# CAT II (Medium)
#
# Sets org.gnome.desktop.media-handling autorun-never to true in
# /etc/dconf/db/local.d/00-rhel9-stig-full. Applies only where gdm is
# installed (the check is not applicable otherwise). The local system database
# is what the check reads through the user profile, which is made to include
# system-db:local; the databases are then compiled with dconf update. Takes
# effect at the next login.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-271030 | fix
  block:
    - name: RHEL-09-271030 | make sure the user profile reads the local database
      ansible.builtin.lineinfile:
        path: /etc/dconf/profile/user
        line: system-db:local
        insertafter: '^user-db:user'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271030_prof

    - name: RHEL-09-271030 | set autorun-never in /etc/dconf/db/local.d/00-rhel9-stig-full
      community.general.ini_file:
        path: /etc/dconf/db/local.d/00-rhel9-stig-full
        section: org/gnome/desktop/media-handling
        option: autorun-never
        value: "true"
        no_extra_spaces: true
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271030_set0

    - name: RHEL-09-271030 | compile the dconf databases
      ansible.builtin.command: dconf update
      when: (_271030_prof is changed) or (_271030_set0 is changed)

    - name: RHEL-09-271030 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271030'] }}"
      when: (_271030_prof is changed) or (_271030_set0 is changed)
  rescue:
    - name: RHEL-09-271030 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-271030': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271030'] }}"

---
# RHEL-09-271075 | V-258025 | fix
# RHEL 9 must initiate a session lock for graphical user interfaces when the
# screensaver is activated.
# CAT II (Medium)
#
# Sets org.gnome.desktop.screensaver lock-delay to uint32 5 in
# /etc/dconf/db/local.d/00-rhel9-stig-full. Applies only where gdm is
# installed (the check is not applicable otherwise). The local system database
# is what the check reads through the user profile, which is made to include
# system-db:local; the databases are then compiled with dconf update. Takes
# effect at the next login.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-271075 | fix
  block:
    - name: RHEL-09-271075 | make sure the user profile reads the local database
      ansible.builtin.lineinfile:
        path: /etc/dconf/profile/user
        line: system-db:local
        insertafter: '^user-db:user'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271075_prof

    - name: RHEL-09-271075 | set lock-delay in /etc/dconf/db/local.d/00-rhel9-stig-full
      community.general.ini_file:
        path: /etc/dconf/db/local.d/00-rhel9-stig-full
        section: org/gnome/desktop/screensaver
        option: lock-delay
        value: "uint32 5"
        no_extra_spaces: true
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271075_set0

    - name: RHEL-09-271075 | compile the dconf databases
      ansible.builtin.command: dconf update
      when: (_271075_prof is changed) or (_271075_set0 is changed)

    - name: RHEL-09-271075 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271075'] }}"
      when: (_271075_prof is changed) or (_271075_set0 is changed)
  rescue:
    - name: RHEL-09-271075 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-271075': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271075'] }}"

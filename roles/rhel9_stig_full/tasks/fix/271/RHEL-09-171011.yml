---
# RHEL-09-171011 | V-270174 | fix
# RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner
# before granting local or remote access to the system via a graphical user
# logon.
# CAT II (Medium)
#
# Sets org.gnome.login-screen banner-message-text to the DOD banner text in
# /etc/dconf/db/local.d/00-rhel9-stig-full. Login-screen keys are also written
# to the gdm database, which the greeter itself reads. Applies only where gdm
# is installed (the check is not applicable otherwise). The local system
# database is what the check reads through the user profile, which is made to
# include system-db:local; the databases are then compiled with dconf update.
# Takes effect at the next login. The text is the Standard Mandatory DOD
# Notice and Consent Banner, taken verbatim from the check.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-171011 | fix
  block:
    - name: RHEL-09-171011 | make sure the user profile reads the local database
      ansible.builtin.lineinfile:
        path: /etc/dconf/profile/user
        line: system-db:local
        insertafter: '^user-db:user'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _171011_prof

    - name: RHEL-09-171011 | set banner-message-text in /etc/dconf/db/local.d/00-rhel9-stig-full
      community.general.ini_file:
        path: /etc/dconf/db/local.d/00-rhel9-stig-full
        section: org/gnome/login-screen
        option: banner-message-text
        value: "'You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\\nBy using this IS (which includes any device attached to this IS), you consent to the following conditions:\\n-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\\n-At any time, the USG may inspect and seize data stored on this IS.\\n-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.\\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.\\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.'"
        no_extra_spaces: true
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _171011_set0

    - name: RHEL-09-171011 | set banner-message-text in /etc/dconf/db/gdm.d/00-rhel9-stig-full
      community.general.ini_file:
        path: /etc/dconf/db/gdm.d/00-rhel9-stig-full
        section: org/gnome/login-screen
        option: banner-message-text
        value: "'You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\\nBy using this IS (which includes any device attached to this IS), you consent to the following conditions:\\n-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\\n-At any time, the USG may inspect and seize data stored on this IS.\\n-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.\\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.\\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.'"
        no_extra_spaces: true
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _171011_set1

    - name: RHEL-09-171011 | compile the dconf databases
      ansible.builtin.command: dconf update
      when: (_171011_prof is changed) or (_171011_set0 is changed) or (_171011_set1 is changed)

    - name: RHEL-09-171011 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-171011'] }}"
      when: (_171011_prof is changed) or (_171011_set0 is changed) or (_171011_set1 is changed)
  rescue:
    - name: RHEL-09-171011 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-171011': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-171011'] }}"

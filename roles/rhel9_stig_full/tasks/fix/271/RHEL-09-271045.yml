---
# RHEL-09-271045 | V-258019 | fix
# RHEL 9 must be able to initiate directly a session lock for all connection
# types using smart card when the smart card is removed.
# CAT II (Medium)
#
# Sets org.gnome.settings-daemon.peripherals.smartcard removal-action to
# 'lock-screen' in /etc/dconf/db/local.d/00-rhel9-stig-full. Applies only
# where gdm is installed (the check is not applicable otherwise). The local
# system database is what the check reads through the user profile, which is
# made to include system-db:local; the databases are then compiled with dconf
# update. Takes effect at the next login.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-271045 | fix
  block:
    - name: RHEL-09-271045 | make sure the user profile reads the local database
      ansible.builtin.lineinfile:
        path: /etc/dconf/profile/user
        line: system-db:local
        insertafter: '^user-db:user'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271045_prof

    - name: RHEL-09-271045 | set removal-action in /etc/dconf/db/local.d/00-rhel9-stig-full
      community.general.ini_file:
        path: /etc/dconf/db/local.d/00-rhel9-stig-full
        section: org/gnome/settings-daemon/peripherals/smartcard
        option: removal-action
        value: "'lock-screen'"
        no_extra_spaces: true
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _271045_set0

    - name: RHEL-09-271045 | compile the dconf databases
      ansible.builtin.command: dconf update
      when: (_271045_prof is changed) or (_271045_set0 is changed)

    - name: RHEL-09-271045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271045'] }}"
      when: (_271045_prof is changed) or (_271045_set0 is changed)
  rescue:
    - name: RHEL-09-271045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-271045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-271045'] }}"

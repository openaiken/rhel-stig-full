---
# RHEL-09-252060 | V-257953 | fix
# RHEL 9 must forward mail from postmaster to the root account using a postfix
# alias.
# CAT II (Medium)
#
# Sets postmaster: root in /etc/aliases (replacing an existing postmaster
# alias) and rebuilds the alias database with newaliases.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-252060 | fix
  block:
    - name: RHEL-09-252060 | forward postmaster to root
      ansible.builtin.lineinfile:
        path: /etc/aliases
        regexp: '^[ \t]*postmaster[ \t]*:'
        line: 'postmaster:     root'
      register: _252060_fix

    - name: RHEL-09-252060 | rebuild the alias database
      ansible.builtin.command: newaliases
      when: _252060_fix is changed

    - name: RHEL-09-252060 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252060'] }}"
      when: (_252060_fix is changed)
  rescue:
    - name: RHEL-09-252060 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-252060': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252060'] }}"

---
# RHEL-09-252010 | V-257943 | fix
# RHEL 9 must have the chrony package installed.
# CAT II (Medium)
#
# Installs chrony.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-252010 | fix
  block:
    - name: RHEL-09-252010 | install chrony
      ansible.builtin.dnf:
        name: chrony
        state: present
      register: _252010_fix

    - name: RHEL-09-252010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252010'] }}"
      when: (_252010_fix is changed)
  rescue:
    - name: RHEL-09-252010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-252010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252010'] }}"

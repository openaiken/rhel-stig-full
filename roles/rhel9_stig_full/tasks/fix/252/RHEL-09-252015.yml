---
# RHEL-09-252015 | V-257944 | fix
# RHEL 9 chronyd service must be enabled.
# CAT II (Medium)
#
# Enables and starts chronyd (installed by the RHEL-09-252010 fix).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-252015 | fix
  block:
    - name: RHEL-09-252015 | enable and start chronyd
      ansible.builtin.systemd_service:
        name: chronyd
        enabled: true
        state: started
      register: _252015_fix

    - name: RHEL-09-252015 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252015'] }}"
      when: (_252015_fix is changed)
  rescue:
    - name: RHEL-09-252015 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-252015': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252015'] }}"

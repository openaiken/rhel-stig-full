---
# RHEL-09-252025 | V-257946 | fix
# RHEL 9 must disable the chrony daemon from acting as a server.
# CAT III (Low)
#
# Sets port 0 in /etc/chrony.conf (replacing the last port line, the one in
# effect) and restarts a running chronyd; chronyd stops serving time to other
# hosts.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-252025 | fix
  block:
    - name: RHEL-09-252025 | set port 0
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        regexp: '^[ \t]*port[ \t]'
        line: 'port 0'
      register: _252025_fix

    - name: RHEL-09-252025 | restart a running chronyd to apply it
      ansible.builtin.command: systemctl try-restart chronyd
      when: _252025_fix is changed

    - name: RHEL-09-252025 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252025'] }}"
      when: (_252025_fix is changed)
  rescue:
    - name: RHEL-09-252025 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-252025': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252025'] }}"

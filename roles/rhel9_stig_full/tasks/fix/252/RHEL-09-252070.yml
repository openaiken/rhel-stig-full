---
# RHEL-09-252070 | V-257955 | fix
# There must be no shosts.equiv files on RHEL 9.
# CAT I (High)
#
# Deletes every shosts.equiv file on local file systems (the check command,
# without its 40-line limit).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-252070 | fix
  block:
    - name: RHEL-09-252070 | find shosts.equiv files
      ansible.builtin.shell: df --local -P | awk 'NR > 1 { print $6 }' | xargs -I{} find {} -xdev -name shosts.equiv 2>/dev/null || true
      register: _252070_files
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-252070 | delete them
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _252070_files.stdout_lines }}"
      register: _252070_fix

    - name: RHEL-09-252070 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252070'] }}"
      when: (_252070_fix is changed)
  rescue:
    - name: RHEL-09-252070 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-252070': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-252070'] }}"

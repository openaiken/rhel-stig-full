---
# RHEL-09-611105 | V-258110 | fix
# RHEL 9 must prevent the use of dictionary words for passwords.
# CAT II (Medium)
#
# Sets dictcheck = 1 in /etc/security/pwquality.conf, replacing the last
# dictcheck line. libpwquality reads pwquality.conf.d/*.conf first and
# pwquality.conf last, so this is the value in effect (a drop-in cannot
# override it).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611105 | fix
  block:
    - name: RHEL-09-611105 | set dictcheck in /etc/security/pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^[ \t]*dictcheck[ \t]*='
        line: 'dictcheck = 1'
      register: _611105_fix

    - name: RHEL-09-611105 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611105'] }}"
      when: (_611105_fix is changed)
  rescue:
    - name: RHEL-09-611105 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611105': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611105'] }}"

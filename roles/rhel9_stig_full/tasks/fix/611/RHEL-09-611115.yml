---
# RHEL-09-611115 | V-258112 | fix
# RHEL 9 must require the change of at least eight characters when passwords
# are changed.
# CAT II (Medium)
#
# Sets difok = 8 in /etc/security/pwquality.conf.d/zz-rhel9-stig-full.conf,
# which sorts after pwquality.conf and the other drop-ins, so its value is the
# one in effect.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611115 | fix
  block:
    - name: RHEL-09-611115 | set difok in /etc/security/pwquality.conf.d/zz-rhel9-stig-full.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf.d/zz-rhel9-stig-full.conf
        regexp: '^[ \t]*difok[ \t]*='
        line: 'difok = 8'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: _611115_fix

    - name: RHEL-09-611115 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611115'] }}"
      when: (_611115_fix is changed)
  rescue:
    - name: RHEL-09-611115 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611115': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611115'] }}"

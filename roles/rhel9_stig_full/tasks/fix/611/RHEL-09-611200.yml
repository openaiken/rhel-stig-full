---
# RHEL-09-611200 | V-258129 | fix
# RHEL 9 must require authentication to access single-user mode.
# CAT II (Medium)
#
# Writes a drop-in for rescue.service whose ExecStart runs
# /usr/lib/systemd/systemd-sulogin-shell rescue (the stock RHEL 9 command,
# which asks for the root password), replacing whatever ExecStart override
# made it skip authentication, then reloads systemd.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611200 | fix
  block:
    - name: RHEL-09-611200 | create the rescue.service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/rescue.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: RHEL-09-611200 | require authentication for rescue mode
      ansible.builtin.copy:
        dest: /etc/systemd/system/rescue.service.d/zz-rhel9-stig-full.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-611200)
          [Service]
          ExecStart=
          ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue
        owner: root
        group: root
        mode: '0644'
      register: _611200_fix

    - name: RHEL-09-611200 | reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _611200_fix is changed

    - name: RHEL-09-611200 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611200'] }}"
      when: (_611200_fix is changed)
  rescue:
    - name: RHEL-09-611200 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611200': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611200'] }}"

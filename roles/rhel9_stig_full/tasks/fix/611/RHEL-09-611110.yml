---
# RHEL-09-611110 | V-258111 | fix
# RHEL 9 must enforce password complexity by requiring that at least one
# uppercase character be used.
# CAT II (Medium)
#
# Sets ucredit = -1 in /etc/security/pwquality.conf, replacing the last
# ucredit line. libpwquality reads pwquality.conf.d/*.conf first and
# pwquality.conf last, so this is the value in effect (a drop-in cannot
# override it).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611110 | fix
  block:
    - name: RHEL-09-611110 | set ucredit in /etc/security/pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^[ \t]*ucredit[ \t]*='
        line: 'ucredit = -1'
      register: _611110_fix

    - name: RHEL-09-611110 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611110'] }}"
      when: (_611110_fix is changed)
  rescue:
    - name: RHEL-09-611110 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611110': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611110'] }}"

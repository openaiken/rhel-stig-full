---
# RHEL-09-611175 | V-258124 | fix
# RHEL 9 must have the pcsc-lite package installed.
# CAT II (Medium)
#
# Installs pcsc-lite.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611175 | fix
  block:
    - name: RHEL-09-611175 | install pcsc-lite
      ansible.builtin.dnf:
        name: pcsc-lite
        state: present
      register: _611175_fix

    - name: RHEL-09-611175 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611175'] }}"
      when: (_611175_fix is changed)
  rescue:
    - name: RHEL-09-611175 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611175': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611175'] }}"

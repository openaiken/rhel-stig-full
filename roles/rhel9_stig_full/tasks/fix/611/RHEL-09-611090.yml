---
# RHEL-09-611090 | V-258107 | fix
# RHEL 9 passwords must be created with a minimum of 15 characters.
# CAT II (Medium)
#
# Sets minlen = 15 in /etc/security/pwquality.conf, replacing the last minlen
# line. libpwquality reads pwquality.conf.d/*.conf first and pwquality.conf
# last, so this is the value in effect (a drop-in cannot override it).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611090 | fix
  block:
    - name: RHEL-09-611090 | set minlen in /etc/security/pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^[ \t]*minlen[ \t]*='
        line: 'minlen = 15'
      register: _611090_fix

    - name: RHEL-09-611090 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611090'] }}"
      when: (_611090_fix is changed)
  rescue:
    - name: RHEL-09-611090 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611090': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611090'] }}"

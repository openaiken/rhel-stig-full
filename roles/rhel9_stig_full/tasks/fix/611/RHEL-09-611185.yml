---
# RHEL-09-611185 | V-258126 | fix
# RHEL 9 must have the opensc package installed.
# CAT II (Medium)
#
# Installs opensc.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611185 | fix
  block:
    - name: RHEL-09-611185 | install opensc
      ansible.builtin.dnf:
        name: opensc
        state: present
      register: _611185_fix

    - name: RHEL-09-611185 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611185'] }}"
      when: (_611185_fix is changed)
  rescue:
    - name: RHEL-09-611185 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611185': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611185'] }}"

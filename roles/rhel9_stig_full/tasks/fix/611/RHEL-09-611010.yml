---
# RHEL-09-611010 | V-258091 | fix
# RHEL 9 must ensure the password complexity module in the system-auth file is
# configured for three retries or less.
# CAT II (Medium)
#
# Sets retry = 3 in /etc/security/pwquality.conf, replacing the last retry
# line. libpwquality reads pwquality.conf.d/*.conf first and pwquality.conf
# last, so this is the value in effect (a drop-in cannot override it).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611010 | fix
  block:
    - name: RHEL-09-611010 | set retry in /etc/security/pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^[ \t]*retry[ \t]*='
        line: 'retry = 3'
      register: _611010_fix

    - name: RHEL-09-611010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611010'] }}"
      when: (_611010_fix is changed)
  rescue:
    - name: RHEL-09-611010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611010'] }}"

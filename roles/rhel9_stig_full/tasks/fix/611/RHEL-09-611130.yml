---
# RHEL-09-611130 | V-258115 | fix
# RHEL 9 must require the change of at least four character classes when
# passwords are changed.
# CAT II (Medium)
#
# Sets minclass = 4 in /etc/security/pwquality.conf, replacing the last
# minclass line. libpwquality reads pwquality.conf.d/*.conf first and
# pwquality.conf last, so this is the value in effect (a drop-in cannot
# override it).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611130 | fix
  block:
    - name: RHEL-09-611130 | set minclass in /etc/security/pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^[ \t]*minclass[ \t]*='
        line: 'minclass = 4'
      register: _611130_fix

    - name: RHEL-09-611130 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611130'] }}"
      when: (_611130_fix is changed)
  rescue:
    - name: RHEL-09-611130 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611130': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611130'] }}"

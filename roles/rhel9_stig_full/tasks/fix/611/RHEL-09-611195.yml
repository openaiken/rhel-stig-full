---
# RHEL-09-611195 | V-258128 | fix
# RHEL 9 must require authentication to access emergency mode.
# CAT II (Medium)
#
# Writes a drop-in for emergency.service whose ExecStart runs
# /usr/lib/systemd/systemd-sulogin-shell emergency (the stock RHEL 9 command,
# which asks for the root password), replacing whatever ExecStart override
# made it skip authentication, then reloads systemd.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-611195 | fix
  block:
    - name: RHEL-09-611195 | create the emergency.service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/emergency.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: RHEL-09-611195 | require authentication for emergency mode
      ansible.builtin.copy:
        dest: /etc/systemd/system/emergency.service.d/zz-rhel9-stig-full.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-611195)
          [Service]
          ExecStart=
          ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency
        owner: root
        group: root
        mode: '0644'
      register: _611195_fix

    - name: RHEL-09-611195 | reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _611195_fix is changed

    - name: RHEL-09-611195 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611195'] }}"
      when: (_611195_fix is changed)
  rescue:
    - name: RHEL-09-611195 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-611195': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-611195'] }}"

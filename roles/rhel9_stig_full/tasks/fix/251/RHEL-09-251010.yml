---
# RHEL-09-251010 | V-257935 | fix
# RHEL 9 must have the firewalld package installed.
# CAT II (Medium)
#
# Installs firewalld.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-251010 | fix
  block:
    - name: RHEL-09-251010 | install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present
      register: _251010_fix

    - name: RHEL-09-251010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-251010'] }}"
      when: (_251010_fix is changed)
  rescue:
    - name: RHEL-09-251010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-251010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-251010'] }}"

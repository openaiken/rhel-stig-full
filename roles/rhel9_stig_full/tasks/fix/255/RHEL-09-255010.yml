---
# RHEL-09-255010 | V-257978 | fix
# All RHEL 9 networked systems must have SSH installed.
# CAT II (Medium)
#
# Installs openssh-server. Not run when rhel9_attest_no_sshd documents the
# exception.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255010 | fix
  block:
    - name: RHEL-09-255010 | install openssh-server
      ansible.builtin.dnf:
        name: openssh-server
        state: present
      register: _255010_fix

    - name: RHEL-09-255010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255010'] }}"
      when: (_255010_fix is changed)
  rescue:
    - name: RHEL-09-255010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255010'] }}"

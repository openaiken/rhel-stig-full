---
# RHEL-09-255120 | V-258000 | fix
# RHEL 9 SSH private host key files must have mode 0600 or less permissive.
# CAT II (Medium)
#
# Removes group and other permissions (and owner execute) from every
# /etc/ssh/*_key, leaving 0600 or stricter. sshd reads the keys as root, so
# the stock ssh_keys group access is not needed.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255120 | fix
  block:
    - name: RHEL-09-255120 | find the SSH private host keys
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: '*_key'
        file_type: file
      register: _255120_keys

    - name: RHEL-09-255120 | restrict them to 0600 or less
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u-xs,g-rwxs,o-rwxt'
      loop: "{{ _255120_keys.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: _255120_fix

    - name: RHEL-09-255120 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255120'] }}"
      when: (_255120_fix is changed)
  rescue:
    - name: RHEL-09-255120 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255120': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255120'] }}"

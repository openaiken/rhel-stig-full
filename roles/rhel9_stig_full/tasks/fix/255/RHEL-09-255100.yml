---
# RHEL-09-255100 | V-257996 | fix
# RHEL 9 must be configured so that all network connections associated with
# SSH traffic are terminated after 10 minutes of becoming unresponsive.
# CAT II (Medium)
#
# Sets ClientAliveInterval 600. Sets the keyword in
# /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf. sshd uses the first value it
# reads, and RHEL 9 sshd_config includes sshd_config.d/*.conf at its top, so
# this file (sorting first) wins; if sshd_config does not include the
# directory, the re-check still reports the rule open. The file is validated
# with sshd -t, then sshd is reloaded (existing sessions are kept).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255100 | fix
  block:
    - name: RHEL-09-255100 | set ClientAliveInterval 600
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf
        regexp: '^[ \t]*ClientAliveInterval([ \t]|=)'
        line: 'ClientAliveInterval 600'
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      register: _255100_fix

    - name: RHEL-09-255100 | reload sshd to apply it
      ansible.builtin.command: systemctl try-reload-or-restart sshd
      when: _255100_fix is changed

    - name: RHEL-09-255100 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255100'] }}"
      when: (_255100_fix is changed)
  rescue:
    - name: RHEL-09-255100 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255100': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255100'] }}"

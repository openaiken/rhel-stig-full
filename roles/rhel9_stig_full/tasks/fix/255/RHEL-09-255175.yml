---
# RHEL-09-255175 | V-258011 | fix
# RHEL 9 SSH daemon must prevent remote hosts from connecting to the proxy
# display.
# CAT II (Medium)
#
# Sets X11UseLocalhost yes. Sets the keyword in
# /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf. sshd uses the first value it
# reads, and RHEL 9 sshd_config includes sshd_config.d/*.conf at its top, so
# this file (sorting first) wins; if sshd_config does not include the
# directory, the re-check still reports the rule open. The file is validated
# with sshd -t, then sshd is reloaded (existing sessions are kept).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255175 | fix
  block:
    - name: RHEL-09-255175 | set X11UseLocalhost yes
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf
        regexp: '^[ \t]*X11UseLocalhost([ \t]|=)'
        line: 'X11UseLocalhost yes'
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      register: _255175_fix

    - name: RHEL-09-255175 | reload sshd to apply it
      ansible.builtin.command: systemctl try-reload-or-restart sshd
      when: _255175_fix is changed

    - name: RHEL-09-255175 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255175'] }}"
      when: (_255175_fix is changed)
  rescue:
    - name: RHEL-09-255175 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255175': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255175'] }}"

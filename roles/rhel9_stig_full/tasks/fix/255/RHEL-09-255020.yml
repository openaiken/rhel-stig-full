---
# RHEL-09-255020 | V-257980 | fix
# RHEL 9 must have the openssh-clients package installed.
# CAT II (Medium)
#
# Installs openssh-clients.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255020 | fix
  block:
    - name: RHEL-09-255020 | install openssh-clients
      ansible.builtin.dnf:
        name: openssh-clients
        state: present
      register: _255020_fix

    - name: RHEL-09-255020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255020'] }}"
      when: (_255020_fix is changed)
  rescue:
    - name: RHEL-09-255020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255020'] }}"

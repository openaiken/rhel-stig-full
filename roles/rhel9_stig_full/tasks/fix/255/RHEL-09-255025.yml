---
# RHEL-09-255025 | V-257981 | fix
# RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner
# before granting local or remote access to the system via a SSH logon.
# CAT II (Medium)
#
# Sets Banner /etc/issue (the STIG example) in
# /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf, which sshd reads first,
# validated with sshd -t, then reloads sshd. /etc/issue itself carries the DOD
# text after the RHEL-09-211020 fix.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255025 | fix
  block:
    - name: RHEL-09-255025 | set Banner /etc/issue
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf
        regexp: '^[ \t]*Banner([ \t]|=)'
        line: 'Banner /etc/issue'
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      register: _255025_fix

    - name: RHEL-09-255025 | reload sshd to apply it
      ansible.builtin.command: systemctl try-reload-or-restart sshd
      when: _255025_fix is changed

    - name: RHEL-09-255025 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255025'] }}"
      when: (_255025_fix is changed)
  rescue:
    - name: RHEL-09-255025 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255025': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255025'] }}"

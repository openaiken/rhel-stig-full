---
# RHEL-09-255045 | V-257985 | fix
# RHEL 9 must not permit direct logons to the root account using remote access
# via SSH.
# CAT II (Medium)
#
# Sets PermitRootLogin no. Sets the keyword in
# /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf. sshd uses the first value it
# reads, and RHEL 9 sshd_config includes sshd_config.d/*.conf at its top, so
# this file (sorting first) wins; if sshd_config does not include the
# directory, the re-check still reports the rule open. The file is validated
# with sshd -t, then sshd is reloaded (existing sessions are kept). Direct
# root logins over SSH stop working; log in as a named user and elevate.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-255045 | fix
  block:
    - name: RHEL-09-255045 | set PermitRootLogin no
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/00-rhel9-stig-full.conf
        regexp: '^[ \t]*PermitRootLogin([ \t]|=)'
        line: 'PermitRootLogin no'
        insertbefore: BOF
        create: true
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      register: _255045_fix

    - name: RHEL-09-255045 | reload sshd to apply it
      ansible.builtin.command: systemctl try-reload-or-restart sshd
      when: _255045_fix is changed

    - name: RHEL-09-255045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255045'] }}"
      when: (_255045_fix is changed)
  rescue:
    - name: RHEL-09-255045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-255045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-255045'] }}"

---
# RHEL-09-213070 | V-257809 | fix
# RHEL 9 must implement address space layout randomization (ASLR) to protect
# its memory from unauthorized code execution.
# CAT II (Medium)
#
# Sets kernel.randomize_va_space = 2 now and persists it in /etc/sysctl.d/zz-
# rhel9-stig-full.conf, named to load after every numbered file and
# /etc/sysctl.conf; fails if a later file still overrides it. ignoreerrors
# skips a key this kernel does not have (e.g. IPv6 disabled); the re-check
# then still reports it.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-213070 | fix
  block:
    - name: RHEL-09-213070 | set kernel.randomize_va_space = 2
      ansible.posix.sysctl:
        name: kernel.randomize_va_space
        value: '2'
        sysctl_file: /etc/sysctl.d/zz-rhel9-stig-full.conf
        sysctl_set: true
        reload: false
        ignoreerrors: true
        state: present
      register: _213070_fix

    - name: RHEL-09-213070 | read the value that wins at boot
      ansible.builtin.shell: |
        /usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
          | grep -E '^[[:space:]]*-?kernel[.]randomize_va_space[[:space:]]*=' | tail -1 | cut -d= -f2- \
          | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
      register: _213070_boot
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: RHEL-09-213070 | fail if another file overrides it at boot
      ansible.builtin.fail:
        msg: "kernel.randomize_va_space was set, but the last value in the sysctl configuration is {{ _213070_boot.stdout | trim | default('(none)', true) }}, so it reverts at boot"
      when: not ansible_check_mode and (_213070_boot.stdout | trim) != '2'

    - name: RHEL-09-213070 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213070'] }}"
      when: (_213070_fix is changed)
  rescue:
    - name: RHEL-09-213070 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-213070': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213070'] }}"

---
# RHEL-09-213025 | V-257800 | fix
# RHEL 9 must restrict exposed kernel pointer addresses access.
# CAT II (Medium)
#
# Sets kernel.kptr_restrict = 1 now and persists it in /etc/sysctl.d/zz-
# rhel9-stig-full.conf, named to load after every numbered file and
# /etc/sysctl.conf; fails if a later file still overrides it. ignoreerrors
# skips a key this kernel does not have (e.g. IPv6 disabled); the re-check
# then still reports it.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-213025 | fix
  block:
    - name: RHEL-09-213025 | set kernel.kptr_restrict = 1
      ansible.posix.sysctl:
        name: kernel.kptr_restrict
        value: '1'
        sysctl_file: /etc/sysctl.d/zz-rhel9-stig-full.conf
        sysctl_set: true
        reload: false
        ignoreerrors: true
        state: present
      register: _213025_fix

    - name: RHEL-09-213025 | read the value that wins at boot
      ansible.builtin.shell: |
        /usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
          | grep -E '^[[:space:]]*-?kernel[.]kptr_restrict[[:space:]]*=' | tail -1 | cut -d= -f2- \
          | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
      register: _213025_boot
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: RHEL-09-213025 | fail if another file overrides it at boot
      ansible.builtin.fail:
        msg: "kernel.kptr_restrict was set, but the last value in the sysctl configuration is {{ _213025_boot.stdout | trim | default('(none)', true) }}, so it reverts at boot"
      when: not ansible_check_mode and (_213025_boot.stdout | trim) != '1'

    - name: RHEL-09-213025 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213025'] }}"
      when: (_213025_fix is changed)
  rescue:
    - name: RHEL-09-213025 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-213025': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213025'] }}"

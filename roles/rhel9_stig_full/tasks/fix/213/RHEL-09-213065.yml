---
# RHEL-09-213065 | V-257808 | fix
# RHEL 9 must disable the Transparent Inter Process Communication (TIPC)
# kernel module.
# CAT II (Medium)
#
# Writes /etc/modprobe.d/rhel9-stig-full-tipc.conf with install tipc
# /bin/false and blacklist tipc, the two lines the check requires. Takes
# effect at the next attempt to load the module; a module already loaded stays
# loaded until reboot (the STIG checks configuration, not the running kernel).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-213065 | fix
  block:
    - name: RHEL-09-213065 | prevent loading tipc
      ansible.builtin.copy:
        dest: /etc/modprobe.d/rhel9-stig-full-tipc.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-213065)
          install tipc /bin/false
          blacklist tipc
        owner: root
        group: root
        mode: '0644'
      register: _213065_fix

    - name: RHEL-09-213065 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213065'] }}"
      when: (_213065_fix is changed)
  rescue:
    - name: RHEL-09-213065 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-213065': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213065'] }}"

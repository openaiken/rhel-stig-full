---
# RHEL-09-213055 | V-257806 | fix
# RHEL 9 must be configured to disable the FireWire kernel module.
# CAT II (Medium)
#
# Writes /etc/modprobe.d/rhel9-stig-full-firewire-core.conf with install
# firewire-core /bin/false and blacklist firewire-core, the two lines the
# check requires. Takes effect at the next attempt to load the module; a
# module already loaded stays loaded until reboot (the STIG checks
# configuration, not the running kernel).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-213055 | fix
  block:
    - name: RHEL-09-213055 | prevent loading firewire-core
      ansible.builtin.copy:
        dest: /etc/modprobe.d/rhel9-stig-full-firewire-core.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-213055)
          install firewire-core /bin/false
          blacklist firewire-core
        owner: root
        group: root
        mode: '0644'
      register: _213055_fix

    - name: RHEL-09-213055 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213055'] }}"
      when: (_213055_fix is changed)
  rescue:
    - name: RHEL-09-213055 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-213055': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213055'] }}"

---
# RHEL-09-213060 | V-257807 | fix
# RHEL 9 must disable the Stream Control Transmission Protocol (SCTP) kernel
# module.
# CAT II (Medium)
#
# Writes /etc/modprobe.d/rhel9-stig-full-sctp.conf with install sctp
# /bin/false and blacklist sctp, the two lines the check requires. Takes
# effect at the next attempt to load the module; a module already loaded stays
# loaded until reboot (the STIG checks configuration, not the running kernel).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-213060 | fix
  block:
    - name: RHEL-09-213060 | prevent loading sctp
      ansible.builtin.copy:
        dest: /etc/modprobe.d/rhel9-stig-full-sctp.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-213060)
          install sctp /bin/false
          blacklist sctp
        owner: root
        group: root
        mode: '0644'
      register: _213060_fix

    - name: RHEL-09-213060 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213060'] }}"
      when: (_213060_fix is changed)
  rescue:
    - name: RHEL-09-213060 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-213060': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-213060'] }}"

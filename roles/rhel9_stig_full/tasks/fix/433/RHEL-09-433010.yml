---
# RHEL-09-433010 | V-258089 | fix
# RHEL 9 fapolicy module must be installed.
# CAT II (Medium)
#
# Installs fapolicyd.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-433010 | fix
  block:
    - name: RHEL-09-433010 | install fapolicyd
      ansible.builtin.dnf:
        name: fapolicyd
        state: present
      register: _433010_fix

    - name: RHEL-09-433010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-433010'] }}"
      when: (_433010_fix is changed)
  rescue:
    - name: RHEL-09-433010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-433010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-433010'] }}"

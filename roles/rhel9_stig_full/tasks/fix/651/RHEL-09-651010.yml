---
# RHEL-09-651010 | V-258134 | fix
# RHEL 9 must have the AIDE package installed.
# CAT II (Medium)
#
# Installs aide. The AIDE database is not initialized here (aide --init takes
# minutes and its baseline should be taken on a known-good system).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-651010 | fix
  block:
    - name: RHEL-09-651010 | install aide
      ansible.builtin.dnf:
        name: aide
        state: present
      register: _651010_fix

    - name: RHEL-09-651010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-651010'] }}"
      when: (_651010_fix is changed)
  rescue:
    - name: RHEL-09-651010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-651010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-651010'] }}"

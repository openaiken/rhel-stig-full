---
# RHEL-09-412050 | V-258071 | fix
# RHEL 9 must enforce a delay of at least four seconds between logon prompts
# following a failed logon attempt.
# CAT II (Medium)
#
# Sets FAIL_DELAY 4 in /etc/login.defs, replacing the last uncommented
# FAIL_DELAY line (the one in effect) or appending one.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-412050 | fix
  block:
    - name: RHEL-09-412050 | set FAIL_DELAY in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^[ \t]*FAIL_DELAY[ \t]'
        line: 'FAIL_DELAY 4'
      register: _412050_fix

    - name: RHEL-09-412050 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412050'] }}"
      when: (_412050_fix is changed)
  rescue:
    - name: RHEL-09-412050 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-412050': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412050'] }}"

---
# RHEL-09-412045 | V-258070 | fix
# RHEL 9 must log username information when unsuccessful logon attempts occur.
# CAT II (Medium)
#
# Sets audit in /etc/security/faillock.conf.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-412045 | fix
  block:
    - name: RHEL-09-412045 | set audit in /etc/security/faillock.conf
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^[ \t]*audit[ \t]*$'
        line: 'audit'
      register: _412045_fix

    - name: RHEL-09-412045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412045'] }}"
      when: (_412045_fix is changed)
  rescue:
    - name: RHEL-09-412045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-412045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412045'] }}"

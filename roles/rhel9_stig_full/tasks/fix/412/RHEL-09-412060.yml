---
# RHEL-09-412060 | V-258073 | fix
# RHEL 9 must define default permissions for the c shell.
# CAT II (Medium)
#
# Changes every uncommented umask statement in /etc/csh.cshrc to umask 077,
# and appends umask 077 if the file has none (the STIG treats a missing
# statement as a finding; stock RHEL 9 /etc/profile has none).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-412060 | fix
  block:
    - name: RHEL-09-412060 | set every umask in /etc/csh.cshrc to 077
      ansible.builtin.replace:
        path: /etc/csh.cshrc
        regexp: '^(?![ \t]*#)(.*(?:^|[^A-Za-z0-9_])umask[ \t]+)[0-7][0-7][0-7][0-7]?\b'
        replace: '\g<1>077'
      register: _412060_fix

    - name: RHEL-09-412060 | look for any umask statement in /etc/csh.cshrc
      ansible.builtin.command: grep -cE '^[^#]*(^|[^[:alnum:]_])umask[[:space:]]+[0-7][0-7][0-7]' /etc/csh.cshrc
      register: _412060_count
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-412060 | append umask 077 to /etc/csh.cshrc, which has none
      ansible.builtin.lineinfile:
        path: /etc/csh.cshrc
        line: 'umask 077'
        insertafter: EOF
      register: _412060_add
      when: (_412060_count.stdout | int) == 0

    - name: RHEL-09-412060 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412060'] }}"
      when: (_412060_fix is changed) or (_412060_add is changed)
  rescue:
    - name: RHEL-09-412060 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-412060': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-412060'] }}"

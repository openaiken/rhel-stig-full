---
# RHEL-09-291035 | V-258039 | fix
# RHEL 9 Bluetooth must be disabled.
# CAT II (Medium)
#
# Writes /etc/modprobe.d/rhel9-stig-full-bluetooth.conf with install bluetooth
# /bin/false and blacklist bluetooth, the two lines the check requires. Takes
# effect at the next attempt to load the module; a module already loaded stays
# loaded until reboot (the STIG checks configuration, not the running kernel).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-291035 | fix
  block:
    - name: RHEL-09-291035 | prevent loading bluetooth
      ansible.builtin.copy:
        dest: /etc/modprobe.d/rhel9-stig-full-bluetooth.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-291035)
          install bluetooth /bin/false
          blacklist bluetooth
        owner: root
        group: root
        mode: '0644'
      register: _291035_fix

    - name: RHEL-09-291035 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291035'] }}"
      when: (_291035_fix is changed)
  rescue:
    - name: RHEL-09-291035 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-291035': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291035'] }}"

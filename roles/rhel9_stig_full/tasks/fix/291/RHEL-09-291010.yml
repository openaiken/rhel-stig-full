---
# RHEL-09-291010 | V-258034 | fix
# RHEL 9 must be configured to disable USB mass storage.
# CAT II (Medium)
#
# Writes /etc/modprobe.d/rhel9-stig-full-usb-storage.conf with install usb-
# storage /bin/false and blacklist usb-storage, the two lines the check
# requires. Takes effect at the next attempt to load the module; a module
# already loaded stays loaded until reboot (the STIG checks configuration, not
# the running kernel).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-291010 | fix
  block:
    - name: RHEL-09-291010 | prevent loading usb-storage
      ansible.builtin.copy:
        dest: /etc/modprobe.d/rhel9-stig-full-usb-storage.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-291010)
          install usb-storage /bin/false
          blacklist usb-storage
        owner: root
        group: root
        mode: '0644'
      register: _291010_fix

    - name: RHEL-09-291010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291010'] }}"
      when: (_291010_fix is changed)
  rescue:
    - name: RHEL-09-291010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-291010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291010'] }}"

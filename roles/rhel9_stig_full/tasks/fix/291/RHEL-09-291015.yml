---
# RHEL-09-291015 | V-258035 | fix
# RHEL 9 must have the USBGuard package installed.
# CAT II (Medium)
#
# Installs usbguard.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-291015 | fix
  block:
    - name: RHEL-09-291015 | install usbguard
      ansible.builtin.dnf:
        name: usbguard
        state: present
      register: _291015_fix

    - name: RHEL-09-291015 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291015'] }}"
      when: (_291015_fix is changed)
  rescue:
    - name: RHEL-09-291015 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-291015': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-291015'] }}"

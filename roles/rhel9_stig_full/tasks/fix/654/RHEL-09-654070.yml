---
# RHEL-09-654070 | V-258188 | fix
# RHEL 9 must audit all uses of the truncate, ftruncate, creat, open, openat,
# and open_by_handle_at system calls.
# CAT II (Medium)
#
# Writes the expected rules (copied from the check task; lint FIX-AUDIT-DRIFT
# keeps the two in step) that the loaded rules do not already cover, as
# computed by the same rhel9_audit_coverage filter the check uses, to
# /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654070.rules, then runs
# augenrules --load. Writing only uncovered lines avoids exact duplicates,
# which make auditctl stop loading. If the loaded rules are immutable (-e 2,
# RHEL-09-654275) the file loads at the next boot and the fix records that.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-654070 | fix
  block:
    - name: RHEL-09-654070 | read the loaded audit rules
      ansible.builtin.command: auditctl -l
      register: _654070_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654070 | read the rules this fix wrote before
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654070.rules
      register: _654070_prev
      failed_when: false

    - name: RHEL-09-654070 | write the rules not yet covered, keeping earlier ones
      vars:
        _654070_expected:
          - "-a always,exit -F arch=b32 -S open,creat,truncate,ftruncate,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access"
          - "-a always,exit -F arch=b64 -S open,truncate,ftruncate,creat,openat,open_by_handle_at -F exit=-EPERM -F auid>=1000 -F auid!=-1 -F key=perm_access"
          - "-a always,exit -F arch=b32 -S open,creat,truncate,ftruncate,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access"
          - "-a always,exit -F arch=b64 -S open,truncate,ftruncate,creat,openat,open_by_handle_at -F exit=-EACCES -F auid>=1000 -F auid!=-1 -F key=perm_access"
        _654070_cov: "{{ _654070_loaded.stdout | default('') | rhel9_audit_coverage(_654070_expected) }}"
        _654070_keep: "{{ (_654070_prev.content | default('') | b64decode).splitlines() | map('trim') | reject('match', '#') | select | list }}"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654070.rules
        content: "## Managed by rhel9_stig_full (RHEL-09-654070)\n{{ (_654070_keep + _654070_cov.missing) | unique | join('\n') }}\n"
        owner: root
        group: root
        mode: '0600'
      register: _654070_fix

    - name: RHEL-09-654070 | read the audit status
      ansible.builtin.command: auditctl -s
      register: _654070_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654070 | stop if the loaded rules are immutable
      ansible.builtin.fail:
        msg: "/etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654070.rules is in place, but the loaded audit rules are immutable (-e 2); it loads at the next boot"
      when: _654070_fix is changed and not ansible_check_mode and _654070_status.stdout is search('(?m)^enabled 2$')

    - name: RHEL-09-654070 | load the audit rules
      ansible.builtin.command: augenrules --load
      register: _654070_load
      failed_when: _654070_load.rc != 0 or _654070_load.stderr is search('(?i)error')
      when: _654070_fix is changed

    - name: RHEL-09-654070 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654070'] }}"
      when: (_654070_fix is changed)
  rescue:
    - name: RHEL-09-654070 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-654070': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654070'] }}"

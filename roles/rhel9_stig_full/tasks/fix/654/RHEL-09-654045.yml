---
# RHEL-09-654045 | V-258183 | fix
# RHEL 9 must audit all uses of the chcon command.
# CAT II (Medium)
#
# Writes the expected rules (copied from the check task; lint FIX-AUDIT-DRIFT
# keeps the two in step) that the loaded rules do not already cover, as
# computed by the same rhel9_audit_coverage filter the check uses, to
# /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654045.rules, then runs
# augenrules --load. Writing only uncovered lines avoids exact duplicates,
# which make auditctl stop loading. If the loaded rules are immutable (-e 2,
# RHEL-09-654275) the file loads at the next boot and the fix records that.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-654045 | fix
  block:
    - name: RHEL-09-654045 | read the loaded audit rules
      ansible.builtin.command: auditctl -l
      register: _654045_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654045 | read the rules this fix wrote before
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654045.rules
      register: _654045_prev
      failed_when: false

    - name: RHEL-09-654045 | write the rules not yet covered, keeping earlier ones
      vars:
        _654045_expected:
          - "-a always,exit -S all -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=-1 -F key=perm_mod"
        _654045_cov: "{{ _654045_loaded.stdout | default('') | rhel9_audit_coverage(_654045_expected) }}"
        _654045_keep: "{{ (_654045_prev.content | default('') | b64decode).splitlines() | map('trim') | reject('match', '#') | select | list }}"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654045.rules
        content: "## Managed by rhel9_stig_full (RHEL-09-654045)\n{{ (_654045_keep + _654045_cov.missing) | unique | join('\n') }}\n"
        owner: root
        group: root
        mode: '0600'
      register: _654045_fix

    - name: RHEL-09-654045 | read the audit status
      ansible.builtin.command: auditctl -s
      register: _654045_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654045 | stop if the loaded rules are immutable
      ansible.builtin.fail:
        msg: "/etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654045.rules is in place, but the loaded audit rules are immutable (-e 2); it loads at the next boot"
      when: _654045_fix is changed and not ansible_check_mode and _654045_status.stdout is search('(?m)^enabled 2$')

    - name: RHEL-09-654045 | load the audit rules
      ansible.builtin.command: augenrules --load
      register: _654045_load
      failed_when: _654045_load.rc != 0 or _654045_load.stderr is search('(?i)error')
      when: _654045_fix is changed

    - name: RHEL-09-654045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654045'] }}"
      when: (_654045_fix is changed)
  rescue:
    - name: RHEL-09-654045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-654045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654045'] }}"

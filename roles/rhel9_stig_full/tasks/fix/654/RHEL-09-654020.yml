---
# RHEL-09-654020 | V-258178 | fix
# RHEL 9 must audit all uses of the chown, fchown, fchownat, and lchown system
# calls.
# CAT II (Medium)
#
# Writes the expected rules (copied from the check task; lint FIX-AUDIT-DRIFT
# keeps the two in step) that the loaded rules do not already cover, as
# computed by the same rhel9_audit_coverage filter the check uses, to
# /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654020.rules, then runs
# augenrules --load. Writing only uncovered lines avoids exact duplicates,
# which make auditctl stop loading. If the loaded rules are immutable (-e 2,
# RHEL-09-654275) the file loads at the next boot and the fix records that.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-654020 | fix
  block:
    - name: RHEL-09-654020 | read the loaded audit rules
      ansible.builtin.command: auditctl -l
      register: _654020_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654020 | read the rules this fix wrote before
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654020.rules
      register: _654020_prev
      failed_when: false

    - name: RHEL-09-654020 | write the rules not yet covered, keeping earlier ones
      vars:
        _654020_expected:
          - "-a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat -F auid>=1000 -F auid!=-1 -F key=perm_mod"
          - "-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=-1 -F key=perm_mod"
        _654020_cov: "{{ _654020_loaded.stdout | default('') | rhel9_audit_coverage(_654020_expected) }}"
        _654020_keep: "{{ (_654020_prev.content | default('') | b64decode).splitlines() | map('trim') | reject('match', '#') | select | list }}"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654020.rules
        content: "## Managed by rhel9_stig_full (RHEL-09-654020)\n{{ (_654020_keep + _654020_cov.missing) | unique | join('\n') }}\n"
        owner: root
        group: root
        mode: '0600'
      register: _654020_fix

    - name: RHEL-09-654020 | read the audit status
      ansible.builtin.command: auditctl -s
      register: _654020_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654020 | stop if the loaded rules are immutable
      ansible.builtin.fail:
        msg: "/etc/audit/rules.d/50-rhel9-stig-full-RHEL-09-654020.rules is in place, but the loaded audit rules are immutable (-e 2); it loads at the next boot"
      when: _654020_fix is changed and not ansible_check_mode and _654020_status.stdout is search('(?m)^enabled 2$')

    - name: RHEL-09-654020 | load the audit rules
      ansible.builtin.command: augenrules --load
      register: _654020_load
      failed_when: _654020_load.rc != 0 or _654020_load.stderr is search('(?i)error')
      when: _654020_fix is changed

    - name: RHEL-09-654020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654020'] }}"
      when: (_654020_fix is changed)
  rescue:
    - name: RHEL-09-654020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-654020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654020'] }}"

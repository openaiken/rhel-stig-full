---
# RHEL-09-654270 | V-258228 | fix
# RHEL 9 audit system must protect logon UIDs from unauthorized change.
# CAT II (Medium)
#
# Writes --loginuid-immutable to /etc/audit/rules.d/11-rhel9-stig-full-
# loginuid.rules and regenerates /etc/audit/audit.rules (which the check
# reads) with augenrules --load.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-654270 | fix
  block:
    - name: RHEL-09-654270 | write --loginuid-immutable
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/11-rhel9-stig-full-loginuid.rules
        content: |
          ## Managed by rhel9_stig_full (RHEL-09-654270)
          --loginuid-immutable
        owner: root
        group: root
        mode: '0600'
      register: _654270_fix

    - name: RHEL-09-654270 | read the audit status
      ansible.builtin.command: auditctl -s
      register: _654270_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-654270 | stop if the loaded rules are immutable
      ansible.builtin.fail:
        msg: "/etc/audit/rules.d/11-rhel9-stig-full-loginuid.rules is in place, but the loaded audit rules are immutable (-e 2); it loads at the next boot"
      when: _654270_fix is changed and not ansible_check_mode and _654270_status.stdout is search('(?m)^enabled 2$')

    - name: RHEL-09-654270 | note the mode of /etc/audit/audit.rules
      ansible.builtin.stat:
        path: /etc/audit/audit.rules
      register: _654270_rmode

    - name: RHEL-09-654270 | load the audit rules
      ansible.builtin.command: augenrules --load
      register: _654270_load
      failed_when: _654270_load.rc != 0 or _654270_load.stderr is search('(?i)error')
      when: _654270_fix is changed

    # augenrules always leaves audit.rules at 0640; keep the mode it had
    # (RHEL-09-653110 requires 0600)
    - name: RHEL-09-654270 | restore the mode of /etc/audit/audit.rules
      ansible.builtin.file:
        path: /etc/audit/audit.rules
        mode: "{{ _654270_rmode.stat.mode }}"
      when: _654270_load is not skipped and _654270_rmode.stat.exists | default(false)

    - name: RHEL-09-654270 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654270'] }}"
      when: (_654270_fix is changed)
  rescue:
    - name: RHEL-09-654270 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-654270': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-654270'] }}"

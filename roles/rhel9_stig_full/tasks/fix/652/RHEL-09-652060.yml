---
# RHEL-09-652060 | V-258150 | fix
# RHEL 9 must use cron logging.
# CAT II (Medium)
#
# Writes cron.* /var/log/cron (the STIG fix) to /etc/rsyslog.d/rhel9-stig-
# full-cron.conf, checks the configuration with rsyslogd -N1, and restarts a
# running rsyslog.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-652060 | fix
  block:
    - name: RHEL-09-652060 | log cron at all priorities
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/rhel9-stig-full-cron.conf
        content: |
          # Managed by rhel9_stig_full (RHEL-09-652060)
          cron.*    /var/log/cron
        owner: root
        group: root
        mode: '0644'
      register: _652060_fix

    - name: RHEL-09-652060 | validate the rsyslog configuration
      ansible.builtin.command: rsyslogd -N1
      changed_when: false
      when: _652060_fix is changed and not ansible_check_mode

    - name: RHEL-09-652060 | restart a running rsyslog to apply it
      ansible.builtin.command: systemctl try-restart rsyslog
      when: _652060_fix is changed

    - name: RHEL-09-652060 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652060'] }}"
      when: (_652060_fix is changed)
  rescue:
    - name: RHEL-09-652060 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-652060': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652060'] }}"

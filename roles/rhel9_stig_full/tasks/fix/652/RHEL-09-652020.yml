---
# RHEL-09-652020 | V-258142 | fix
# The rsyslog service on RHEL 9 must be active.
# CAT II (Medium)
#
# Enables and starts rsyslog (installed by the RHEL-09-652010 fix).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-652020 | fix
  block:
    - name: RHEL-09-652020 | enable and start rsyslog
      ansible.builtin.systemd_service:
        name: rsyslog
        enabled: true
        state: started
      register: _652020_fix

    - name: RHEL-09-652020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652020'] }}"
      when: (_652020_fix is changed)
  rescue:
    - name: RHEL-09-652020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-652020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652020'] }}"

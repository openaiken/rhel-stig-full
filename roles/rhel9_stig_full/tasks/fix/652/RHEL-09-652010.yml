---
# RHEL-09-652010 | V-258140 | fix
# RHEL 9 must have the rsyslog package installed.
# CAT II (Medium)
#
# Installs rsyslog.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-652010 | fix
  block:
    - name: RHEL-09-652010 | install rsyslog
      ansible.builtin.dnf:
        name: rsyslog
        state: present
      register: _652010_fix

    - name: RHEL-09-652010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652010'] }}"
      when: (_652010_fix is changed)
  rescue:
    - name: RHEL-09-652010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-652010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-652010'] }}"

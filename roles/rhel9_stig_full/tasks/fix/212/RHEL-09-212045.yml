---
# RHEL-09-212045 | V-257794 | fix
# RHEL 9 must clear memory when it is freed to prevent use-after-free attacks.
# CAT II (Medium)
#
# Sets init_on_free=1 on every installed kernel (grubby --update-kernel=ALL)
# and in GRUB_CMDLINE_LINUX in /etc/default/grub, so it survives the next
# kernel install: an existing init_on_free= value is corrected, otherwise
# init_on_free=1 is appended. The checks read both. The running kernel uses it
# from the next boot.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-212045 | fix
  block:
    - name: RHEL-09-212045 | read the installed kernels' arguments
      ansible.builtin.command: grubby --info=ALL
      register: _212045_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-212045 | add init_on_free=1 to every installed kernel
      ansible.builtin.command: grubby --update-kernel=ALL --args=init_on_free=1
      register: _212045_kern
      when: >-
        (_212045_info.stdout_lines | select('match', '^args=') | list | length == 0)
        or (_212045_info.stdout_lines | select('match', '^args=')
            | reject('search', '(^args="|[ ])init_on_free=1([ ]|"$)') | list | length > 0)

    - name: RHEL-09-212045 | correct an existing init_on_free= in GRUB_CMDLINE_LINUX
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^([ \t]*GRUB_CMDLINE_LINUX="(?:[^"]*[ ])?)init_on_free=[^" ]*'
        replace: '\g<1>init_on_free=1'
      register: _212045_fix

    - name: RHEL-09-212045 | add init_on_free=1 to GRUB_CMDLINE_LINUX where it has no init_on_free=
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^([ \t]*GRUB_CMDLINE_LINUX=")(?!(?:[^"]*[ ])?init_on_free=)([^"]*)"(.*)$'
        line: '\1\2 init_on_free=1"\3'
        backrefs: true
      register: _212045_add

    - name: RHEL-09-212045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212045'] }}"
      when: (_212045_kern is changed) or (_212045_fix is changed) or (_212045_add is changed)
  rescue:
    - name: RHEL-09-212045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-212045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212045'] }}"

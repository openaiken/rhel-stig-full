---
# RHEL-09-212030 | V-257791 | fix
# RHEL 9 /boot/grub2/grub.cfg file must be owned by root.
# CAT II (Medium)
#
# Sets owner root on /boot/grub2/grub.cfg; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-212030 | fix
  block:
    - name: RHEL-09-212030 | look for /boot/grub2/grub.cfg
      ansible.builtin.stat:
        path: /boot/grub2/grub.cfg
      register: _212030_stat

    - name: RHEL-09-212030 | set owner root on /boot/grub2/grub.cfg
      ansible.builtin.file:
        path: /boot/grub2/grub.cfg
        owner: root
      when: _212030_stat.stat.exists
      register: _212030_fix

    - name: RHEL-09-212030 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212030'] }}"
      when: (_212030_fix is changed)
  rescue:
    - name: RHEL-09-212030 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-212030': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212030'] }}"

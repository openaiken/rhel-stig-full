---
# RHEL-09-212055 | V-257796 | fix
# RHEL 9 must enable auditing of processes that start prior to the audit
# daemon.
# CAT III (Low)
#
# Sets audit=1 on every installed kernel (grubby --update-kernel=ALL) and in
# GRUB_CMDLINE_LINUX in /etc/default/grub, so it survives the next kernel
# install: an existing audit= value is corrected, otherwise audit=1 is
# appended. The checks read both. The running kernel uses it from the next
# boot.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-212055 | fix
  block:
    - name: RHEL-09-212055 | read the installed kernels' arguments
      ansible.builtin.command: grubby --info=ALL
      register: _212055_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-212055 | add audit=1 to every installed kernel
      ansible.builtin.command: grubby --update-kernel=ALL --args=audit=1
      register: _212055_kern
      when: >-
        (_212055_info.stdout_lines | select('match', '^args=') | list | length == 0)
        or (_212055_info.stdout_lines | select('match', '^args=')
            | reject('search', '(^args="|[ ])audit=1([ ]|"$)') | list | length > 0)

    - name: RHEL-09-212055 | correct an existing audit= in GRUB_CMDLINE_LINUX
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^([ \t]*GRUB_CMDLINE_LINUX="(?:[^"]*[ ])?)audit=[^" ]*'
        replace: '\g<1>audit=1'
      register: _212055_fix

    - name: RHEL-09-212055 | add audit=1 to GRUB_CMDLINE_LINUX where it has no audit=
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^([ \t]*GRUB_CMDLINE_LINUX=")(?!(?:[^"]*[ ])?audit=)([^"]*)"(.*)$'
        line: '\1\2 audit=1"\3'
        backrefs: true
      register: _212055_add

    - name: RHEL-09-212055 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212055'] }}"
      when: (_212055_kern is changed) or (_212055_fix is changed) or (_212055_add is changed)
  rescue:
    - name: RHEL-09-212055 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-212055': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-212055'] }}"

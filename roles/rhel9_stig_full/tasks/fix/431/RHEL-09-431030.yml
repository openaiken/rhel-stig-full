---
# RHEL-09-431030 | V-258082 | fix
# RHEL 9 policycoreutils-python-utils package must be installed.
# CAT II (Medium)
#
# Installs policycoreutils-python-utils.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-431030 | fix
  block:
    - name: RHEL-09-431030 | install policycoreutils-python-utils
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      register: _431030_fix

    - name: RHEL-09-431030 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-431030'] }}"
      when: (_431030_fix is changed)
  rescue:
    - name: RHEL-09-431030 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-431030': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-431030'] }}"

---
# RHEL-09-431025 | V-258081 | fix
# RHEL 9 must have policycoreutils package installed.
# CAT II (Medium)
#
# Installs policycoreutils.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-431025 | fix
  block:
    - name: RHEL-09-431025 | install policycoreutils
      ansible.builtin.dnf:
        name: policycoreutils
        state: present
      register: _431025_fix

    - name: RHEL-09-431025 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-431025'] }}"
      when: (_431025_fix is changed)
  rescue:
    - name: RHEL-09-431025 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-431025': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-431025'] }}"

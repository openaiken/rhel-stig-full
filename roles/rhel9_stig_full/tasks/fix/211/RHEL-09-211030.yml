---
# RHEL-09-211030 | V-257781 | fix
# The graphical display manager must not be the default target on RHEL 9
# unless approved.
# CAT II (Medium)
#
# Sets the default boot target to multi-user.target, so the graphical display
# manager no longer starts at boot (it can still be started by hand). Not run
# when rhel9_gui_approved documents the graphical environment.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-211030 | fix
  block:
    - name: RHEL-09-211030 | boot to multi-user.target
      ansible.builtin.command: systemctl set-default multi-user.target
      register: _211030_fix

    - name: RHEL-09-211030 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-211030'] }}"
      when: (_211030_fix is changed)
  rescue:
    - name: RHEL-09-211030 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-211030': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-211030'] }}"

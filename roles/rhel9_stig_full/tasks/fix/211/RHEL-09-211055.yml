---
# RHEL-09-211055 | V-257786 | fix
# RHEL 9 debug-shell systemd service must be disabled.
# CAT II (Medium)
#
# Stops, disables and masks debug-shell.service. An existing
# /etc/systemd/system/debug-shell.service that is not a link to /dev/null (an
# admin override, which makes systemctl mask refuse) is removed first; the fix
# then confirms LoadState=masked, since the systemd module has reported
# success when the mask was refused.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-211055 | fix
  block:
    - name: RHEL-09-211055 | look for an override of debug-shell.service in /etc/systemd/system
      ansible.builtin.stat:
        path: /etc/systemd/system/debug-shell.service
      register: _211055_ovr

    - name: RHEL-09-211055 | remove the override, which blocks masking
      ansible.builtin.file:
        path: /etc/systemd/system/debug-shell.service
        state: absent
      register: _211055_rm
      when: _211055_ovr.stat.exists and (_211055_ovr.stat.lnk_source | default('')) != '/dev/null'

    - name: RHEL-09-211055 | mask debug-shell.service
      ansible.builtin.systemd_service:
        name: debug-shell.service
        masked: true
        enabled: false
        state: stopped
        daemon_reload: true
      register: _211055_fix

    - name: RHEL-09-211055 | confirm debug-shell.service is masked
      ansible.builtin.command: systemctl show -p LoadState --value debug-shell.service
      register: _211055_state
      changed_when: false
      failed_when: _211055_state.stdout | trim != 'masked'
      check_mode: false
      when: not ansible_check_mode

    - name: RHEL-09-211055 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-211055'] }}"
      when: (_211055_rm is changed) or (_211055_fix is changed)
  rescue:
    - name: RHEL-09-211055 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-211055': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-211055'] }}"

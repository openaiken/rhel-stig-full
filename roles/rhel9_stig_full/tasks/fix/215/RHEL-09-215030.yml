---
# RHEL-09-215030 | V-257829 | fix
# RHEL 9 must not have the ypserv package installed.
# CAT II (Medium)
#
# Removes ypserv.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215030 | fix
  block:
    - name: RHEL-09-215030 | remove ypserv
      ansible.builtin.dnf:
        name: ypserv
        state: absent
      register: _215030_fix

    - name: RHEL-09-215030 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215030'] }}"
      when: (_215030_fix is changed)
  rescue:
    - name: RHEL-09-215030 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215030': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215030'] }}"

---
# RHEL-09-215020 | V-257827 | fix
# RHEL 9 must not have the sendmail package installed.
# CAT II (Medium)
#
# Removes sendmail.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215020 | fix
  block:
    - name: RHEL-09-215020 | remove sendmail
      ansible.builtin.dnf:
        name: sendmail
        state: absent
      register: _215020_fix

    - name: RHEL-09-215020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215020'] }}"
      when: (_215020_fix is changed)
  rescue:
    - name: RHEL-09-215020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215020'] }}"

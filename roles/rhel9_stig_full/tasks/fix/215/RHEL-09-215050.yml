---
# RHEL-09-215050 | V-257833 | fix
# RHEL 9 must not have the iprutils package installed.
# CAT II (Medium)
#
# Removes iprutils, which only serves IBM Power RAID adapters. In use means: a
# package requires it, or an adapter is bound to the ipr driver.
#
# Evidence-gated: the fix acts only when nothing on the host shows the IBM
# Power RAID utilities (iprutils) in use. Otherwise it changes nothing and
# records each reason ("left in place: ...") in finding_details, for a person
# to remove the use, or to document the exception in
# rhel9_attest_documented_exceptions where the rule allows one.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215050 | fix
  block:
    - name: RHEL-09-215050 | look for signs that the IBM Power RAID utilities (iprutils) is in use
      ansible.builtin.shell: |
        shopt -s nullglob
        deps=$(rpm -q --whatrequires iprutils 2>/dev/null | grep -v '^no package')
        [ -n "$deps" ] && echo "IN USE: required by $(echo $deps)"
        ls /sys/bus/pci/drivers/ipr 2>/dev/null | grep -q ':' && echo 'IN USE: an IBM Power RAID adapter is bound to the ipr driver'
        true
      register: _215050_use
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-215050 | leave it in place if it is in use
      ansible.builtin.fail:
        msg: "left in place, the IBM Power RAID utilities (iprutils) appears to be in use: {{ _215050_use.stdout_lines | map('regex_replace', '^IN USE: ', '') | join('; ') }}"
      when: _215050_use.stdout_lines | select('match', '^IN USE') | list | length > 0

    - name: RHEL-09-215050 | remove iprutils
      ansible.builtin.dnf:
        name: iprutils
        state: absent
      register: _215050_fix

    - name: RHEL-09-215050 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215050'] }}"
      when: (_215050_fix is changed)
  rescue:
    - name: RHEL-09-215050 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215050': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215050'] }}"

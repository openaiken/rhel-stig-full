---
# RHEL-09-215040 | V-257831 | fix
# RHEL 9 must not have the telnet-server package installed.
# CAT II (Medium)
#
# Removes telnet-server.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215040 | fix
  block:
    - name: RHEL-09-215040 | remove telnet-server
      ansible.builtin.dnf:
        name: telnet-server
        state: absent
      register: _215040_fix

    - name: RHEL-09-215040 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215040'] }}"
      when: (_215040_fix is changed)
  rescue:
    - name: RHEL-09-215040 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215040': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215040'] }}"

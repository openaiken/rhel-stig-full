---
# RHEL-09-215085 | V-257840 | fix
# RHEL 9 must have the nss-tools package installed.
# CAT II (Medium)
#
# Installs nss-tools.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215085 | fix
  block:
    - name: RHEL-09-215085 | install nss-tools
      ansible.builtin.dnf:
        name: nss-tools
        state: present
      register: _215085_fix

    - name: RHEL-09-215085 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215085'] }}"
      when: (_215085_fix is changed)
  rescue:
    - name: RHEL-09-215085 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215085': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215085'] }}"

---
# RHEL-09-215010 | V-257825 | fix
# RHEL 9 subscription-manager package must be installed.
# CAT II (Medium)
#
# Installs subscription-manager. The host is not registered here.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215010 | fix
  block:
    - name: RHEL-09-215010 | install subscription-manager
      ansible.builtin.dnf:
        name: subscription-manager
        state: present
      register: _215010_fix

    - name: RHEL-09-215010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215010'] }}"
      when: (_215010_fix is changed)
  rescue:
    - name: RHEL-09-215010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215010'] }}"

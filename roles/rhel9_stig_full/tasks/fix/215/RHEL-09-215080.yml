---
# RHEL-09-215080 | V-257839 | fix
# RHEL 9 must have the gnutls-utils package installed.
# CAT II (Medium)
#
# Installs gnutls-utils.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215080 | fix
  block:
    - name: RHEL-09-215080 | install gnutls-utils
      ansible.builtin.dnf:
        name: gnutls-utils
        state: present
      register: _215080_fix

    - name: RHEL-09-215080 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215080'] }}"
      when: (_215080_fix is changed)
  rescue:
    - name: RHEL-09-215080 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215080': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215080'] }}"

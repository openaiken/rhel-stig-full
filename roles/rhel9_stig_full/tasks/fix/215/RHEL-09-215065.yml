---
# RHEL-09-215065 | V-257836 | fix
# RHEL 9 must not have the quagga package installed.
# CAT II (Medium)
#
# Removes quagga. In use means: a package requires it; a routing daemon is
# enabled or running; or its configuration was changed or added to.
#
# Evidence-gated: the fix acts only when nothing on the host shows the quagga
# routing suite in use. Otherwise it changes nothing and records each reason
# ("left in place: ...") in finding_details, for a person to remove the use,
# or to document the exception in rhel9_attest_documented_exceptions where the
# rule allows one.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215065 | fix
  block:
    - name: RHEL-09-215065 | look for signs that the quagga routing suite is in use
      ansible.builtin.shell: |
        shopt -s nullglob
        deps=$(rpm -q --whatrequires quagga 2>/dev/null | grep -v '^no package')
        [ -n "$deps" ] && echo "IN USE: required by $(echo $deps)"
        rpm -V quagga 2>/dev/null | awk '$2 == "c" { print "IN USE: configuration changed from the package: " $NF }'
        for f in /etc/quagga/*; do [ -e "$f" ] || continue; rpm -qf "$f" >/dev/null 2>&1 || echo "IN USE: local configuration file $f"; done
        [ "$(systemctl is-enabled zebra 2>/dev/null)" = enabled ] && echo "IN USE: zebra is enabled"
        systemctl is-active --quiet zebra 2>/dev/null && echo "IN USE: zebra is running"
        [ "$(systemctl is-enabled ospfd 2>/dev/null)" = enabled ] && echo "IN USE: ospfd is enabled"
        systemctl is-active --quiet ospfd 2>/dev/null && echo "IN USE: ospfd is running"
        [ "$(systemctl is-enabled ospf6d 2>/dev/null)" = enabled ] && echo "IN USE: ospf6d is enabled"
        systemctl is-active --quiet ospf6d 2>/dev/null && echo "IN USE: ospf6d is running"
        [ "$(systemctl is-enabled bgpd 2>/dev/null)" = enabled ] && echo "IN USE: bgpd is enabled"
        systemctl is-active --quiet bgpd 2>/dev/null && echo "IN USE: bgpd is running"
        [ "$(systemctl is-enabled ripd 2>/dev/null)" = enabled ] && echo "IN USE: ripd is enabled"
        systemctl is-active --quiet ripd 2>/dev/null && echo "IN USE: ripd is running"
        [ "$(systemctl is-enabled ripngd 2>/dev/null)" = enabled ] && echo "IN USE: ripngd is enabled"
        systemctl is-active --quiet ripngd 2>/dev/null && echo "IN USE: ripngd is running"
        [ "$(systemctl is-enabled isisd 2>/dev/null)" = enabled ] && echo "IN USE: isisd is enabled"
        systemctl is-active --quiet isisd 2>/dev/null && echo "IN USE: isisd is running"
        [ "$(systemctl is-enabled pimd 2>/dev/null)" = enabled ] && echo "IN USE: pimd is enabled"
        systemctl is-active --quiet pimd 2>/dev/null && echo "IN USE: pimd is running"
        [ "$(systemctl is-enabled watchquagga 2>/dev/null)" = enabled ] && echo "IN USE: watchquagga is enabled"
        systemctl is-active --quiet watchquagga 2>/dev/null && echo "IN USE: watchquagga is running"
        true
      register: _215065_use
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-215065 | leave it in place if it is in use
      ansible.builtin.fail:
        msg: "left in place, the quagga routing suite appears to be in use: {{ _215065_use.stdout_lines | map('regex_replace', '^IN USE: ', '') | join('; ') }}"
      when: _215065_use.stdout_lines | select('match', '^IN USE') | list | length > 0

    - name: RHEL-09-215065 | remove quagga
      ansible.builtin.dnf:
        name: quagga
        state: absent
      register: _215065_fix

    - name: RHEL-09-215065 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215065'] }}"
      when: (_215065_fix is changed)
  rescue:
    - name: RHEL-09-215065 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215065': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215065'] }}"

---
# RHEL-09-215090 | V-257841 | fix
# RHEL 9 must have the rng-tools package installed.
# CAT II (Medium)
#
# Installs rng-tools.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215090 | fix
  block:
    - name: RHEL-09-215090 | install rng-tools
      ansible.builtin.dnf:
        name: rng-tools
        state: present
      register: _215090_fix

    - name: RHEL-09-215090 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215090'] }}"
      when: (_215090_fix is changed)
  rescue:
    - name: RHEL-09-215090 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215090': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215090'] }}"

---
# RHEL-09-215100 | V-258234 | fix
# RHEL 9 must have the crypto-policies package installed.
# CAT I (High)
#
# Installs crypto-policies.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-215100 | fix
  block:
    - name: RHEL-09-215100 | install crypto-policies
      ansible.builtin.dnf:
        name: crypto-policies
        state: present
      register: _215100_fix

    - name: RHEL-09-215100 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215100'] }}"
      when: (_215100_fix is changed)
  rescue:
    - name: RHEL-09-215100 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-215100': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-215100'] }}"

---
# RHEL-09-231055 | V-257852 | fix
# RHEL 9 must prevent code from being executed on file systems that contain
# user home directories.
# CAT II (Medium)
#
# Adds noexec to the /etc/fstab entry for /home (keeping its other options)
# and remounts it with noexec; the check reads the live mount table. A host
# where /home is not a separate file system, or is mounted by a systemd unit
# rather than fstab, gets a recorded failure: that needs a person. Programs
# and scripts can no longer be run from it.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231055 | fix
  block:
    - name: RHEL-09-231055 | read how /home is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /home
      register: _231055_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231055 | stop if /home is not a separate file system
      ansible.builtin.fail:
        msg: "/home is not a separate file system; that needs repartitioning, not a mount option"
      when: _231055_mnt.rc != 0

    - name: RHEL-09-231055 | read the /etc/fstab entry for /home
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/home"' /etc/fstab
      register: _231055_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231055 | stop if /home has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/home has no /etc/fstab entry (mounted by a systemd unit?); add noexec to the Options= of that unit"
      when: _231055_fstab.stdout | trim == ''

    - name: RHEL-09-231055 | add noexec to the /etc/fstab entry for /home
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/home\s+\S+\s+)(?!(?:\S*,)?noexec(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,noexec'
      register: _231055_fix

    - name: RHEL-09-231055 | remount /home with noexec
      ansible.builtin.command: mount -o remount,noexec /home
      register: _231055_remount
      when: _231055_mnt.stdout is not search('(^|,)noexec(,|$)')

    - name: RHEL-09-231055 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231055'] }}"
      when: (_231055_fix is changed) or (_231055_remount is changed)
  rescue:
    - name: RHEL-09-231055 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231055': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231055'] }}"

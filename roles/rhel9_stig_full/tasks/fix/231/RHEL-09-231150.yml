---
# RHEL-09-231150 | V-257871 | fix
# RHEL 9 must mount /var/log with the noexec option.
# CAT II (Medium)
#
# Adds noexec to the /etc/fstab entry for /var/log (keeping its other options)
# and remounts it with noexec; the check reads the live mount table. A host
# where /var/log is not a separate file system, or is mounted by a systemd
# unit rather than fstab, gets a recorded failure: that needs a person.
# Programs and scripts can no longer be run from it.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231150 | fix
  block:
    - name: RHEL-09-231150 | read how /var/log is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /var/log
      register: _231150_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231150 | stop if /var/log is not a separate file system
      ansible.builtin.fail:
        msg: "/var/log is not a separate file system; that needs repartitioning, not a mount option"
      when: _231150_mnt.rc != 0

    - name: RHEL-09-231150 | read the /etc/fstab entry for /var/log
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/var/log"' /etc/fstab
      register: _231150_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231150 | stop if /var/log has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/var/log has no /etc/fstab entry (mounted by a systemd unit?); add noexec to the Options= of that unit"
      when: _231150_fstab.stdout | trim == ''

    - name: RHEL-09-231150 | add noexec to the /etc/fstab entry for /var/log
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/var/log\s+\S+\s+)(?!(?:\S*,)?noexec(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,noexec'
      register: _231150_fix

    - name: RHEL-09-231150 | remount /var/log with noexec
      ansible.builtin.command: mount -o remount,noexec /var/log
      register: _231150_remount
      when: _231150_mnt.stdout is not search('(^|,)noexec(,|$)')

    - name: RHEL-09-231150 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231150'] }}"
      when: (_231150_fix is changed) or (_231150_remount is changed)
  rescue:
    - name: RHEL-09-231150 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231150': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231150'] }}"

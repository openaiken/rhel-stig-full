---
# RHEL-09-231125 | V-257866 | fix
# RHEL 9 must mount /tmp with the nodev option.
# CAT II (Medium)
#
# Adds nodev to the /etc/fstab entry for /tmp (keeping its other options) and
# remounts it with nodev; the check reads the live mount table. A host where
# /tmp is not a separate file system, or is mounted by a systemd unit rather
# than fstab, gets a recorded failure: that needs a person.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231125 | fix
  block:
    - name: RHEL-09-231125 | read how /tmp is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /tmp
      register: _231125_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231125 | stop if /tmp is not a separate file system
      ansible.builtin.fail:
        msg: "/tmp is not a separate file system; that needs repartitioning, not a mount option"
      when: _231125_mnt.rc != 0

    - name: RHEL-09-231125 | read the /etc/fstab entry for /tmp
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/tmp"' /etc/fstab
      register: _231125_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231125 | stop if /tmp has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/tmp has no /etc/fstab entry (mounted by a systemd unit?); add nodev to the Options= of that unit"
      when: _231125_fstab.stdout | trim == ''

    - name: RHEL-09-231125 | add nodev to the /etc/fstab entry for /tmp
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/tmp\s+\S+\s+)(?!(?:\S*,)?nodev(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,nodev'
      register: _231125_fix

    - name: RHEL-09-231125 | remount /tmp with nodev
      ansible.builtin.command: mount -o remount,nodev /tmp
      register: _231125_remount
      when: _231125_mnt.stdout is not search('(^|,)nodev(,|$)')

    - name: RHEL-09-231125 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231125'] }}"
      when: (_231125_fix is changed) or (_231125_remount is changed)
  rescue:
    - name: RHEL-09-231125 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231125': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231125'] }}"

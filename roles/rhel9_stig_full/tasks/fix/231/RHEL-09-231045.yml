---
# RHEL-09-231045 | V-257850 | fix
# RHEL 9 must prevent device files from being interpreted on file systems that
# contain user home directories.
# CAT II (Medium)
#
# Adds nodev to the /etc/fstab entry for /home (keeping its other options) and
# remounts it with nodev; the check reads the live mount table. A host where
# /home is not a separate file system, or is mounted by a systemd unit rather
# than fstab, gets a recorded failure: that needs a person.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231045 | fix
  block:
    - name: RHEL-09-231045 | read how /home is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /home
      register: _231045_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231045 | stop if /home is not a separate file system
      ansible.builtin.fail:
        msg: "/home is not a separate file system; that needs repartitioning, not a mount option"
      when: _231045_mnt.rc != 0

    - name: RHEL-09-231045 | read the /etc/fstab entry for /home
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/home"' /etc/fstab
      register: _231045_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231045 | stop if /home has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/home has no /etc/fstab entry (mounted by a systemd unit?); add nodev to the Options= of that unit"
      when: _231045_fstab.stdout | trim == ''

    - name: RHEL-09-231045 | add nodev to the /etc/fstab entry for /home
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/home\s+\S+\s+)(?!(?:\S*,)?nodev(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,nodev'
      register: _231045_fix

    - name: RHEL-09-231045 | remount /home with nodev
      ansible.builtin.command: mount -o remount,nodev /home
      register: _231045_remount
      when: _231045_mnt.stdout is not search('(^|,)nodev(,|$)')

    - name: RHEL-09-231045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231045'] }}"
      when: (_231045_fix is changed) or (_231045_remount is changed)
  rescue:
    - name: RHEL-09-231045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231045'] }}"

---
# RHEL-09-231165 | V-257874 | fix
# RHEL 9 must mount /var/log/audit with the noexec option.
# CAT II (Medium)
#
# Adds noexec to the /etc/fstab entry for /var/log/audit (keeping its other
# options) and remounts it with noexec; the check reads the live mount table.
# A host where /var/log/audit is not a separate file system, or is mounted by
# a systemd unit rather than fstab, gets a recorded failure: that needs a
# person. Programs and scripts can no longer be run from it.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231165 | fix
  block:
    - name: RHEL-09-231165 | read how /var/log/audit is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /var/log/audit
      register: _231165_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231165 | stop if /var/log/audit is not a separate file system
      ansible.builtin.fail:
        msg: "/var/log/audit is not a separate file system; that needs repartitioning, not a mount option"
      when: _231165_mnt.rc != 0

    - name: RHEL-09-231165 | read the /etc/fstab entry for /var/log/audit
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/var/log/audit"' /etc/fstab
      register: _231165_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231165 | stop if /var/log/audit has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/var/log/audit has no /etc/fstab entry (mounted by a systemd unit?); add noexec to the Options= of that unit"
      when: _231165_fstab.stdout | trim == ''

    - name: RHEL-09-231165 | add noexec to the /etc/fstab entry for /var/log/audit
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/var/log/audit\s+\S+\s+)(?!(?:\S*,)?noexec(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,noexec'
      register: _231165_fix

    - name: RHEL-09-231165 | remount /var/log/audit with noexec
      ansible.builtin.command: mount -o remount,noexec /var/log/audit
      register: _231165_remount
      when: _231165_mnt.stdout is not search('(^|,)noexec(,|$)')

    - name: RHEL-09-231165 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231165'] }}"
      when: (_231165_fix is changed) or (_231165_remount is changed)
  rescue:
    - name: RHEL-09-231165 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231165': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231165'] }}"

---
# RHEL-09-231185 | V-257878 | fix
# RHEL 9 must mount /var/tmp with the nosuid option.
# CAT II (Medium)
#
# Adds nosuid to the /etc/fstab entry for /var/tmp (keeping its other options)
# and remounts it with nosuid; the check reads the live mount table. A host
# where /var/tmp is not a separate file system, or is mounted by a systemd
# unit rather than fstab, gets a recorded failure: that needs a person.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231185 | fix
  block:
    - name: RHEL-09-231185 | read how /var/tmp is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /var/tmp
      register: _231185_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231185 | stop if /var/tmp is not a separate file system
      ansible.builtin.fail:
        msg: "/var/tmp is not a separate file system; that needs repartitioning, not a mount option"
      when: _231185_mnt.rc != 0

    - name: RHEL-09-231185 | read the /etc/fstab entry for /var/tmp
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/var/tmp"' /etc/fstab
      register: _231185_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231185 | stop if /var/tmp has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/var/tmp has no /etc/fstab entry (mounted by a systemd unit?); add nosuid to the Options= of that unit"
      when: _231185_fstab.stdout | trim == ''

    - name: RHEL-09-231185 | add nosuid to the /etc/fstab entry for /var/tmp
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/var/tmp\s+\S+\s+)(?!(?:\S*,)?nosuid(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,nosuid'
      register: _231185_fix

    - name: RHEL-09-231185 | remount /var/tmp with nosuid
      ansible.builtin.command: mount -o remount,nosuid /var/tmp
      register: _231185_remount
      when: _231185_mnt.stdout is not search('(^|,)nosuid(,|$)')

    - name: RHEL-09-231185 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231185'] }}"
      when: (_231185_fix is changed) or (_231185_remount is changed)
  rescue:
    - name: RHEL-09-231185 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231185': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231185'] }}"

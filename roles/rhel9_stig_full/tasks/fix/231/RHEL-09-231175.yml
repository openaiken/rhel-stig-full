---
# RHEL-09-231175 | V-257876 | fix
# RHEL 9 must mount /var/tmp with the nodev option.
# CAT II (Medium)
#
# Adds nodev to the /etc/fstab entry for /var/tmp (keeping its other options)
# and remounts it with nodev; the check reads the live mount table. A host
# where /var/tmp is not a separate file system, or is mounted by a systemd
# unit rather than fstab, gets a recorded failure: that needs a person.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-231175 | fix
  block:
    - name: RHEL-09-231175 | read how /var/tmp is mounted
      ansible.builtin.command: findmnt -rn -o OPTIONS --mountpoint /var/tmp
      register: _231175_mnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231175 | stop if /var/tmp is not a separate file system
      ansible.builtin.fail:
        msg: "/var/tmp is not a separate file system; that needs repartitioning, not a mount option"
      when: _231175_mnt.rc != 0

    - name: RHEL-09-231175 | read the /etc/fstab entry for /var/tmp
      ansible.builtin.command: awk '$1 !~ /^#/ && $2 == "/var/tmp"' /etc/fstab
      register: _231175_fstab
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-231175 | stop if /var/tmp has no /etc/fstab entry
      ansible.builtin.fail:
        msg: "/var/tmp has no /etc/fstab entry (mounted by a systemd unit?); add nodev to the Options= of that unit"
      when: _231175_fstab.stdout | trim == ''

    - name: RHEL-09-231175 | add nodev to the /etc/fstab entry for /var/tmp
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]\S*\s+/var/tmp\s+\S+\s+)(?!(?:\S*,)?nodev(?:,|\s))(\S+)'
        replace: '\g<1>\g<2>,nodev'
      register: _231175_fix

    - name: RHEL-09-231175 | remount /var/tmp with nodev
      ansible.builtin.command: mount -o remount,nodev /var/tmp
      register: _231175_remount
      when: _231175_mnt.stdout is not search('(^|,)nodev(,|$)')

    - name: RHEL-09-231175 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231175'] }}"
      when: (_231175_fix is changed) or (_231175_remount is changed)
  rescue:
    - name: RHEL-09-231175 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-231175': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-231175'] }}"

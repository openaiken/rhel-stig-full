---
# RHEL-09-232105 | V-257901 | fix
# RHEL 9 /etc/group- file must be group-owned by root.
# CAT II (Medium)
#
# Sets group root on /etc/group-; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232105 | fix
  block:
    - name: RHEL-09-232105 | look for /etc/group-
      ansible.builtin.stat:
        path: /etc/group-
      register: _232105_stat

    - name: RHEL-09-232105 | set group root on /etc/group-
      ansible.builtin.file:
        path: /etc/group-
        group: root
      when: _232105_stat.stat.exists
      register: _232105_fix

    - name: RHEL-09-232105 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232105'] }}"
      when: (_232105_fix is changed)
  rescue:
    - name: RHEL-09-232105 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232105': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232105'] }}"

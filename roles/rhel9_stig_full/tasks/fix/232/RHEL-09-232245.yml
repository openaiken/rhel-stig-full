---
# RHEL-09-232245 | V-257929 | fix
# A sticky bit must be set on all RHEL 9 public directories.
# CAT II (Medium)
#
# Sets the sticky bit on every world-writable directory on local file systems
# that lacks it (the check command, without its 40-line limit), so users
# cannot delete other users files there.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232245 | fix
  block:
    - name: RHEL-09-232245 | find world-writable directories without the sticky bit
      ansible.builtin.shell: df --local -P | awk 'NR > 1 { print $6 }' | xargs -I{} find {} -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null || true
      register: _232245_dirs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-232245 | set the sticky bit
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '+t'
      loop: "{{ _232245_dirs.stdout_lines }}"
      register: _232245_fix

    - name: RHEL-09-232245 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232245'] }}"
      when: (_232245_fix is changed)
  rescue:
    - name: RHEL-09-232245 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232245': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232245'] }}"

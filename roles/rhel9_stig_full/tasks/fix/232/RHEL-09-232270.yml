---
# RHEL-09-232270 | V-257934 | fix
# RHEL 9 /etc/shadow file must have mode 0000 to prevent unauthorized access.
# CAT II (Medium)
#
# Sets mode '0000' on /etc/shadow; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232270 | fix
  block:
    - name: RHEL-09-232270 | look for /etc/shadow
      ansible.builtin.stat:
        path: /etc/shadow
      register: _232270_stat

    - name: RHEL-09-232270 | set mode '0000' on /etc/shadow
      ansible.builtin.file:
        path: /etc/shadow
        mode: '0000'
      when: _232270_stat.stat.exists
      register: _232270_fix

    - name: RHEL-09-232270 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232270'] }}"
      when: (_232270_fix is changed)
  rescue:
    - name: RHEL-09-232270 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232270': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232270'] }}"

---
# RHEL-09-232130 | V-257906 | fix
# RHEL 9 /etc/passwd file must be owned by root.
# CAT II (Medium)
#
# Sets owner root on /etc/passwd; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232130 | fix
  block:
    - name: RHEL-09-232130 | look for /etc/passwd
      ansible.builtin.stat:
        path: /etc/passwd
      register: _232130_stat

    - name: RHEL-09-232130 | set owner root on /etc/passwd
      ansible.builtin.file:
        path: /etc/passwd
        owner: root
      when: _232130_stat.stat.exists
      register: _232130_fix

    - name: RHEL-09-232130 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232130'] }}"
      when: (_232130_fix is changed)
  rescue:
    - name: RHEL-09-232130 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232130': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232130'] }}"

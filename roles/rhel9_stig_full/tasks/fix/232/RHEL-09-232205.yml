---
# RHEL-09-232205 | V-257921 | fix
# RHEL 9 library files must be group-owned by root or a system account.
# CAT II (Medium)
#
# Sets the group of every shared library file the check lists (any group but
# root, as the STIG check command lists them) to root, using the check's own
# find command. A file a package owns is then changed from its packaged state,
# which is what the STIG requires.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232205 | fix
  block:
    - name: RHEL-09-232205 | list what the check found
      ansible.builtin.shell: find -L /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -group root 2>/dev/null || true
      register: _232205_paths
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-232205 | correct them
      ansible.builtin.file:
        path: "{{ item }}"
        group: root
      loop: "{{ _232205_paths.stdout_lines }}"
      register: _232205_fix

    - name: RHEL-09-232205 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232205'] }}"
      when: (_232205_fix is changed)
  rescue:
    - name: RHEL-09-232205 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232205': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232205'] }}"

---
# RHEL-09-232010 | V-257882 | fix
# RHEL 9 system commands must have mode 755 or less permissive.
# CAT II (Medium)
#
# Removes group and other write from every system command the check lists,
# using the check's own find command. A file a package owns is then changed
# from its packaged state, which is what the STIG requires.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232010 | fix
  block:
    - name: RHEL-09-232010 | list what the check found
      ansible.builtin.shell: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin -perm /022 2>/dev/null || true
      register: _232010_paths
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-232010 | correct them
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'go-w'
      loop: "{{ _232010_paths.stdout_lines }}"
      register: _232010_fix

    - name: RHEL-09-232010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232010'] }}"
      when: (_232010_fix is changed)
  rescue:
    - name: RHEL-09-232010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232010'] }}"

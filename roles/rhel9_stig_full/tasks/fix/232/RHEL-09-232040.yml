---
# RHEL-09-232040 | V-257888 | fix
# RHEL 9 permissions of cron configuration files and directories must not be
# modified from the operating system defaults.
# CAT II (Medium)
#
# Restores the packaged owner, group and mode of every file in cronie crontabs
# (rpm --setugids, then rpm --setperms), which is what rpm --verify compares.
# Content changes are not touched; a modified non-configuration file still
# fails the re-check.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232040 | fix
  block:
    - name: RHEL-09-232040 | restore packaged owners and groups
      ansible.builtin.command: rpm --setugids cronie crontabs
      register: _232040_ugid

    - name: RHEL-09-232040 | restore packaged modes
      ansible.builtin.command: rpm --setperms cronie crontabs
      register: _232040_fix

    - name: RHEL-09-232040 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232040'] }}"
      when: (_232040_ugid is changed) or (_232040_fix is changed)
  rescue:
    - name: RHEL-09-232040 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232040': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232040'] }}"

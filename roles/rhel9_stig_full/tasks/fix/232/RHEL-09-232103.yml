---
# RHEL-09-232103 | V-270175 | fix
# RHEL 9 "/etc/audit/" must be owned by root.
# CAT II (Medium)
#
# Sets the owner of /etc/audit to root.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232103 | fix
  block:
    - name: RHEL-09-232103 | set the owner of /etc/audit to root
      ansible.builtin.file:
        path: /etc/audit
        owner: root
        state: directory
      register: _232103_fix

    - name: RHEL-09-232103 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232103'] }}"
      when: (_232103_fix is changed)
  rescue:
    - name: RHEL-09-232103 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232103': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232103'] }}"

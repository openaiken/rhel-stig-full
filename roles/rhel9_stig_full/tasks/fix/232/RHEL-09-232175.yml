---
# RHEL-09-232175 | V-257915 | fix
# RHEL 9 /var/log directory must be group-owned by root.
# CAT II (Medium)
#
# Sets group root on /var/log; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232175 | fix
  block:
    - name: RHEL-09-232175 | look for /var/log
      ansible.builtin.stat:
        path: /var/log
      register: _232175_stat

    - name: RHEL-09-232175 | set group root on /var/log
      ansible.builtin.file:
        path: /var/log
        group: root
      when: _232175_stat.stat.exists
      register: _232175_fix

    - name: RHEL-09-232175 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232175'] }}"
      when: (_232175_fix is changed)
  rescue:
    - name: RHEL-09-232175 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232175': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232175'] }}"

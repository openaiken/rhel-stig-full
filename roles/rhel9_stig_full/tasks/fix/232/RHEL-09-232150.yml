---
# RHEL-09-232150 | V-257910 | fix
# RHEL 9 /etc/shadow file must be owned by root.
# CAT II (Medium)
#
# Sets owner root on /etc/shadow; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232150 | fix
  block:
    - name: RHEL-09-232150 | look for /etc/shadow
      ansible.builtin.stat:
        path: /etc/shadow
      register: _232150_stat

    - name: RHEL-09-232150 | set owner root on /etc/shadow
      ansible.builtin.file:
        path: /etc/shadow
        owner: root
      when: _232150_stat.stat.exists
      register: _232150_fix

    - name: RHEL-09-232150 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232150'] }}"
      when: (_232150_fix is changed)
  rescue:
    - name: RHEL-09-232150 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232150': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232150'] }}"

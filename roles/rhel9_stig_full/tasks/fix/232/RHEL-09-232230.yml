---
# RHEL-09-232230 | V-257926 | fix
# RHEL 9 cron configuration files directory must be owned by root.
# CAT II (Medium)
#
# Sets the owner of every /etc/cron* entry the check lists to root, using the
# check's own find command. A file a package owns is then changed from its
# packaged state, which is what the STIG requires.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232230 | fix
  block:
    - name: RHEL-09-232230 | list what the check found
      ansible.builtin.shell: find /etc/cron* -maxdepth 0 ! -user root 2>/dev/null || true
      register: _232230_paths
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-232230 | correct them
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
      loop: "{{ _232230_paths.stdout_lines }}"
      register: _232230_fix

    - name: RHEL-09-232230 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232230'] }}"
      when: (_232230_fix is changed)
  rescue:
    - name: RHEL-09-232230 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232230': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232230'] }}"

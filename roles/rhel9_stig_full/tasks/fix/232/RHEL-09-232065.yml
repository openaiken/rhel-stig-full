---
# RHEL-09-232065 | V-257893 | fix
# RHEL 9 /etc/gshadow file must have mode 0000 or less permissive to prevent
# unauthorized access.
# CAT II (Medium)
#
# Sets mode '0000' on /etc/gshadow; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232065 | fix
  block:
    - name: RHEL-09-232065 | look for /etc/gshadow
      ansible.builtin.stat:
        path: /etc/gshadow
      register: _232065_stat

    - name: RHEL-09-232065 | set mode '0000' on /etc/gshadow
      ansible.builtin.file:
        path: /etc/gshadow
        mode: '0000'
      when: _232065_stat.stat.exists
      register: _232065_fix

    - name: RHEL-09-232065 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232065'] }}"
      when: (_232065_fix is changed)
  rescue:
    - name: RHEL-09-232065 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232065': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232065'] }}"

---
# RHEL-09-232210 | V-257922 | fix
# RHEL 9 library directories must be owned by root.
# CAT II (Medium)
#
# Sets the owner of every library directory the check lists to root, using the
# check's own find command. A file a package owns is then changed from its
# packaged state, which is what the STIG requires.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232210 | fix
  block:
    - name: RHEL-09-232210 | list what the check found
      ansible.builtin.shell: find -L /lib /lib64 /usr/lib /usr/lib64 -xdev -type d ! -user root 2>/dev/null || true
      register: _232210_paths
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-232210 | correct them
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
      loop: "{{ _232210_paths.stdout_lines }}"
      register: _232210_fix

    - name: RHEL-09-232210 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232210'] }}"
      when: (_232210_fix is changed)
  rescue:
    - name: RHEL-09-232210 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232210': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232210'] }}"

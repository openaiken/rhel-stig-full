---
# RHEL-09-232135 | V-257907 | fix
# RHEL 9 /etc/passwd file must be group-owned by root.
# CAT II (Medium)
#
# Sets group root on /etc/passwd; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232135 | fix
  block:
    - name: RHEL-09-232135 | look for /etc/passwd
      ansible.builtin.stat:
        path: /etc/passwd
      register: _232135_stat

    - name: RHEL-09-232135 | set group root on /etc/passwd
      ansible.builtin.file:
        path: /etc/passwd
        group: root
      when: _232135_stat.stat.exists
      register: _232135_fix

    - name: RHEL-09-232135 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232135'] }}"
      when: (_232135_fix is changed)
  rescue:
    - name: RHEL-09-232135 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232135': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232135'] }}"

---
# RHEL-09-232120 | V-257904 | fix
# RHEL 9 /etc/gshadow- file must be owned by root.
# CAT II (Medium)
#
# Sets owner root on /etc/gshadow-; skipped if the file does not exist.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-232120 | fix
  block:
    - name: RHEL-09-232120 | look for /etc/gshadow-
      ansible.builtin.stat:
        path: /etc/gshadow-
      register: _232120_stat

    - name: RHEL-09-232120 | set owner root on /etc/gshadow-
      ansible.builtin.file:
        path: /etc/gshadow-
        owner: root
      when: _232120_stat.stat.exists
      register: _232120_fix

    - name: RHEL-09-232120 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232120'] }}"
      when: (_232120_fix is changed)
  rescue:
    - name: RHEL-09-232120 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-232120': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-232120'] }}"

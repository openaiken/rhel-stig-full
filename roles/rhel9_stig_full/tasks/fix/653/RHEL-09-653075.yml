---
# RHEL-09-653075 | V-258164 | fix
# RHEL 9 audit system must audit local events.
# CAT II (Medium)
#
# Sets local_events = yes (the STIG fix value) in /etc/audit/auditd.conf,
# replacing the last local_events line (the one in effect), and has auditd
# reread its configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653075 | fix
  block:
    - name: RHEL-09-653075 | set local_events
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*local_events[ \t]*='
        line: 'local_events = yes'
      register: _653075_fix

    - name: RHEL-09-653075 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653075_fix is changed

    - name: RHEL-09-653075 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653075'] }}"
      when: (_653075_fix is changed)
  rescue:
    - name: RHEL-09-653075 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653075': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653075'] }}"

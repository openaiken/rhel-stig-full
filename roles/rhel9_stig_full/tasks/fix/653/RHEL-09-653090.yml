---
# RHEL-09-653090 | V-258167 | fix
# RHEL 9 audit logs file must have mode 0600 or less permissive to prevent
# unauthorized access to the audit log.
# CAT II (Medium)
#
# Removes all but owner read and write from every file in the audit log
# directory (log_file in auditd.conf).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653090 | fix
  block:
    - name: RHEL-09-653090 | read the audit log location and group from auditd.conf
      ansible.builtin.shell: |
        f=$(awk -F= '$1 ~ /^[[:space:]]*log_file[[:space:]]*$/ { v = $2 } END { gsub(/[[:space:]]/, "", v); print v }' /etc/audit/auditd.conf)
        g=$(awk -F= '$1 ~ /^[[:space:]]*log_group[[:space:]]*$/ { v = $2 } END { gsub(/[[:space:]]/, "", v); print v }' /etc/audit/auditd.conf)
        echo "${f:-/var/log/audit/audit.log}"
        echo "${g:-root}"
      register: _653090_conf
      changed_when: false
      failed_when: false
      check_mode: false

    - name: RHEL-09-653090 | find the audit log files
      ansible.builtin.find:
        paths: "{{ _653090_conf.stdout_lines[0] | dirname }}"
        file_type: file
      register: _653090_files

    - name: RHEL-09-653090 | restrict the audit log files to 0600 or less
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u-xs,g-rwxs,o-rwxt'
      loop: "{{ _653090_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: _653090_fix

    - name: RHEL-09-653090 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653090'] }}"
      when: (_653090_fix is changed)
  rescue:
    - name: RHEL-09-653090 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653090': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653090'] }}"

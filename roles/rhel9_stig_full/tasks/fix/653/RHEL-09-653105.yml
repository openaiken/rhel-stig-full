---
# RHEL-09-653105 | V-258170 | fix
# RHEL 9 must write audit records to disk.
# CAT II (Medium)
#
# Sets write_logs = yes (the STIG fix value) in /etc/audit/auditd.conf,
# replacing the last write_logs line (the one in effect), and has auditd
# reread its configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653105 | fix
  block:
    - name: RHEL-09-653105 | set write_logs
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*write_logs[ \t]*='
        line: 'write_logs = yes'
      register: _653105_fix

    - name: RHEL-09-653105 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653105_fix is changed

    - name: RHEL-09-653105 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653105'] }}"
      when: (_653105_fix is changed)
  rescue:
    - name: RHEL-09-653105 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653105': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653105'] }}"

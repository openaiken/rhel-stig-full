---
# RHEL-09-653035 | V-258156 | fix
# RHEL 9 must take action when allocated audit record storage volume reaches
# 75 percent of the repository maximum audit record storage capacity.
# CAT II (Medium)
#
# Sets space_left = 25% in /etc/audit/auditd.conf (replacing the last
# space_left line, the one in effect) and has auditd reread its configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653035 | fix
  block:
    - name: RHEL-09-653035 | set space_left
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*space_left[ \t]*='
        line: 'space_left = 25%'
      register: _653035_fix
    - name: RHEL-09-653035 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653035_fix is changed

    - name: RHEL-09-653035 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653035'] }}"
      when: (_653035_fix is changed)
  rescue:
    - name: RHEL-09-653035 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653035': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653035'] }}"

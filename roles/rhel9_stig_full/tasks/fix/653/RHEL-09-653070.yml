---
# RHEL-09-653070 | V-258163 | fix
# RHEL 9 System Administrator (SA) and/or information system security officer
# (ISSO) (at a minimum) must be alerted of an audit processing failure event.
# CAT II (Medium)
#
# Sets action_mail_acct = root (the STIG fix value) in /etc/audit/auditd.conf,
# replacing the last action_mail_acct line (the one in effect), and has auditd
# reread its configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653070 | fix
  block:
    - name: RHEL-09-653070 | set action_mail_acct
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*action_mail_acct[ \t]*='
        line: 'action_mail_acct = root'
      register: _653070_fix

    - name: RHEL-09-653070 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653070_fix is changed

    - name: RHEL-09-653070 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653070'] }}"
      when: (_653070_fix is changed)
  rescue:
    - name: RHEL-09-653070 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653070': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653070'] }}"

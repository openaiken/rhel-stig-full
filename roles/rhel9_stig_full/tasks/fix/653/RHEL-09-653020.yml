---
# RHEL-09-653020 | V-258153 | fix
# RHEL 9 audit system must take appropriate action when an error writing to
# the audit storage volume occurs.
# CAT II (Medium)
#
# Sets disk_error_action = rhel9_fix_audit_failure_action in
# /etc/audit/auditd.conf (replacing the last disk_error_action line, the one
# in effect) and has auditd reread its configuration. The value is
# rhel9_fix_audit_failure_action (default HALT, the STIG fix default; SYSLOG
# or SINGLE where availability is documented).
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653020 | fix
  block:
    - name: RHEL-09-653020 | set disk_error_action
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*disk_error_action[ \t]*='
        line: 'disk_error_action = {{ rhel9_fix_audit_failure_action }}'
      register: _653020_fix
    - name: RHEL-09-653020 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653020_fix is changed

    - name: RHEL-09-653020 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653020'] }}"
      when: (_653020_fix is changed)
  rescue:
    - name: RHEL-09-653020 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653020': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653020'] }}"

---
# RHEL-09-653010 | V-258151 | fix
# RHEL 9 audit package must be installed.
# CAT II (Medium)
#
# Installs audit.
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653010 | fix
  block:
    - name: RHEL-09-653010 | install audit
      ansible.builtin.dnf:
        name: audit
        state: present
      register: _653010_fix

    - name: RHEL-09-653010 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653010'] }}"
      when: (_653010_fix is changed)
  rescue:
    - name: RHEL-09-653010 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653010': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653010'] }}"

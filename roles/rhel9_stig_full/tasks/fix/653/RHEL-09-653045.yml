---
# RHEL-09-653045 | V-258158 | fix
# RHEL 9 must take action when allocated audit record storage volume reaches
# 95 percent of the audit record storage capacity.
# CAT II (Medium)
#
# Sets admin_space_left = 5% in /etc/audit/auditd.conf (replacing the last
# admin_space_left line, the one in effect) and has auditd reread its
# configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653045 | fix
  block:
    - name: RHEL-09-653045 | set admin_space_left
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*admin_space_left[ \t]*='
        line: 'admin_space_left = 5%'
      register: _653045_fix
    - name: RHEL-09-653045 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653045_fix is changed

    - name: RHEL-09-653045 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653045'] }}"
      when: (_653045_fix is changed)
  rescue:
    - name: RHEL-09-653045 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653045': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653045'] }}"

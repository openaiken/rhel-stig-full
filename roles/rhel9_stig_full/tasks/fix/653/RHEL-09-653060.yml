---
# RHEL-09-653060 | V-258161 | fix
# RHEL 9 must label all offloaded audit logs before sending them to the
# central log server.
# CAT II (Medium)
#
# Sets name_format = hostname in /etc/audit/auditd.conf (replacing the last
# name_format line, the one in effect) and has auditd reread its
# configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653060 | fix
  block:
    - name: RHEL-09-653060 | set name_format
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*name_format[ \t]*='
        line: 'name_format = hostname'
      register: _653060_fix
    - name: RHEL-09-653060 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653060_fix is changed

    - name: RHEL-09-653060 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653060'] }}"
      when: (_653060_fix is changed)
  rescue:
    - name: RHEL-09-653060 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653060': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653060'] }}"

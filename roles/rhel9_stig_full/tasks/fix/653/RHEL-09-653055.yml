---
# RHEL-09-653055 | V-258160 | fix
# RHEL 9 audit system must take appropriate action when the audit files have
# reached maximum size.
# CAT II (Medium)
#
# Sets max_log_file_action = ROTATE (the STIG fix value) in
# /etc/audit/auditd.conf, replacing the last max_log_file_action line (the one
# in effect), and has auditd reread its configuration.
#
# Runs only when the check reported open (tasks/remediate.yml); the rule is
# re-checked afterwards. A failure is recorded, not fatal.

- name: RHEL-09-653055 | fix
  block:
    - name: RHEL-09-653055 | set max_log_file_action
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^[ \t]*max_log_file_action[ \t]*='
        line: 'max_log_file_action = ROTATE'
      register: _653055_fix

    - name: RHEL-09-653055 | have auditd reread its configuration
      ansible.builtin.command: auditctl --signal reload
      when: _653055_fix is changed

    - name: RHEL-09-653055 | note that the rule changed
      ansible.builtin.set_fact:
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653055'] }}"
      when: (_653055_fix is changed)
  rescue:
    - name: RHEL-09-653055 | record the failed fix; re-check, since it may have changed something
      ansible.builtin.set_fact:
        stig_fix_errors: "{{ stig_fix_errors | combine({'RHEL-09-653055': ansible_failed_result.msg | default('fix failed')}) }}"
        stig_fixed: "{{ stig_fixed + ['RHEL-09-653055'] }}"

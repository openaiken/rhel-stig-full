# Remediation runs after every check, and only when the remediate tag was
# selected: a run tagged only with a STIG ID checks that rule without fixing
# it, even though the fix tasks are tagged remediate.
- name: fix open rules, then re-check the ones that changed
  include_tasks:
    file: remediate.yml
    apply:
      tags: [remediate]
  when: "'remediate' in ansible_run_tags"
  tags: always

# Write the final results (after any remediation and re-check). Skipped when
# empty, e.g. a run whose tags selected no rule, and on a remediate run without
# validate, whose pre-fix verdicts are stale by the time they would be written.
- name: write results to disk
  copy:
    content: "{{ stig_facts | to_nice_json(indent=2) }}"
    dest: "{{ stig_facts_dir }}/{{ stig_run_ts }}-{{ inventory_hostname }}.json"
  delegate_to: localhost
  become: false
  when:
    - stig_facts | length > 0
    - "'remediate' not in ansible_run_tags or 'validate' in ansible_run_tags"
  tags: always

- name: render the checklist
  import_tasks: render.yml

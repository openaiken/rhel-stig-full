---
- name: set run timestamp
  set_fact:
    # Four-digit year so it cannot be misread as a day; seconds so a
    # tag-limited run in the same minute cannot overwrite a full run.
    stig_run_ts: "{{ '%Y%b%d-%H:%M:%S' | strftime }}"
  delegate_to: localhost
  become: false
  tags: always

- name: initialize results accumulator
  set_fact:
    stig_facts: {}
  tags: always


---
# RHEL-09-213060 | V-257807
# RHEL 9 must disable the Stream Control Transmission Protocol (SCTP) kernel
# module.
# CAT II (Medium) | CCI-000381

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Both lines the STIG shows are required, uncommented, in any file it lists
# (install <module> /bin/false, and blacklist <module>); the module name is
# matched as a whole word. /bin/true is accepted as well: either prevents
# loading. A use documented with the ISSO is accepted
# (rhel9_attest_documented_exceptions).

- name: RHEL-09-213060 | check sctp module is disabled
  shell: |
    lines=$(grep -hsE '^[[:space:]]*(install|blacklist)[[:space:]]+sctp([[:space:]]|$)' /etc/modprobe.conf /etc/modprobe.d/*)
    echo "modprobe lines for sctp: $(echo "$lines" | tr '\n' ' ')"
    inst=$(echo "$lines" | grep -E '^[[:space:]]*install[[:space:]]+sctp[[:space:]]+/(usr/)?bin/(false|true)[[:space:]]*$')
    bl=$(echo "$lines" | grep -E '^[[:space:]]*blacklist[[:space:]]+sctp[[:space:]]*$')
    if [ -n "$inst" ] && [ -n "$bl" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: both install sctp /bin/false and blacklist sctp are required"
    fi
  register: _213060_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-213060 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213060': {
        'status':
          'not_a_finding' if _213060_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-213060')
          else 'open'),
        'finding_details':
          _213060_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-213060') or '(none)'),
        'comments':
          'Add install sctp /bin/false and blacklist sctp to a file in /etc/modprobe.d/.'
      }
    }) }}"
  tags: [validate]

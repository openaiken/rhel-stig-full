---
# RHEL-09-213030 | V-257801
# RHEL 9 must enable kernel parameters to enforce discretionary access control
# (DAC) on hardlinks.
# CAT II (Medium) | CCI-002165, CCI-002235

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-213030 | check fs.protected_hardlinks (running value)
  shell: |
    want='1'
    got=$(sysctl -n fs.protected_hardlinks 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?fs[.]protected_hardlinks[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: fs.protected_hardlinks = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _213030_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-213030 | record fs.protected_hardlinks status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213030': {
        'status':
          'not_a_finding' if _213030_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _213030_result.stdout | trim,
        'comments':
          'Set fs.protected_hardlinks = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

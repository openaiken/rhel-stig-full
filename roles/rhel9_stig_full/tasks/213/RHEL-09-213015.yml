---
# RHEL-09-213015 | V-257798
# RHEL 9 must prevent kernel profiling by nonprivileged users.
# CAT II (Medium) | CCI-001082, CCI-001090

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-213015 | check kernel.perf_event_paranoid (running value)
  shell: |
    want='2'
    got=$(sysctl -n kernel.perf_event_paranoid 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?kernel[.]perf_event_paranoid[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: kernel.perf_event_paranoid = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _213015_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-213015 | record kernel.perf_event_paranoid status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213015': {
        'status':
          'not_a_finding' if _213015_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _213015_result.stdout | trim,
        'comments':
          'Set kernel.perf_event_paranoid = 2 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

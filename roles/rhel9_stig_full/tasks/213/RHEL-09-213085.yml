---
# RHEL-09-213085 | V-257812
# RHEL 9 must disable core dump backtraces.
# CAT II (Medium) | CCI-000366

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Not applicable when kernel dumps are disabled per RHEL-09-213040
# (kernel.core_pattern |/bin/false), as the STIG note says; the formal role
# reported open regardless. A documented ISSO exception is accepted
# (rhel9_attest_documented_exceptions).

- name: RHEL-09-213085 | check coredump ProcessSizeMax
  shell: |
    cp=$(sysctl -n kernel.core_pattern 2>/dev/null)
    if [ "$cp" = "|/bin/false" ]; then
      echo "NA: kernel.core_pattern is |/bin/false, so core dumps are disabled per RHEL-09-213040"
      exit 0
    fi
    echo "kernel.core_pattern: ${cp:-(unreadable)}"
    val=$(systemd-analyze cat-config systemd/coredump.conf 2>/dev/null \
      | grep -iE '^[[:space:]]*ProcessSizeMax[[:space:]]*=' | tail -1 | cut -d= -f2- | tr -d '[:space:]')
    echo "ProcessSizeMax (effective, systemd-analyze cat-config, last wins): ${val:-(not set)}"
    if [ "${val,,}" = "0" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: ProcessSizeMax must be set to 0"
    fi
  register: _213085_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-213085 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213085': {
        'status':
          'not_applicable' if _213085_result.stdout is search('^NA:', multiline=True)
          else ('not_a_finding' if _213085_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-213085')
          else 'open')),
        'finding_details':
          _213085_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-213085') or '(none)'),
        'comments':
          'Set ProcessSizeMax=0 in /etc/systemd/coredump.conf or a drop-in in coredump.conf.d.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-213080 | V-257811
# RHEL 9 must restrict usage of ptrace to descendant processes.
# CAT II (Medium) | CCI-001082

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-213080 | check kernel.yama.ptrace_scope (running value)
  shell: |
    want='1'
    got=$(sysctl -n kernel.yama.ptrace_scope 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?kernel[.]yama[.]ptrace_scope[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: kernel.yama.ptrace_scope = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _213080_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-213080 | record kernel.yama.ptrace_scope status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213080': {
        'status':
          'not_a_finding' if _213080_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _213080_result.stdout | trim,
        'comments':
          'Set kernel.yama.ptrace_scope = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

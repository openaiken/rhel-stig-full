---
# RHEL-09-213070 | V-257809
# RHEL 9 must implement address space layout randomization (ASLR) to protect
# its memory from unauthorized code execution.
# CAT II (Medium) | CCI-002824

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.
# This rule also requires the configuration files to set it: every
# uncommented occurrence in the paths the STIG lists must be 2, with at least
# one and no conflicting value.

- name: RHEL-09-213070 | check kernel.randomize_va_space (running value)
  shell: |
    want='2'
    got=$(sysctl -n kernel.randomize_va_space 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?kernel[.]randomize_va_space[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: kernel.randomize_va_space = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    conf=$(grep -Hs -E '^[[:space:]]*kernel[.]randomize_va_space[[:space:]]*=' /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf /etc/sysctl.conf /etc/sysctl.d/*.conf)
    echo "CONFIG FILES:"; echo "${conf:-  (none)}"
    bad_conf=$(echo "$conf" | awk -F= 'NF > 1 {v = $NF; gsub(/[[:space:]]/, "", v); if (v != "'"$want"'") print}')
    if [ "$got" = "$want" ] && [ -n "$conf" ] && [ -z "$bad_conf" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      [ -z "$conf" ] && echo "FAIL: not set in any sysctl configuration file"
      [ -n "$bad_conf" ] && echo "FAIL: conflicting configuration: $bad_conf"
      [ "$got" != "$want" ] && echo "FAIL: running value is not $want"
    fi
  register: _213070_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-213070 | record kernel.randomize_va_space status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-213070': {
        'status':
          'not_a_finding' if _213070_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _213070_result.stdout | trim,
        'comments':
          'Set kernel.randomize_va_space = 2 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-631020 | V-258133
# RHEL 9 must prohibit the use of cached authenticators after one day.
# CAT II (Medium) | CCI-002007

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Per the STIG: if cache_credentials is not true, no further check;
# otherwise offline_credentials_expiration must be 1.

- name: RHEL-09-631020 | check sssd cached credential expiry
  shell: |
    shopt -s nullglob
    files=(/etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf)
    cache=$(grep -hiE '^[[:space:]]*cache_credentials[[:space:]]*=' "${files[@]}" 2>/dev/null)
    expire=$(grep -hiE '^[[:space:]]*offline_credentials_expiration[[:space:]]*=' "${files[@]}" 2>/dev/null | tail -1 | cut -d= -f2 | tr -d '[:space:]')
    echo "cache_credentials: ${cache:-(not set)}"
    echo "offline_credentials_expiration: ${expire:-(not set)}"
    if ! echo "$cache" | grep -qiE '=[[:space:]]*true'; then
      echo "STATUS: PASS"
      echo "PASS: cached credentials are not enabled"
    elif [ "$expire" = "1" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: cache_credentials is true but offline_credentials_expiration is not 1"
    fi
  register: _631020_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-631020 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-631020': {
        'status':
          'not_a_finding' if _631020_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _631020_result.stdout | trim,
        'comments':
          'Set offline_credentials_expiration = 1 in the [pam] section of sssd.conf, or do not cache credentials.'
      }
    }) }}"
  tags: [validate]

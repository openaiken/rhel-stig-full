---
# RHEL-09-611120 | V-258113
# RHEL 9 must require the maximum number of repeating characters of the same
# character class be limited to four when passwords are changed.
# CAT II (Medium) | CCI-004066, CCI-000195

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.

- name: RHEL-09-611120 | check pwquality maxclassrepeat
  shell: |
    shopt -s nullglob
    files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="maxclassrepeat" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "maxclassrepeat (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'maxclassrepeat' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if isint "$val" && [ "$val" -ge 1 ] && [ "$val" -le 4 ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: maxclassrepeat must be 1 to 4"
    fi
  register: _611120_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-611120 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-611120': {
        'status':
          'not_a_finding' if _611120_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _611120_result.stdout | trim,
        'comments':
          'Set maxclassrepeat = 4 in /etc/security/pwquality.conf or a conf.d file.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-611180 | V-258125
# The pcscd socket on RHEL 9 must be active.
# CAT II (Medium) | CCI-004046, CCI-001948

# The STIG checks systemctl is-active pcscd.socket. The DISA Ansible role instead
# asserts that pcscd.service is started; the service is socket-activated and
# normally idle until a smart card request arrives, so in check mode the role
# reports a change on every host with an active socket (a false positive once
# the callback records multi-task rules correctly). Check what the STIG checks.

- name: RHEL-09-611180 | check pcscd socket state
  shell: |
    rpm -q pcsc-lite &>/dev/null || echo "pcsc-lite package not installed"
    echo "pcscd.socket: $(systemctl is-active pcscd.socket 2>&1)"
  register: _611180_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-611180 | record pcscd socket status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-611180': {
        'status':
          'not_a_finding' if _611180_result.stdout is search('^pcscd.socket: active$', multiline=True)
          else 'open',
        'finding_details': _611180_result.stdout | trim,
        'comments':
          'Enable the socket: sudo systemctl enable --now pcscd.socket'
      }
    }) }}"
  tags: [validate]

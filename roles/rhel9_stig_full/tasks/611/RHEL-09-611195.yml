---
# RHEL-09-611195 | V-258128
# RHEL 9 must require authentication to access emergency mode.
# CAT II (Medium) | CCI-000213

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Decided on the effective ExecStart (systemctl show), as for RHEL-09-611200: a
# drop-in resetting ExecStart to a plain shell leaves the unit file matching.

- name: RHEL-09-611195 | check emergency.service runs sulogin
  shell: |
    effective=$(systemctl show emergency.service -p ExecStart --value 2>/dev/null)
    echo "EFFECTIVE ExecStart: ${effective:-(unavailable)}"
    if echo "$effective" | grep -q 'argv\[\]=[^;]*sulogin'; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: emergency.service does not run sulogin"
    fi
  register: _611195_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-611195 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-611195': {
        'status':
          'not_a_finding' if _611195_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _611195_result.stdout | trim,
        'comments':
          'Restore ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency for emergency.service.'
      }
    }) }}"
  tags: [validate]

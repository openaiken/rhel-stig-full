---
# RHEL-09-212035 | V-257792
# RHEL 9 must disable virtual system calls.
# CAT II (Medium) | CCI-000366
#
# The STIG states TWO finding conditions and both must hold:
#   1. every current kernel carries vsyscall=none (grubby)
#   2. GRUB_CMDLINE_LINUX in /etc/default/grub carries it too, so the
#      setting survives the next kernel install
# Checking only 1 was a false negative: a host configured with
# grubby --update-kernel=ALL passes today and silently loses virtual system calls
# on the next kernel update.
# The STIG also allows an ISSO-documented operational requirement as an
# exception; record that in the checklist manually if it applies.

- name: RHEL-09-212035 | check vsyscall=none in kernel args and grub defaults
  shell: |
    fail=0
    # grubby printing no kernel entries would otherwise read as compliant
    if [ "$(grubby --info=ALL 2>/dev/null | grep -c '^args=')" -eq 0 ]; then
      fail=1
      echo "FAIL: grubby --info=ALL returned no kernel entries; cannot verify"
    fi
    missing=$(grubby --info=ALL | grep args | grep -v 'vsyscall=none')
    if [ -n "$missing" ]; then
      fail=1
      echo "FAIL: kernels missing vsyscall=none:"
      echo "$missing"
    else
      echo "PASS: vsyscall=none present in all current kernel args"
    fi
    # /etc/default/grub is a shell file that grub2-mkconfig sources, so the last
    # assignment wins; grepping for any GRUB_CMDLINE_LINUX= line holding the
    # argument passed an earlier line that a later one overrode. Source it
    # in a subshell, as grub2-mkconfig does, and match whole arguments.
    gcl=$( (. /etc/default/grub >/dev/null 2>&1; printf '%s' "$GRUB_CMDLINE_LINUX") )
    if [[ " $gcl " == *" vsyscall=none "* ]]; then
      echo "PASS: vsyscall=none present in GRUB_CMDLINE_LINUX"
    else
      fail=1
      echo "FAIL: vsyscall=none absent from GRUB_CMDLINE_LINUX in /etc/default/grub"
      echo "      setting will not persist across kernel updates"
      echo "CURRENT (as sourced): GRUB_CMDLINE_LINUX=\"$gcl\""
    fi
    if [ "$fail" -eq 0 ]; then echo "STATUS: PASS"; else echo "STATUS: FAIL"; fi
  register: _212035_vsyscall
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-212035 | record vsyscall status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-212035': {
        'status': 'not_a_finding' if _212035_vsyscall.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _212035_vsyscall.stdout | trim,
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=vsyscall=none && '
          ~ 'add vsyscall=none to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

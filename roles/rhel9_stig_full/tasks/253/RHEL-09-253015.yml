---
# RHEL-09-253015 | V-257958
# RHEL 9 must ignore Internet Protocol version 4 (IPv4) Internet Control
# Message Protocol (ICMP) redirect messages.
# CAT II (Medium) | CCI-000366

# The STIG checks the running value (sysctl). The DISA Ansible role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-253015 | check net.ipv4.conf.all.accept_redirects (running value)
  shell: |
    want='0'
    got=$(sysctl -n net.ipv4.conf.all.accept_redirects 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?net[.]ipv4[.]conf[.]all[.]accept_redirects[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: net.ipv4.conf.all.accept_redirects = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _253015_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-253015 | record net.ipv4.conf.all.accept_redirects status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-253015': {
        'status':
          'not_a_finding' if _253015_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _253015_result.stdout | trim,
        'comments':
          'Set net.ipv4.conf.all.accept_redirects = 0 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

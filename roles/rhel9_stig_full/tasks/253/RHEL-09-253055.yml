---
# RHEL-09-253055 | V-257966
# RHEL 9 must not respond to Internet Control Message Protocol (ICMP) echoes
# sent to a broadcast address.
# CAT II (Medium) | CCI-000366

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-253055 | check net.ipv4.icmp_echo_ignore_broadcasts (running value)
  shell: |
    want='1'
    got=$(sysctl -n net.ipv4.icmp_echo_ignore_broadcasts 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?net[.]ipv4[.]icmp_echo_ignore_broadcasts[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: net.ipv4.icmp_echo_ignore_broadcasts = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _253055_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-253055 | record net.ipv4.icmp_echo_ignore_broadcasts status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-253055': {
        'status':
          'not_a_finding' if _253055_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _253055_result.stdout | trim,
        'comments':
          'Set net.ipv4.icmp_echo_ignore_broadcasts = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

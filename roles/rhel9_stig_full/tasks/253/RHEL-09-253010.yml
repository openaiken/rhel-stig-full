---
# RHEL-09-253010 | V-257957
# RHEL 9 must be configured to use TCP syncookies.
# CAT II (Medium) | CCI-001095, CCI-002385

# The STIG checks the running value (sysctl). The DISA Ansible role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-253010 | check net.ipv4.tcp_syncookies (running value)
  shell: |
    want='1'
    got=$(sysctl -n net.ipv4.tcp_syncookies 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?net[.]ipv4[.]tcp_syncookies[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: net.ipv4.tcp_syncookies = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _253010_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-253010 | record net.ipv4.tcp_syncookies status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-253010': {
        'status':
          'not_a_finding' if _253010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _253010_result.stdout | trim,
        'comments':
          'Set net.ipv4.tcp_syncookies = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

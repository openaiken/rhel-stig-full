---
# RHEL-09-251010 | V-257935
# RHEL 9 must have the firewalld package installed.
# CAT II (Medium) | CCI-000382, CCI-002314, CCI-002322

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-251010 | check firewalld is installed
  shell: |
    if rpm -q --quiet firewalld; then state=installed; else state="not installed"; fi
    echo "firewalld: $state ($(rpm -q firewalld 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: firewalld must be installed"
    fi
  register: _251010_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-251010 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-251010': {
        'status':
          'not_a_finding' if _251010_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _251010_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install firewalld'
      }
    }) }}"
  tags: [validate]

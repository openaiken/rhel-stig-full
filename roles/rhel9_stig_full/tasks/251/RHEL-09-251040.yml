---
# RHEL-09-251040 | V-257941
# RHEL 9 network interfaces must not be in promiscuous mode.
# CAT II (Medium) | CCI-000366

- name: RHEL-09-251040 | check for interfaces in promiscuous mode
  shell: ip link show | grep PROMISC || true
  register: _251040_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-251040 | record promiscuous mode status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-251040': {
        'status': 'not_a_finding' if not (_251040_result.stdout | trim) else 'open',
        'finding_details':
          'Interfaces in promiscuous mode:\n'
          ~ (_251040_result.stdout | trim if _251040_result.stdout | trim else '(none)'),
        'comments':
          'Disable promiscuous mode with: ip link set <interface> promisc off. '
          ~ 'Investigate why the interface was set promiscuous.'
      }
    }) }}"
  tags: [validate]

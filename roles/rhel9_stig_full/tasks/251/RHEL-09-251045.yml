---
# RHEL-09-251045 | V-257942
# RHEL 9 must enable hardening for the Berkeley Packet Filter just-in-time
# compiler.
# CAT II (Medium) | CCI-000366

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-251045 | check net.core.bpf_jit_harden (running value)
  shell: |
    want='2'
    got=$(sysctl -n net.core.bpf_jit_harden 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?net[.]core[.]bpf_jit_harden[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: net.core.bpf_jit_harden = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _251045_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-251045 | record net.core.bpf_jit_harden status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-251045': {
        'status':
          'not_a_finding' if _251045_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _251045_result.stdout | trim,
        'comments':
          'Set net.core.bpf_jit_harden = 2 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

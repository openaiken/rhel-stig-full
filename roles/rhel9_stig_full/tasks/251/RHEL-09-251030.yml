---
# RHEL-09-251030 | V-257939
# RHEL 9 must protect against or limit the effects of denial-of-service (DoS)
# attacks by ensuring rate-limiting measures on impacted network interfaces
# are implemented.
# CAT II (Medium) | CCI-002385

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.

- name: RHEL-09-251030 | check firewalld FirewallBackend
  shell: |
    shopt -s nullglob
    files=(/etc/firewalld/firewalld.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="FirewallBackend" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "FirewallBackend (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'FirewallBackend' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [[ "${val,,}" =~ ^(nftables)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: FirewallBackend must be nftables"
    fi
  register: _251030_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-251030 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-251030': {
        'status':
          'not_a_finding' if _251030_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _251030_result.stdout | trim,
        'comments':
          'Set FirewallBackend=nftables in /etc/firewalld/firewalld.conf.'
      }
    }) }}"
  tags: [validate]

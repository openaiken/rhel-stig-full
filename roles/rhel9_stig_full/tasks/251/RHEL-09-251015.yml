---
# RHEL-09-251015 | V-257936
# The firewalld service on RHEL 9 must be active.
# CAT II (Medium) | CCI-000382, CCI-002314

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-251015 | check firewalld is active
  shell: |
    active=$(systemctl is-active firewalld 2>/dev/null)
    sub=$(systemctl show firewalld -p SubState --value 2>/dev/null)
    echo "firewalld: ActiveState=${active:-unknown} SubState=${sub:-unknown}"
    if [ "$active" = "active" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: firewalld is not active"
    fi
  register: _251015_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-251015 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-251015': {
        'status':
          'not_a_finding' if _251015_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _251015_result.stdout | trim,
        'comments':
          'Enable and start it: sudo systemctl enable --now firewalld'
      }
    }) }}"
  tags: [validate]

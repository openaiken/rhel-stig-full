---
# RHEL-09-211045 | V-257784
# The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled.
# CAT I (High) | CCI-000366
#
# Checks for CtrlAltDelBurstAction=none in /etc/systemd/system.conf and drop-ins.
# The formal role covers the regular Ctrl-Alt-Delete (RHEL-09-211050); this rule
# covers the burst sequence (7 presses within 2 seconds).

# systemd reads drop-ins only if the filename ends in .conf; one without that
# extension is parsed by nothing and silently ignored. V2R9 renamed the STIG
# drop-in to 55-CtrlAltDel-BurstAction.conf for exactly that reason, and V2R8 of
# the formal role created the extensionless name. Grepping files alone would
# therefore report a dead configuration as compliant, so query the effective
# value from systemd and treat that as authoritative.
- name: RHEL-09-211045 | check CtrlAltDelBurstAction setting
  shell: |
    effective=$(systemctl show -p CtrlAltDelBurstAction --value 2>/dev/null)
    echo "EFFECTIVE: ${effective:-unknown}"
    echo "CONFIGURED IN:"
    grep -rIh CtrlAltDelBurstAction \
      /etc/systemd/system.conf /etc/systemd/system.conf.d/ 2>/dev/null \
      | grep -v '^[[:space:]]*#' || echo "(no uncommented setting found)"
    echo "IGNORED DROP-INS (missing .conf extension):"
    find /etc/systemd/system.conf.d/ -maxdepth 1 -type f ! -name '*.conf' \
      2>/dev/null | while read -r f; do
        if grep -qi CtrlAltDelBurstAction "$f" 2>/dev/null; then
          echo "$f - systemd ignores this file, rename it to end in .conf"
        fi
      done
  register: _211045_burst
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-211045 | record CtrlAltDelBurstAction status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-211045': {
        'status':
          'not_a_finding'
          if 'effective: none' in (_211045_burst.stdout | lower)
          else 'open',
        'finding_details':
          (_211045_burst.stdout | trim if _211045_burst.stdout | trim else '(no output)')
          ~ '\nResult: '
          ~ ('not_a_finding - systemd reports CtrlAltDelBurstAction=none in effect'
             if 'effective: none' in (_211045_burst.stdout | lower)
             else 'OPEN - systemd does not report CtrlAltDelBurstAction=none in effect'),
        'comments':
          'To remediate: '
          ~ 'sudo mkdir -p /etc/systemd/system.conf.d && '
          ~ 'sudo bash -c \echo CtrlAltDelBurstAction=none > '
          ~ '/etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf\ && '
          ~ 'sudo systemctl daemon-reload'
      }
    }) }}"
  tags: [validate]

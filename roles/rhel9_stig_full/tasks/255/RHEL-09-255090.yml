---
# RHEL-09-255090 | V-257994
# RHEL 9 must force a frequent session key renegotiation for SSH connections
# to the server.
# CAT II (Medium) | CCI-000068, CCI-002418, CCI-002421

# The DISA Ansible role manages this setting only where openssh-server is installed,
# so on a host without it the rule had no result and rendered not_reviewed.
# Without openssh-server this is not applicable (RHEL-09-255010 reports the
# missing package). Otherwise both STIG conditions must hold: the effective
# value (sshd -T) is compliant, and the keyword is set, uncommented, in
# sshd_config or a file it Includes; the STIG makes a missing line a finding
# even where the sshd default would comply. Unverifiable is open.

- name: RHEL-09-255090 | check sshd rekeylimit (effective and configured)
  shell: |
    rpm -q openssh-server &>/dev/null || { echo "NA: openssh-server not installed"; exit 0; }
    # sshd_config plus the files its Include lines name (relative to /etc/ssh)
    files=/etc/ssh/sshd_config
    while read -r pat; do
      case "$pat" in /*) ;; *) pat="/etc/ssh/$pat" ;; esac
      for f in $pat; do [ -f "$f" ] && files="$files $f"; done
    done < <(awk 'tolower($1) == "include" {for (i = 2; i <= NF; i++) print $i}' /etc/ssh/sshd_config 2>/dev/null)
    conf=$(grep -iHE '^[[:space:]]*rekeylimit([[:space:]]|=)' $files 2>/dev/null)
    val_raw=$(sshd -T 2>/dev/null | awk '$1 == "rekeylimit" {$1 = ""; sub(/^ /, ""); print; exit}')
    val=${val_raw,,}
    echo "EFFECTIVE (sshd -T): rekeylimit ${val_raw:-(unavailable)}"
    echo "CONFIGURED: ${conf:-(not set in any sshd config file)}"
    if [ -z "$conf" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: rekeylimit is not set in sshd_config or an included file"
    elif [ -n "$val" ] && set -- $val; [ "${1:-0}" != "0" ] && [ "${2:-0}" != "0" ] && [ "${2:-none}" != "none" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: rekeylimit must be a data limit and a time limit (e.g. 1G 1h)"
    fi
  register: _255090_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-255090 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-255090': {
        'status':
          'not_applicable' if _255090_result.stdout is search('^NA:', multiline=True)
          else ('not_a_finding' if _255090_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open'),
        'finding_details':
          _255090_result.stdout | trim,
        'comments':
          'Required: rekeylimit a data limit and a time limit (e.g. 1G 1h). Set it in /etc/ssh/sshd_config or an included .conf file, then restart sshd.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-255035 | V-257983
# RHEL 9 SSHD must accept public key authentication.
# CAT II (Medium) | CCI-000765, CCI-000766, CCI-000767, CCI-000768

# The formal role manages this setting only where openssh-server is installed,
# so on a host without it the rule had no result and rendered not_reviewed.
# Without openssh-server this is not applicable (RHEL-09-255010 reports the
# missing package). Otherwise both STIG conditions must hold: the effective
# value (sshd -T) is compliant, and the keyword is set, uncommented, in
# sshd_config or a file it Includes; the STIG makes a missing line a finding
# even where the sshd default would comply. Unverifiable is open.
# Not applicable when the SA demonstrates an approved alternate MFA method
# (rhel9_attest_alt_mfa_no_pki), per the STIG note.

- name: RHEL-09-255035 | check sshd pubkeyauthentication (effective and configured)
  shell: |
    rpm -q openssh-server &>/dev/null || { echo "NA: openssh-server not installed"; exit 0; }
    # sshd_config plus the files its Include lines name (relative to /etc/ssh)
    files=/etc/ssh/sshd_config
    while read -r pat; do
      case "$pat" in /*) ;; *) pat="/etc/ssh/$pat" ;; esac
      for f in $pat; do [ -f "$f" ] && files="$files $f"; done
    done < <(awk 'tolower($1) == "include" {for (i = 2; i <= NF; i++) print $i}' /etc/ssh/sshd_config 2>/dev/null)
    conf=$(grep -iHE '^[[:space:]]*pubkeyauthentication([[:space:]]|=)' $files 2>/dev/null)
    val_raw=$(sshd -T 2>/dev/null | awk '$1 == "pubkeyauthentication" {$1 = ""; sub(/^ /, ""); print; exit}')
    val=${val_raw,,}
    echo "EFFECTIVE (sshd -T): pubkeyauthentication ${val_raw:-(unavailable)}"
    echo "CONFIGURED: ${conf:-(not set in any sshd config file)}"
    if [ -z "$conf" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: pubkeyauthentication is not set in sshd_config or an included file"
    elif [ -n "$val" ] && [ "$val" = "yes" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: pubkeyauthentication must be yes"
    fi
  register: _255035_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-255035 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-255035': {
        'status':
          'not_applicable' if (_255035_result.stdout is search('^NA:', multiline=True) or (rhel9_attest_alt_mfa_no_pki | bool))
          else ('not_a_finding' if _255035_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open'),
        'finding_details':
          _255035_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_alt_mfa_no_pki): '
          ~ (rhel9_attest_alt_mfa_no_pki | bool | string | lower),
        'comments':
          'Required: pubkeyauthentication yes. Set it in /etc/ssh/sshd_config or an included .conf file, then restart sshd.'
      }
    }) }}"
  tags: [validate]

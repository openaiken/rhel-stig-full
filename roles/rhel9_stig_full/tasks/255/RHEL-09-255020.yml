---
# RHEL-09-255020 | V-257980
# RHEL 9 must have the openssh-clients package installed.
# CAT II (Medium) | CCI-000366

# Checked directly, as the STIG command does. (The DISA Ansible role's check
# mode only says whether one of its tasks would change something.)

- name: RHEL-09-255020 | check openssh-clients is installed
  shell: |
    if rpm -q --quiet openssh-clients; then state=installed; else state="not installed"; fi
    echo "openssh-clients: $state ($(rpm -q openssh-clients 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: openssh-clients must be installed"
    fi
  register: _255020_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-255020 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-255020': {
        'status':
          'not_a_finding' if _255020_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _255020_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install openssh-clients'
      }
    }) }}"
  tags: [validate]

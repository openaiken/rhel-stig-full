---
# RHEL-09-255110 | V-257998
# The RHEL 9 SSH server configuration file must be owned by root.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.
# Covers sshd_config, the sshd_config.d directory and every file in it, as
# the STIG command does.

- name: RHEL-09-255110 | check sshd config owner
  shell: |
    listing=$(find /etc/ssh/sshd_config /etc/ssh/sshd_config.d -exec stat -c '%U %n' {} \; 2>/dev/null)
    echo "owners:"; echo "${listing:-  (sshd_config not found)}"
    bad=$(echo "$listing" | awk '$1 != "root"')
    if [ -n "$listing" ] && [ -z "$bad" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: sshd_config, sshd_config.d and every file in it must have owner root"
    fi
  register: _255110_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-255110 | record status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-255110': {
        'status':
          'not_a_finding' if _255110_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _255110_result.stdout | trim,
        'comments':
          'sudo chown -R root /etc/ssh/sshd_config /etc/ssh/sshd_config.d'
      }
    }) }}"
  tags: [validate]

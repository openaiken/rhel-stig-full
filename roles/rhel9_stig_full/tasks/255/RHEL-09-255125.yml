---
# RHEL-09-255125 | V-258001
# RHEL 9 SSH public host key files must have mode 0644 or less permissive.
# CAT II (Medium) | CCI-000366

# "0644 or less permissive" means no permission bits outside owner rw plus
# group/other read. Tested with a bitmask rather than a numeric compare of the
# octal digit string, which would miss any mode whose owner digit is 0 -- 0020
# (group-writable) would score 20 and pass a 644 threshold.

- name: RHEL-09-255125 | check SSH public host key modes
  shell: |
    for f in /etc/ssh/*.pub; do
      [ -e "$f" ] || continue
      mode=$(stat -c '%a' "$f" 2>/dev/null) || continue
      if [ $(( 8#$mode & 8#133 )) -ne 0 ]; then
        echo "OVER_LIMIT: $mode $f"
      fi
    done
  register: _255125_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-255125 | collect all public key modes for context
  shell: stat -c "%a %n" /etc/ssh/*.pub 2>/dev/null || true
  register: _255125_all
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [validate]

- name: RHEL-09-255125 | record SSH public key mode status
  set_fact:
    stig_facts: "{{ stig_facts | combine({
      'RHEL-09-255125': {
        'status': 'not_a_finding' if not (_255125_result.stdout | trim) else 'open',
        'finding_details':
          'Public key modes (mode filename):\n'
          ~ (_255125_all.stdout | trim if _255125_all.stdout | trim else '(no public keys found)')
          ~ '\nKeys more permissive than 0644:\n'
          ~ (_255125_result.stdout | trim if _255125_result.stdout | trim else '(none)'),
        'comments': 'Set mode: sudo chmod 0644 /etc/ssh/*key.pub && sudo systemctl restart sshd'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-654205 | V-258215
# Successful/unsuccessful uses of the umount system call in RHEL 9 must
# generate an audit record.
# CAT II (Medium) | CCI-000130, CCI-000135, CCI-000172, CCI-002884

# umount (no trailing 2) is a 32-bit compat syscall on x86_64; only a b32
# rule is required. The 64-bit unmount path uses umount2 (see 654210).
# Required rule: -a always,exit -F arch=b32 -S umount -F auid>=1000
#                -F auid!=-1 -F key=privileged-umount

- name: RHEL-09-654205 | check audit rule for umount syscall (b32)
  shell: |
    if ! command -v auditctl &>/dev/null; then
      echo "STATUS: FAIL"
      echo "FAIL: auditctl not available - audit package may not be installed"
      exit 0
    fi

    rule=$(auditctl -l 2>/dev/null | grep 'arch=b32' | grep '\bumount\b' | grep -v 'umount2' || true)

    if [ -z "$rule" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: no b32 audit rule found for umount syscall"
    else
      missing=""
      echo "$rule" | grep -q '\-S umount'     || missing="${missing} -S umount"
      echo "$rule" | grep -q 'auid>=1000'     || missing="${missing} auid>=1000"
      echo "$rule" | grep -q 'auid!=-1'       || missing="${missing} auid!=-1"
      echo "$rule" | grep -q 'key=privileged-umount' || missing="${missing} key=privileged-umount"
      if [ -z "$missing" ]; then
        echo "STATUS: PASS"
        echo "PASS: $rule"
      else
        echo "STATUS: FAIL"
        echo "FAIL: rule found but missing fields:$missing"
        echo "RULE: $rule"
      fi
    fi
  register: _654205_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-654205 | record umount audit rule status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-654205': {
        'status':
          'not_a_finding' if _654205_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details': _654205_result.stdout | trim,
        'comments':
          'Add to /etc/audit/rules.d/privileged-umount.rules: '
          ~ '-a always,exit -F arch=b32 -S umount -F auid>=1000 -F auid!=-1 '
          ~ '-F key=privileged-umount. Run augenrules --load to apply.'
      }
    }) }}"
  tags: [validate]

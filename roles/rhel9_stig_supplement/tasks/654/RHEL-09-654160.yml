---
# RHEL-09-654160 | V-258206
# RHEL 9 must audit all uses of the unix_chkpwd command.
# CAT II (Medium) | CCI-000130, CCI-000135, CCI-000169, CCI-000172, CCI-002884

# Loaded rules (auditctl -l), as the STIG check reads them.
# Each expected rule below (from the STIG check text) must be covered by a
# rule that records at least the same events; keys, syscall order, merged
# syscall lists, -w watches and auid!=unset are all accepted. See
# filter_plugins/audit_rules.py. The formal role checked for its own lines in
# /etc/audit/rules.d/audit.rules, so hosts hardened any other way were open.

- name: RHEL-09-654160 | read audit rules
  command: auditctl -l
  register: _654160_rules
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-654160 | record audit rule coverage
  vars:
    _654160_expected:
      - "-a always,exit -S all -F path=/usr/sbin/unix_chkpwd -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-unix-update"
    _654160_cov: "{{ _654160_rules.stdout | default('') | rhel9_audit_coverage(_654160_expected) }}"
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-654160': {
        'status':
          'not_a_finding'
          if (_654160_rules.rc | default(1) == 0 and _654160_cov.loaded > 0 and _654160_cov.missing | length == 0)
          else 'open',
        'finding_details': _654160_cov.report,
        'comments':
          'Add rules covering each MISSING line to a file in /etc/audit/rules.d/, '
          ~ 'then run augenrules --load. Any key may be used.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-211055 | V-257786
# RHEL 9 debug-shell systemd service must be disabled.
# CAT II (Medium) | CCI-002235

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.
# The STIG makes a loaded unit that is not masked a finding; a unit that does
# not exist is not loaded.

- name: RHEL-09-211055 | check debug-shell.service is masked
  shell: |
    state=$(systemctl show debug-shell.service -p LoadState --value 2>/dev/null)
    active=$(systemctl is-active debug-shell.service 2>/dev/null)
    echo "debug-shell.service: LoadState=${state:-unknown} ActiveState=${active:-unknown}"
    if [ "$state" = "masked" ] || [ "$state" = "not-found" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: debug-shell.service is loaded and not masked"
    fi
  register: _211055_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-211055 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-211055': {
        'status':
          'not_a_finding' if _211055_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _211055_result.stdout | trim,
        'comments':
          'Mask it: sudo systemctl mask --now debug-shell.service'
      }
    }) }}"
  tags: [validate]

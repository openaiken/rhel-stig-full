---
# RHEL-09-211050 | V-257785
# The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9.
# CAT I (High) | CCI-002235

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.
# The STIG makes a loaded unit that is not masked a finding; a unit that does
# not exist is not loaded.

- name: RHEL-09-211050 | check ctrl-alt-del.target is masked
  shell: |
    state=$(systemctl show ctrl-alt-del.target -p LoadState --value 2>/dev/null)
    active=$(systemctl is-active ctrl-alt-del.target 2>/dev/null)
    echo "ctrl-alt-del.target: LoadState=${state:-unknown} ActiveState=${active:-unknown}"
    if [ "$state" = "masked" ] || [ "$state" = "not-found" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: ctrl-alt-del.target is loaded and not masked"
    fi
  register: _211050_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-211050 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-211050': {
        'status':
          'not_a_finding' if _211050_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _211050_result.stdout | trim,
        'comments':
          'Mask it: sudo systemctl mask --now ctrl-alt-del.target'
      }
    }) }}"
  tags: [validate]

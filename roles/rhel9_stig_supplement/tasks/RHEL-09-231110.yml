---
# RHEL-09-231110 | V-257863
# RHEL 9 must mount /dev/shm with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /dev/shm is mounted with the nodev option.
# An empty result means /dev/shm is not separately mounted, which is also a finding.

- name: RHEL-09-231110 | get /dev/shm mount options
  shell: awk '$2 == "/dev/shm" { print $4 }' /proc/mounts
  register: _231110_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-231110 | record /dev/shm nodev mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231110': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231110_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/dev/shm mount options: '
          ~ (_231110_result.stdout | default('') | trim
             if _231110_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /dev/shm'
             if ('nodev' in (_231110_result.stdout | default('')))
             else 'OPEN - nodev not found in /dev/shm mount options'),
        'comments': 'Add nodev to the /dev/shm entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

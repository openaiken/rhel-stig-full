---
# RHEL-09-252025 | V-257946
# RHEL 9 must disable the chrony daemon from acting as a server.
# CAT III (Low) | CCI-000381, CCI-000382

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.
# Not a finding on a host serving NTP; document it with the ISSO and use
# rhel9_attest_documented_exceptions.

- name: RHEL-09-252025 | check chrony port 0
  shell: |
    shopt -s nullglob
    files=(/etc/chrony.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="port" -v m="ws" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "port (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'port' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [ "$val" = "0" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: port must be 0"
    fi
  register: _252025_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-252025 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-252025': {
        'status':
          'not_a_finding' if _252025_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-252025')
          else 'open'),
        'finding_details':
          _252025_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-252025') or '(none)'),
        'comments':
          'Set port 0 in /etc/chrony.conf.'
      }
    }) }}"
  tags: [validate]

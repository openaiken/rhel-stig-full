---
# RHEL-09-252060 | V-257953
# RHEL 9 must forward mail from postmaster to the root account using a
# postfix alias.
# CAT II (Medium) | CCI-000139

# Compliant when /etc/aliases contains: postmaster: root. Otherwise the STIG
# asks how the SA and ISSO are notified of audit processing failures
# (rhel9_attest_audit_notification_compliant + _method). The STIG has no
# not-applicable clause: without postfix this used to report not_applicable,
# which hid the missing notification path.

- name: RHEL-09-252060 | check if postfix is installed
  shell: rpm -q postfix 2>/dev/null && echo installed || echo not_installed
  register: _252060_postfix
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-252060 | check postmaster alias
  shell: grep -E '^\s*postmaster:\s*root\s*$' /etc/aliases 2>/dev/null || true
  register: _252060_alias
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-252060 | collect current aliases for context
  shell: grep -i postmaster /etc/aliases 2>/dev/null || true
  register: _252060_current
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-252060 | record postmaster alias status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-252060': {
        'status':
          'not_a_finding' if (_252060_alias.stdout | default('') | trim)
          else ('not_a_finding' if rhel9_attest_audit_notification_compliant | bool
          else 'open'),
        'finding_details':
          'Postfix installed: ' ~ (_252060_postfix.stdout | trim)
          ~ '\npostmaster alias match (postmaster: root):\n'
          ~ (_252060_alias.stdout | default('') | trim
             if (_252060_alias.stdout | default('') | trim)
             else '(not found)')
          ~ '\nCurrent postmaster entries in /etc/aliases:\n'
          ~ (_252060_current.stdout | default('') | trim
             if (_252060_current.stdout | default('') | trim)
             else '(none)')
          ~ '\nAttestation (rhel9_attest_audit_notification_compliant): '
          ~ (rhel9_attest_audit_notification_compliant | bool | string | lower)
          ~ '\nSA documented notification method: '
          ~ (rhel9_attest_audit_notification_method if rhel9_attest_audit_notification_method else '(not provided)'),
        'comments':
          'Add to /etc/aliases: postmaster: root — then run: sudo newaliases. '
          ~ 'If an alternative audit failure notification mechanism is in place, '
          ~ 'set rhel9_attest_audit_notification_compliant: true and document '
          ~ 'the mechanism in rhel9_attest_audit_notification_method.'
      }
    }) }}"
  tags: [validate]

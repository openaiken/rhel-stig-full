---
# RHEL-09-271115 | V-258033
# RHEL 9 must disable the user list at logon for graphical user interfaces.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271115 | check disable-user-list (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.login-screen disable-user-list 2>&1)
    if [ "$val" = "true" ]; then echo "PASS: disable-user-list=$val"
    else echo "FAIL: disable-user-list=${val:-no output} (required: true)"
    fi
  register: _271115_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271115 | record disable-user-list status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271115': {
        'status':
          'not_applicable' if 'NA:' in _271115_result.stdout
          else ('not_a_finding' if _271115_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271115_result.stdout | trim,
        'comments':
          'Set disable-user-list=true in a dconf keyfile under /etc/dconf/db/local.d/ '
          ~ 'in the [org/gnome/login-screen] section. Run dconf update.'
      }
    }) }}"
  tags: [validate]

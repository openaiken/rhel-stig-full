---
# RHEL-09-271040 | V-258018
# RHEL 9 must not allow unattended or automatic logon via the graphical user
# interface.
# CAT I (High) | CCI-000366

# Not Applicable if GDM is not installed.
# Checks /etc/gdm/custom.conf for AutomaticLoginEnable=false.

- name: RHEL-09-271040 | check GDM automatic login setting
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    # GDM reads custom.conf as an ini file: only the [daemon] section counts,
    # comments do not, and the last occurrence of a key wins. A plain grep
    # passed a commented-out AutomaticLoginEnable=false.
    val=$(awk -F= '
      /^[[:space:]]*\[/ { sec=$0; gsub(/[][[:space:]]/, "", sec); next }
      sec == "daemon" && $1 ~ /^[[:space:]]*AutomaticLoginEnable[[:space:]]*$/ {
        v=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", v) }
      END { print v }' /etc/gdm/custom.conf 2>/dev/null)
    if [ "${val,,}" = "false" ]; then
      echo "PASS: [daemon] AutomaticLoginEnable=$val"
    else
      echo "FAIL: [daemon] AutomaticLoginEnable=${val:-not set} (required: false)"
    fi
    grep -in 'automaticlogin' /etc/gdm/custom.conf 2>/dev/null | sed 's/^/RAW: /'
  register: _271040_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271040 | record automatic login status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271040': {
        'status':
          'not_applicable' if 'NA:' in _271040_result.stdout
          else ('not_a_finding' if 'PASS:' in _271040_result.stdout
          else 'open'),
        'finding_details': _271040_result.stdout | trim,
        'comments':
          'Set AutomaticLoginEnable=false in the [daemon] section of '
          ~ '/etc/gdm/custom.conf.'
      }
    }) }}"
  tags: [validate]

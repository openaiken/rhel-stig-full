---
# RHEL-09-271090 | V-258028
# RHEL 9 effective dconf policy must match the policy keyfiles.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.
# A database is stale if its mtime is older than any of its keyfiles —
# meaning dconf update has not been run since the keyfiles were modified.

- name: RHEL-09-271090 | check dconf database freshness
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    stale=""
    for db in $(find /etc/dconf/db -maxdepth 1 -type f 2>/dev/null); do
      db_mtime=$(stat -c %Y "$db" 2>/dev/null)
      keyfile_mtime=$(stat -c %Y "${db}.d"/* 2>/dev/null | sort -n | tail -1)
      if [ -n "$db_mtime" ] && [ -n "$keyfile_mtime" ] && \
         [ "$db_mtime" -lt "$keyfile_mtime" ]; then
        stale="${stale}${db} needs update\n"
      fi
    done
    if [ -z "$stale" ]; then echo "PASS: all databases are current"
    else printf "FAIL:\n${stale}"
    fi
  register: _271090_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271090 | record dconf database freshness status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271090': {
        'status':
          'not_applicable' if 'NA:' in _271090_result.stdout
          else ('not_a_finding' if 'PASS:' in _271090_result.stdout
          else 'open'),
        'finding_details': _271090_result.stdout | trim,
        'comments': 'Run: sudo dconf update — to recompile all dconf databases.'
      }
    }) }}"
  tags: [validate]

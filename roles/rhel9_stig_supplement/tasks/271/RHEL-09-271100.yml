---
# RHEL-09-271100 | V-258030
# RHEL 9 must prevent a user from overriding the disable-restart-buttons
# setting for the graphical user interface.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.

- name: RHEL-09-271100 | check disable-restart-buttons is locked in dconf
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    result=$(grep -r '/login-screen/disable-restart-buttons' \
             /etc/dconf/db/local.d/locks/ 2>/dev/null | head -1)
    if [ -n "$result" ]; then echo "LOCKED: $result"
    else echo "NOT_LOCKED"
    fi
  register: _271100_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271100 | record disable-restart-buttons lock status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271100': {
        'status':
          'not_applicable' if 'NA:' in _271100_result.stdout
          else ('not_a_finding' if 'LOCKED:' in _271100_result.stdout
          else 'open'),
        'finding_details': _271100_result.stdout | trim,
        'comments':
          'Add /org/gnome/login-screen/disable-restart-buttons to a lock file '
          ~ 'under /etc/dconf/db/local.d/locks/. Run dconf update.'
      }
    }) }}"
  tags: [validate]

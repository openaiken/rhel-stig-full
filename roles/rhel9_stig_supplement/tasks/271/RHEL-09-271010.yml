---
# RHEL-09-271010 | V-258012
# RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner
# before granting local or remote access via a graphical user logon.
# CAT II (Medium) | CCI-000048

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271010 | check banner-message-enable (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.login-screen banner-message-enable 2>&1)
    if [ "$val" = "true" ]; then echo "PASS: banner-message-enable=$val"
    else echo "FAIL: banner-message-enable=${val:-no output} (required: true)"
    fi
  register: _271010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271010 | record GDM banner-enabled status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271010': {
        'status':
          'not_applicable' if _271010_result.stdout is search('^NA:', multiline=True)
          else ('not_a_finding' if _271010_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271010_result.stdout | trim,
        'comments':
          'Set banner-message-enable=true in a dconf keyfile under '
          ~ '/etc/dconf/db/local.d/ in the [org/gnome/login-screen] section. '
          ~ 'Run dconf update afterward.'
      }
    }) }}"
  tags: [validate]

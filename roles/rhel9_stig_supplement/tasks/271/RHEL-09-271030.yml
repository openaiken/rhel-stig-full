---
# RHEL-09-271030 | V-258016
# RHEL 9 must disable the graphical user interface autorun function unless
# required.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271030 | check autorun-never (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.desktop.media-handling autorun-never 2>&1)
    if [ "$val" = "true" ]; then echo "PASS: autorun-never=$val"
    else echo "FAIL: autorun-never=${val:-no output} (required: true)"
    fi
  register: _271030_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271030 | record autorun-never status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271030': {
        'status':
          'not_applicable' if 'NA:' in _271030_result.stdout
          else ('not_a_finding' if _271030_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271030_result.stdout | trim,
        'comments':
          'Set autorun-never=true in a dconf keyfile under /etc/dconf/db/local.d/ '
          ~ 'in the [org/gnome/desktop/media-handling] section. Run dconf update.'
      }
    }) }}"
  tags: [validate]

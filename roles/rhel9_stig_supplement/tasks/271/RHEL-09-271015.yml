---
# RHEL-09-271015 | V-258013
# RHEL 9 must prevent a user from overriding the banner-message-enable setting
# for the graphical user interface.
# CAT II (Medium) | CCI-000048

# Not Applicable if GDM is not installed.
# Compliant when /org/gnome/login-screen/banner-message-enable appears in a
# dconf lock file under /etc/dconf/db/local.d/locks/.

- name: RHEL-09-271015 | check banner-message-enable is locked in dconf
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    result=$(grep -r '/login-screen/banner-message-enable' \
             /etc/dconf/db/local.d/locks/ 2>/dev/null | head -1)
    if [ -n "$result" ]; then echo "LOCKED: $result"
    else echo "NOT_LOCKED"
    fi
  register: _271015_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271015 | record banner-message-enable lock status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271015': {
        'status':
          'not_applicable' if 'NA:' in _271015_result.stdout
          else ('not_a_finding' if 'LOCKED:' in _271015_result.stdout
          else 'open'),
        'finding_details': _271015_result.stdout | trim,
        'comments':
          'Add /org/gnome/login-screen/banner-message-enable to a lock file '
          ~ 'under /etc/dconf/db/local.d/locks/. Run dconf update afterward.'
      }
    }) }}"
  tags: [validate]

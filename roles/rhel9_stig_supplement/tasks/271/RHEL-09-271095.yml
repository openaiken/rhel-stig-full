---
# RHEL-09-271095 | V-258029
# RHEL 9 must disable the ability of a user to restart the system from the
# login screen.
# CAT II (Medium) | CCI-000366

# Not Applicable if GDM is not installed.
# Compliant when disable-restart-buttons=true in dconf keyfiles.

- name: RHEL-09-271095 | check disable-restart-buttons in dconf keyfiles
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(grep -rh '^disable-restart-buttons=' /etc/dconf/db/local.d/ 2>/dev/null \
          | grep -v '/locks/' | head -1 | cut -d= -f2- | xargs)
    echo "${val:-NOTSET}"
  register: _271095_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271095 | record disable-restart-buttons status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271095': {
        'status':
          'not_applicable' if 'NA:' in _271095_result.stdout
          else ('not_a_finding' if _271095_result.stdout | trim == 'true'
          else 'open'),
        'finding_details': _271095_result.stdout | trim,
        'comments':
          'Set disable-restart-buttons=true in a dconf keyfile under '
          ~ '/etc/dconf/db/local.d/ in the [org/gnome/login-screen] section. '
          ~ 'Run dconf update.'
      }
    }) }}"
  tags: [validate]

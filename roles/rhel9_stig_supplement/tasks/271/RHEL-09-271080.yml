---
# RHEL-09-271080 | V-258202
# RHEL 9 must prevent a user from overriding the session lock-delay setting
# for the graphical user interface.
# CAT II (Medium) | CCI-000057

# Not Applicable if GDM is not installed.

- name: RHEL-09-271080 | check screensaver lock-delay is locked in dconf
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    result=$(grep -r '/screensaver/lock-delay' \
             /etc/dconf/db/local.d/locks/ 2>/dev/null | head -1)
    if [ -n "$result" ]; then echo "LOCKED: $result"
    else echo "NOT_LOCKED"
    fi
  register: _271080_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271080 | record screensaver lock-delay lock status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271080': {
        'status':
          'not_applicable' if 'NA:' in _271080_result.stdout
          else ('not_a_finding' if 'LOCKED:' in _271080_result.stdout
          else 'open'),
        'finding_details': _271080_result.stdout | trim,
        'comments':
          'Add /org/gnome/desktop/screensaver/lock-delay to a lock file '
          ~ 'under /etc/dconf/db/local.d/locks/. Run dconf update.'
      }
    }) }}"
  tags: [validate]

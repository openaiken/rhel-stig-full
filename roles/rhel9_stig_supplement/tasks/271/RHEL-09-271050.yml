---
# RHEL-09-271050 | V-258196
# RHEL 9 must prevent a user from overriding the graphical user smart card
# removal action.
# CAT II (Medium) | CCI-000056

# Not Applicable if GDM is not installed.

- name: RHEL-09-271050 | check smartcard removal-action is locked in dconf
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    result=$(grep -r '/smartcard/removal-action' \
             /etc/dconf/db/local.d/locks/ 2>/dev/null | head -1)
    if [ -n "$result" ]; then echo "LOCKED: $result"
    else echo "NOT_LOCKED"
    fi
  register: _271050_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271050 | record smartcard removal-action lock status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271050': {
        'status':
          'not_applicable' if 'NA:' in _271050_result.stdout
          else ('not_a_finding' if 'LOCKED:' in _271050_result.stdout
          else 'open'),
        'finding_details': _271050_result.stdout | trim,
        'comments':
          'Add /org/gnome/settings-daemon/peripherals/smartcard/removal-action '
          ~ 'to a lock file under /etc/dconf/db/local.d/locks/. Run dconf update.'
      }
    }) }}"
  tags: [validate]

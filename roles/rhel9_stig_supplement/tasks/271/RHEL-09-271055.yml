---
# RHEL-09-271055 | V-258021
# RHEL 9 must enable a user session lock until that user re-establishes
# access using established identification and authentication procedures for
# graphical user sessions.
# CAT II (Medium) | CCI-000056

# Not Applicable if GDM is not installed.
# Queries the effective setting the way the STIG check does (gsettings),
# through the user dconf profile, rather than grepping keyfiles. A keyfile grep
# cannot see GNOME defaults, which of several keyfiles wins, whether dconf
# update has compiled them, or whether a lock line is commented out.
# XDG_CONFIG_HOME points at nothing so the root user db cannot mask a value.
# An empty or error result is a finding: an unverifiable control is open.

- name: RHEL-09-271055 | check screensaver lock-enabled (effective value)
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(XDG_CONFIG_HOME=/nonexistent DCONF_PROFILE=user gsettings get org.gnome.desktop.screensaver lock-enabled 2>&1)
    if [ "$val" = "true" ]; then echo "PASS: lock-enabled=$val"
    else echo "FAIL: lock-enabled=${val:-no output} (required: true)"
    fi
  register: _271055_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-271055 | record screensaver lock-enabled status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271055': {
        'status':
          'not_applicable' if 'NA:' in _271055_result.stdout
          else ('not_a_finding' if _271055_result.stdout is search('^PASS:', multiline=True)
          else 'open'),
        'finding_details': _271055_result.stdout | trim,
        'comments':
          'Set lock-enabled=true in a dconf keyfile under /etc/dconf/db/local.d/ '
          ~ 'in the [org/gnome/desktop/screensaver] section. Run dconf update.'
      }
    }) }}"
  tags: [validate]

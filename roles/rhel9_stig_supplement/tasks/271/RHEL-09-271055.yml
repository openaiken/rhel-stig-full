---
# RHEL-09-271055 | V-258021
# RHEL 9 must enable a user session lock until that user re-establishes
# access using established identification and authentication procedures for
# graphical user sessions.
# CAT II (Medium) | CCI-000056

# Not Applicable if GDM is not installed.
# Compliant when lock-enabled=true in dconf keyfiles (screensaver schema).

- name: RHEL-09-271055 | check screensaver lock-enabled in dconf keyfiles
  shell: |
    rpm -q gdm &>/dev/null || { echo "NA: gdm not installed"; exit 0; }
    val=$(grep -rh '^lock-enabled=' /etc/dconf/db/local.d/ 2>/dev/null \
          | grep -v '/locks/' | head -1 | cut -d= -f2- | xargs)
    echo "${val:-NOTSET}"
  register: _271055_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-271055 | record screensaver lock-enabled status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-271055': {
        'status':
          'not_applicable' if 'NA:' in _271055_result.stdout
          else ('not_a_finding' if _271055_result.stdout | trim == 'true'
          else 'open'),
        'finding_details': _271055_result.stdout | trim,
        'comments':
          'Set lock-enabled=true in a dconf keyfile under /etc/dconf/db/local.d/ '
          ~ 'in the [org/gnome/desktop/screensaver] section. Run dconf update.'
      }
    }) }}"
  tags: [validate]

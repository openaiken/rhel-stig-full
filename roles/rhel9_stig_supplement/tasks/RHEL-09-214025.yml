---
# RHEL-09-214025 | V-257822
# RHEL 9 must have GPG signature verification enabled for all software repositories.
# CAT I (High) | CCI-001749
#
# All .repo files in /etc/yum.repos.d/ must have gpgcheck=1.
# Two conditions checked: repos with gpgcheck set to something other than 1,
# and repo files that have no gpgcheck line at all.

- name: RHEL-09-214025 | check for repos with gpgcheck not equal to 1
  shell: grep -rh gpgcheck /etc/yum.repos.d/ 2>/dev/null | grep -Ev 'gpgcheck\s*=\s*1' || true
  register: _214025_bad_gpgcheck
  changed_when: false
  tags: [validate]

- name: RHEL-09-214025 | check for repo files missing gpgcheck entirely
  shell: grep -rL gpgcheck /etc/yum.repos.d/ 2>/dev/null || true
  register: _214025_missing_gpgcheck
  changed_when: false
  tags: [validate]

- name: RHEL-09-214025 | record GPG repo check status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-214025': {
        'status':
          'not_a_finding'
          if (not (_214025_bad_gpgcheck.stdout | trim)
              and not (_214025_missing_gpgcheck.stdout | trim))
          else 'open',
        'finding_details':
          'Repos with gpgcheck != 1: '
          ~ (_214025_bad_gpgcheck.stdout | trim if _214025_bad_gpgcheck.stdout | trim else '(none)')
          ~ '\nRepo files missing gpgcheck: '
          ~ (_214025_missing_gpgcheck.stdout | trim if _214025_missing_gpgcheck.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - all repos have gpgcheck=1'
             if (not (_214025_bad_gpgcheck.stdout | trim)
                 and not (_214025_missing_gpgcheck.stdout | trim))
             else 'OPEN - one or more repos missing or disabling gpgcheck'),
        'comments':
          'To remediate: sudo sed -i s/gpgcheck\s*=.*/gpgcheck=1/g /etc/yum.repos.d/*'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-432020 | V-258085
# RHEL 9 must use the invoking user's password for privilege escalation when
# using "sudo".
# CAT II (Medium) | CCI-002227

# Requires all three Defaults lines: !targetpw, !rootpw, !runaspw.
# All three must appear in a single file — if they are spread across multiple
# files (e.g. /etc/sudoers and a drop-in) that is also a finding per the STIG.
# These Defaults apply to local sudo policy regardless of whether user/group
# rules are managed via IdM/SSSD.

# NOTE: grep -n prefixes every output line with "file:lineno:", so a comment
# filter must anchor past that prefix. A bare '^\s*#' never matches and lets
# commented-out lines through as findings.
- name: RHEL-09-432020 | check sudo Defaults for invoking-user password requirement
  shell: |
    findings=""

    for token in '!targetpw' '!rootpw' '!runaspw'; do
      matches=$(grep -irn "Defaults.*${token}" /etc/sudoers /etc/sudoers.d/ 2>/dev/null \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#')
      count=$(echo "$matches" | grep -c '.' || true)
      files=$(echo "$matches" | awk -F: '{print $1}' | sort -u | tr '\n' ' ')

      if [ "$count" -eq 0 ]; then
        findings="${findings}FAIL: $token not found in any sudoers file\n"
      elif [ "$(echo "$files" | wc -w)" -gt 1 ]; then
        findings="${findings}FAIL: $token defined in multiple files (${files}) -- must be in one file only\n"
      else
        findings="${findings}PASS: $token found in $(echo "$files" | xargs)\n"
      fi
    done

    if echo -e "$findings" | grep -q '^FAIL:'; then
      echo "STATUS: FAIL"
    else
      echo "STATUS: PASS"
    fi
    echo -e "$findings" | sed '/^$/d'
  register: _432020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-432020 | record sudo invoking-user password status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-432020': {
        'status': 'not_a_finding' if _432020_result.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _432020_result.stdout | trim,
        'comments':
          'Add to /etc/sudoers (single location): '
          ~ 'Defaults !targetpw / Defaults !rootpw / Defaults !runaspw'
      }
    }) }}"
  tags: [validate]

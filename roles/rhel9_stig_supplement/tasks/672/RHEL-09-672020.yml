---
# RHEL-09-672020 | V-258236
# RHEL 9 cryptographic policy must not be overridden.
# CAT I (High) | CCI-002450

# Two-part check:
# 1. update-crypto-policies --check: generated policy must match configured.
#    A mismatch means per-application overrides or manual edits are in effect.
# 2. All backend symlinks in /etc/crypto-policies/back-ends/ must point into
#    /usr/share/crypto-policies/FIPS/. nss.config is a regular file by design
#    and is excluded from the symlink check.
#
# The STIG allows AO-approved subpolicy exceptions documented with the ISSO,
# but still classifies them as findings requiring formal exception paperwork.
# Set rhel9_attest_crypto_subpolicy_approved: true only after obtaining that
# documentation; it converts this to not_a_finding for the backend check only.
# A policy mismatch from update-crypto-policies --check is always open.

- name: RHEL-09-672020 | check crypto policy is not overridden
  shell: |
    if ! command -v update-crypto-policies &>/dev/null; then
      echo "STATUS: FAIL"
      echo "FAIL: update-crypto-policies not available"
      exit 0
    fi

    findings=""

    # Part 1: configured vs generated policy must match
    policy_check=$(update-crypto-policies --check 2>&1)
    if echo "$policy_check" | grep -qi 'does not match\|does NOT match'; then
      findings="${findings}FAIL: policy mismatch: $policy_check\n"
    else
      findings="${findings}PASS: $policy_check\n"
    fi

    # Part 2: backend symlinks must target FIPS policy files
    backend_dir=/etc/crypto-policies/back-ends
    while IFS= read -r link; do
      name=$(basename "$link")
      [ "$name" = "nss.config" ] && continue
      target=$(readlink "$link")
      if echo "$target" | grep -qE '(/FIPS/|/usr/share/crypto-policies/FIPS)'; then
        findings="${findings}PASS: $name -> $target\n"
      else
        findings="${findings}FAIL: $name -> $target (not pointing to FIPS policy)\n"
      fi
    done < <(find "$backend_dir" -maxdepth 1 -type l 2>/dev/null | sort)

    # nss.config must be a regular file, not a symlink
    if [ -L "${backend_dir}/nss.config" ]; then
      findings="${findings}FAIL: nss.config is a symlink (must be a regular file)\n"
    else
      findings="${findings}INFO: nss.config is a regular file (expected)\n"
    fi

    if echo -e "$findings" | grep -q '^FAIL:'; then
      echo "STATUS: FAIL"
    else
      echo "STATUS: PASS"
    fi
    echo -e "$findings" | sed '/^$/d'
  register: _672020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-672020 | record crypto policy override status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-672020': {
        'status':
          'not_a_finding' if 'STATUS: PASS' in _672020_result.stdout
          else ('not_a_finding'
                if ((rhel9_attest_crypto_subpolicy_approved | default(false) | bool)
                    and 'FAIL: policy mismatch' not in _672020_result.stdout)
          else 'open'),
        'finding_details':
          _672020_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_crypto_subpolicy_approved): '
          ~ (rhel9_attest_crypto_subpolicy_approved | default(false) | bool | string | lower),
        'comments':
          'Remove per-application crypto overrides and run: '
          ~ 'update-crypto-policies --set FIPS. '
          ~ 'AO-approved subpolicy exceptions require documented ISSO approval. '
          ~ 'Verify backends: ls -l /etc/crypto-policies/back-ends/'
      }
    }) }}"
  tags: [validate]

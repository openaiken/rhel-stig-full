---
# RHEL-09-672050 | V-258242
# RHEL 9 must implement DOD-approved encryption in the bind package.
# CAT I (High) | CCI-002450

# Not applicable if bind is not installed.
# Checks that /etc/named.conf contains the crypto policy include directive.
# Without this, BIND uses its own algorithm defaults rather than the
# system-wide FIPS crypto policy.

- name: RHEL-09-672050 | check BIND uses system crypto policy
  shell: |
    if ! rpm -q bind &>/dev/null; then
      echo "NA: bind not installed"
      exit 0
    fi

    named_conf=/etc/named.conf
    if [ ! -f "$named_conf" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: $named_conf not found (bind installed but config missing)"
      exit 0
    fi

    target='include "/etc/crypto-policies/back-ends/bind.config"'

    # Anchored to the start of the line: a substring match passed a
    # commented-out (// or #) include, which the STIG calls a finding.
    found=$(grep -E '^[[:space:]]*include[[:space:]]+"/etc/crypto-policies/back-ends/bind\.config"' "$named_conf" 2>/dev/null)
    if [ -n "$found" ]; then
      echo "STATUS: PASS"
      echo "PASS: crypto policy include found in $named_conf"
      echo "$found"
    else
      echo "STATUS: FAIL"
      echo "FAIL: $named_conf does not contain:"
      echo "  $target"
    fi
  register: _672050_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-672050 | record BIND crypto policy status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-672050': {
        'status':
          'not_applicable' if _672050_result.stdout is search('^NA:')
          else ('not_a_finding' if _672050_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open'),
        'finding_details': _672050_result.stdout | trim,
        'comments':
          'Add to /etc/named.conf: '
          ~ 'include /etc/crypto-policies/back-ends/bind.config; '
          ~ 'Restart named after the change. '
          ~ 'Ensure system crypto policy is FIPS: update-crypto-policies --set FIPS'
      }
    }) }}"
  tags: [validate]

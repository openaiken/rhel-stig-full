---
# RHEL-09-251035 | V-257940
# RHEL 9 must be configured to prohibit or restrict the use of functions,
# ports, protocols, and/or services, as defined in the PPSM CAL and
# vulnerability assessments.
# CAT II (Medium) | CCI-000382

# Compliance with the PPSM CAL requires comparing configured firewall rules
# against the organization's approved list, which cannot be automated.
# This task collects the current firewall configuration for manual review.

- name: RHEL-09-251035 | collect active firewall services and ports
  shell: |
    firewall-cmd --info-zone=$(firewall-cmd --get-default-zone) 2>/dev/null || true
  register: _251035_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-251035 | record PPSM compliance status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-251035': {
        'status':
          'not_a_finding' if rhel9_attest_ppsm_compliant | bool
          else 'not_reviewed',
        'finding_details':
          'Attestation (rhel9_attest_ppsm_compliant): '
          ~ (rhel9_attest_ppsm_compliant | bool | string | lower)
          ~ '\nActive firewall configuration (default zone):\n'
          ~ (_251035_result.stdout | trim if _251035_result.stdout | trim else '(firewalld not running or no output)'),
        'comments':
          'Set rhel9_attest_ppsm_compliant: true in stig_attestation.yml after '
          ~ 'comparing the listed services and ports against the organizationally '
          ~ 'defined PPSM CAL. Remove or block any entries not approved for this system.'
      }
    }) }}"
  tags: [validate]

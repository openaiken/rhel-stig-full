---
# RHEL-09-232145 | V-257909
# RHEL 9 /etc/passwd- file must be group-owned by root.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-232145 | check /etc/passwd- group owner
  shell: |
    val=$(stat -c '%G' /etc/passwd- 2>/dev/null)
    echo "/etc/passwd- group owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/passwd- must exist with group owner root"
    fi
  register: _232145_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232145 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232145': {
        'status':
          'not_a_finding' if _232145_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232145_result.stdout | trim,
        'comments':
          'sudo chgrp root /etc/passwd-'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-232220 | V-257924
# RHEL 9 audit tools must be owned by root.
# CAT II (Medium) | CCI-001493, CCI-001494

- name: RHEL-09-232220 | find audit tools not owned by root
  shell: >
    find /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace
    /sbin/auditd /sbin/rsyslogd /sbin/augenrules
    -maxdepth 0 ! -user root 2>/dev/null || true
  register: _232220_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232220 | record audit tools ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232220': {
        'status': 'not_a_finding' if not (_232220_result.stdout | trim) else 'open',
        'finding_details':
          'Audit tools not owned by root:\n'
          ~ (_232220_result.stdout | trim if _232220_result.stdout | trim else '(none)'),
        'comments': 'Run chown root <tool> for each listed file.'
      }
    }) }}"
  tags: [validate]

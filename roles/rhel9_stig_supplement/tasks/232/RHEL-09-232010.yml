---
# RHEL-09-232010 | V-257882
# RHEL 9 system commands must have mode 755 or less permissive.
# CAT II (Medium) | CCI-001494

- name: RHEL-09-232010 | find system commands with mode more permissive than 755
  shell: >
    find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
    -xdev -type f -perm /022 2>/dev/null || true
  register: _232010_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-232010 | record system commands mode status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232010': {
        'status': 'not_a_finding' if not (_232010_result.stdout | trim) else 'open',
        'finding_details':
          'System command files with mode > 755:\n'
          ~ (_232010_result.stdout | trim if _232010_result.stdout | trim else '(none)'),
        'comments': 'Run chmod 755 <file> for each listed file.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-232104 | V-270176
# RHEL 9 "/etc/audit/" must be group-owned by root.
# CAT II (Medium) | CCI-001314

- name: RHEL-09-232104 | get /etc/audit/ group owner
  shell: stat -c "%G" /etc/audit
  register: _232104_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-232104 | record /etc/audit/ group ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232104': {
        'status': 'not_a_finding' if (_232104_result.stdout | trim) == 'root' else 'open',
        'finding_details': '/etc/audit/ group owner: ' ~ (_232104_result.stdout | trim),
        'comments': 'Run: chgrp root /etc/audit'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-232205 | V-257921
# RHEL 9 library files must be group-owned by root or a system account.
# CAT II (Medium) | CCI-001494

- name: RHEL-09-232205 | find library files group-owned by non-system accounts
  shell: >
    find -L /lib /lib64 /usr/lib /usr/lib64
    -xdev -type f ! -group root
    -exec stat -c '%n %G %g' {} \; 2>/dev/null |
    awk '$3 >= 1000 {print $1, "(group:", $2, "GID:", $3 ")"}' || true
  register: _232205_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232205 | record library files group ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232205': {
        'status': 'not_a_finding' if not (_232205_result.stdout | trim) else 'open',
        'finding_details':
          'Library files group-owned by non-system accounts (GID >= 1000):\n'
          ~ (_232205_result.stdout | trim if _232205_result.stdout | trim else '(none)'),
        'comments':
          'Run chgrp root <file> for each listed file, or verify the group is '
          ~ 'a documented system account (GID < 1000).'
      }
    }) }}"
  tags: [validate]

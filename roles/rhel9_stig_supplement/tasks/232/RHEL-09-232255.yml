---
# RHEL-09-232255 | V-257931
# All RHEL 9 local files and directories must have a valid owner.
# CAT II (Medium) | CCI-000366

- name: RHEL-09-232255 | find files and directories with no valid owner
  shell: find / -xdev -nouser 2>/dev/null | head -40 || true
  register: _232255_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232255 | record invalid owner status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232255': {
        'status': 'not_a_finding' if not (_232255_result.stdout | trim) else 'open',
        'finding_details':
          'Files/directories with no valid owner:\n'
          ~ (_232255_result.stdout | trim if _232255_result.stdout | trim else '(none)'),
        'comments':
          'Either assign a valid owner (chown root <path>) or remove the orphaned '
          ~ 'files. Output truncated at 40 lines; re-run find / -xdev -nouser for full list.'
      }
    }) }}"
  tags: [validate]

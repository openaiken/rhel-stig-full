---
# RHEL-09-232095 | V-257899
# RHEL 9 /etc/group file must be group-owned by root.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-232095 | check /etc/group group owner
  shell: |
    val=$(stat -c '%G' /etc/group 2>/dev/null)
    echo "/etc/group group owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/group must exist with group owner root"
    fi
  register: _232095_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232095 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232095': {
        'status':
          'not_a_finding' if _232095_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232095_result.stdout | trim,
        'comments':
          'sudo chgrp root /etc/group'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-232200 | V-257920
# RHEL 9 library files must be owned by root.
# CAT II (Medium) | CCI-001494

- name: RHEL-09-232200 | find library files not owned by root
  shell: >
    find -L /lib /lib64 /usr/lib /usr/lib64
    -xdev -type f ! -user root 2>/dev/null || true
  register: _232200_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232200 | record library files ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232200': {
        'status': 'not_a_finding' if not (_232200_result.stdout | trim) else 'open',
        'finding_details':
          'Library files not owned by root:\n'
          ~ (_232200_result.stdout | trim if _232200_result.stdout | trim else '(none)'),
        'comments': 'Run chown root <file> for each listed file.'
      }
    }) }}"
  tags: [validate]

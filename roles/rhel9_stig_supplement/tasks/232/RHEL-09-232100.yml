---
# RHEL-09-232100 | V-257900
# RHEL 9 /etc/group- file must be owned by root.
# CAT II (Medium) | CCI-000366

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-232100 | check /etc/group- owner
  shell: |
    val=$(stat -c '%U' /etc/group- 2>/dev/null)
    echo "/etc/group- owner: ${val:-(file not found)}"
    if [ "$val" = "root" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /etc/group- must exist with owner root"
    fi
  register: _232100_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232100 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232100': {
        'status':
          'not_a_finding' if _232100_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232100_result.stdout | trim,
        'comments':
          'sudo chown root /etc/group-'
      }
    }) }}"
  tags: [validate]

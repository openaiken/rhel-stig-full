---
# RHEL-09-232210 | V-257922
# RHEL 9 library directories must be owned by root.
# CAT II (Medium) | CCI-001494

- name: RHEL-09-232210 | find library directories not owned by root
  shell: >
    find -L /lib /lib64 /usr/lib /usr/lib64
    -xdev -type d ! -user root 2>/dev/null || true
  register: _232210_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-232210 | record library directory ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232210': {
        'status': 'not_a_finding' if not (_232210_result.stdout | trim) else 'open',
        'finding_details':
          'Library directories not owned by root:\n'
          ~ (_232210_result.stdout | trim if _232210_result.stdout | trim else '(none)'),
        'comments': 'Run chown root <dir> for each listed directory.'
      }
    }) }}"
  tags: [validate]

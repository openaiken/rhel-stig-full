---
# RHEL-09-232025 | V-257885
# RHEL 9 /var/log directory must have mode 0755 or less permissive.
# CAT II (Medium) | CCI-001314

# The STIG allows the stated mode or anything less permissive. The formal
# role sets that exact mode, so in check mode a host with a stricter mode
# (e.g. 0600 where 0640 is the maximum) was reported open while compliant.
# Checked with a bitmask of the forbidden bits; a missing file is open.

- name: RHEL-09-232025 | check /var/log mode
  shell: |
    mode=$(stat -c '%a' /var/log 2>/dev/null)
    echo "/var/log mode: ${mode:-(file not found)} (maximum 0755)"
    if [ -n "$mode" ] && [ $(( 8#$mode & 8#7022 )) -eq 0 ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: /var/log is missing or more permissive than 0755"
    fi
  register: _232025_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232025 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232025': {
        'status':
          'not_a_finding' if _232025_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _232025_result.stdout | trim,
        'comments':
          'Set the mode: sudo chmod 0755 /var/log (or stricter).'
      }
    }) }}"
  tags: [validate]

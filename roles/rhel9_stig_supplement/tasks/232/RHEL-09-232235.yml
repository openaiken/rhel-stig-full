---
# RHEL-09-232235 | V-257927
# RHEL 9 cron configuration files directory must be group-owned by root.
# CAT II (Medium) | CCI-000366

- name: RHEL-09-232235 | find cron config paths not group-owned by root
  shell: >-
    find /etc/cron* -maxdepth 0 ! -group root 2>/dev/null || true
  register: _232235_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-232235 | record cron config group ownership status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-232235': {
        'status': 'not_a_finding' if not (_232235_result.stdout | trim) else 'open',
        'finding_details':
          'Cron config paths not group-owned by root:\n'
          ~ (_232235_result.stdout | trim if _232235_result.stdout | trim else '(none)'),
        'comments': 'Run chgrp root <path> for each listed path.'
      }
    }) }}"
  tags: [validate]

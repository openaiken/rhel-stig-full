---
# RHEL-09-231170 | V-257875
# RHEL 9 must mount /var/log/audit with the nosuid option.
# CAT II (Medium) | CCI-001764

# Checks that /var/log/audit is mounted with the nosuid option.
# An empty result means /var/log/audit is not separately mounted, which is also a finding.

- name: RHEL-09-231170 | get /var/log/audit mount options
  shell: awk '$2 == "/var/log/audit" { print $4 }' /proc/mounts
  register: _231170_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-231170 | record /var/log/audit nosuid mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231170': {
        'status':
          'not_a_finding'
          if ('nosuid' in (_231170_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/log/audit mount options: '
          ~ (_231170_result.stdout | default('') | trim
             if _231170_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nosuid is set on /var/log/audit'
             if ('nosuid' in (_231170_result.stdout | default('')))
             else 'OPEN - nosuid not found in /var/log/audit mount options'),
        'comments': 'Add nosuid to the /var/log/audit entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

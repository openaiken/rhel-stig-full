---
# RHEL-09-215060 | V-257835
# The TFTP server must not be installed unless required; if installed, must run in secure mode.
# CAT I (High) | CCI-000381
#
# Not applicable if tftp-server is not installed.
# If installed, ExecStart in the service file or drop-in must include the -s flag.

- name: RHEL-09-215060 | check if tftp-server is installed
  command: rpm -q tftp-server
  register: _215060_installed
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215060 | check for -s flag in tftp ExecStart
  shell: grep -ri execstart /usr/lib/systemd/system/tftp.service /etc/systemd/system/tftp.service.d/ 2>/dev/null || true
  register: _215060_execstart
  changed_when: false
  when: _215060_installed.rc == 0
  tags: [validate]

- name: RHEL-09-215060 | record TFTP secure mode status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-215060': {
        'status':
          'not_applicable' if _215060_installed.rc != 0
          else ('not_a_finding'
                if '-s' in (_215060_execstart.stdout | default(''))
                else 'open'),
        'finding_details':
          'tftp-server installed: ' ~ (_215060_installed.rc == 0) | string | lower
          ~ '\nExecStart lines found: '
          ~ (_215060_execstart.stdout | default('') | trim
             if _215060_execstart.stdout | default('') | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_applicable - tftp-server is not installed'
             if _215060_installed.rc != 0
             else ('not_a_finding - TFTP is running in secure mode (-s flag present)'
                   if '-s' in (_215060_execstart.stdout | default(''))
                   else 'OPEN - TFTP is installed but -s flag not found in ExecStart')),
        'comments':
          'If TFTP is not required, remove it: sudo dnf remove tftp-server. '
          ~ 'To enable secure mode: sudo systemctl edit tftp.service and add '
          ~ 'ExecStart=/usr/sbin/in.tftpd -s /var/lib/tftpboot under [Service].'
      }
    }) }}"
  tags: [validate]

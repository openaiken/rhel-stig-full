---
# RHEL-09-215095 | V-257842
# RHEL 9 must have the s-nail package installed.
# CAT II (Medium) | CCI-001744

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.

- name: RHEL-09-215095 | check s-nail is installed
  shell: |
    if rpm -q --quiet s-nail; then state=installed; else state="not installed"; fi
    echo "s-nail: $state ($(rpm -q s-nail 2>&1 | head -1))"
    if [ "$state" = "installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: s-nail must be installed"
    fi
  register: _215095_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215095 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-215095': {
        'status':
          'not_a_finding' if _215095_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _215095_result.stdout | trim,
        'comments':
          'Install the package: sudo dnf install s-nail'
      }
    }) }}"
  tags: [validate]

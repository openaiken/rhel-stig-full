---
# RHEL-09-215050 | V-257833
# RHEL 9 must not have the iprutils package installed.
# CAT II (Medium) | CCI-000381

# Previously decided only by the formal role, whose check-mode result says
# whether a task would change something. Checked here directly, as the STIG
# command does, so the formal role is no longer needed for assessment.
# An operational requirement documented with the ISSO is accepted
# (rhel9_attest_documented_exceptions).

- name: RHEL-09-215050 | check iprutils is not installed
  shell: |
    if rpm -q --quiet iprutils; then state=installed; else state="not installed"; fi
    echo "iprutils: $state ($(rpm -q iprutils 2>&1 | head -1))"
    if [ "$state" = "not installed" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: iprutils must be not installed"
    fi
  register: _215050_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-215050 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-215050': {
        'status':
          'not_a_finding' if _215050_result.stdout is search('^STATUS: PASS', multiline=True)
          else ('not_a_finding' if (rhel9_attest_documented_exceptions | default({})).get('RHEL-09-215050')
          else 'open'),
        'finding_details':
          _215050_result.stdout | trim
          ~ '\nDocumented exception (rhel9_attest_documented_exceptions): '
          ~ ((rhel9_attest_documented_exceptions | default({})).get('RHEL-09-215050') or '(none)'),
        'comments':
          'Remove the package: sudo dnf remove iprutils'
      }
    }) }}"
  tags: [validate]

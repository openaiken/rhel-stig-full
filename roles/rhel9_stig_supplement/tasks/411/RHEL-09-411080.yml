---
# RHEL-09-411080 | V-258055
# RHEL 9 must automatically lock the root account until the root account is
# released by an administrator when three unsuccessful logon attempts occur
# during a 15-minute time period.
# CAT II (Medium) | CCI-000044, CCI-002238

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.

- name: RHEL-09-411080 | check faillock even_deny_root
  shell: |
    shopt -s nullglob
    files=(/etc/security/faillock.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="even_deny_root" -v m="flag" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "even_deny_root (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'even_deny_root' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [ "$val" = "set" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: even_deny_root is not set"
    fi
  register: _411080_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-411080 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-411080': {
        'status':
          'not_a_finding' if _411080_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _411080_result.stdout | trim,
        'comments':
          'Add even_deny_root to /etc/security/faillock.conf.'
      }
    }) }}"
  tags: [validate]

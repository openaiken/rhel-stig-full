---
# RHEL-09-411025 | V-258044
# RHEL 9 must set the umask value to 077 for all local interactive user
# accounts.
# CAT II (Medium) | CCI-000366

- name: RHEL-09-411025 | check umask in interactive user init files
  shell: |
    findings=""
    while IFS=: read -r username _ uid _ _ homedir shell; do
      [ "$uid" -lt 1000 ] 2>/dev/null && continue
      [[ "$shell" =~ nologin|/false$ ]] && continue
      [ ! -d "$homedir" ] && continue
      while IFS= read -r initfile; do
        while IFS= read -r line; do
          # skip comments
          [[ "$line" =~ ^[[:space:]]*# ]] && continue
          [[ "$line" =~ (^|[^[:alnum:]_])umask([[:space:]]|$) ]] || continue
          mask=$(echo "$line" | grep -oP '\bumask\s+\K0?[0-7]{3,4}\b' | tail -1)
          # 077 or stricter: every group and other bit must be masked. An
          # unreadable value (symbolic, variable) cannot be verified, so it is a
          # finding; it used to be a WARN that still ended in PASS.
          if [ -z "$mask" ]; then
            findings="${findings}FAIL: ${initfile}: umask value not verifiable: $line\n"
          elif [ $(( 8#$mask & 8#077 )) -ne $(( 8#077 )) ]; then
            findings="${findings}FAIL: ${initfile}: umask=$mask (less restrictive than 077)\n"
          else
            findings="${findings}PASS: ${initfile}: umask=$mask\n"
          fi
        done < "$initfile"
      done < <(find "$homedir" -maxdepth 1 -type f -name ".[^.]*" 2>/dev/null)
    done < /etc/passwd
    # The STIG command covers user init files only. /etc/profile and /etc/bashrc
    # were also scanned here; their stock umask 022 lines sit inside UID
    # branches and are the subject of other rules, so they made this rule open
    # on hosts whose user files comply.
    if [ -z "$findings" ]; then
      echo "STATUS: PASS (no umask lines found in init files)"
    elif echo -e "$findings" | grep -q '^FAIL:'; then
      echo "STATUS: FAIL"
      echo -e "$findings" | sed '/^$/d'
    else
      echo "STATUS: PASS"
      echo -e "$findings" | sed '/^$/d'
    fi
  register: _411025_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-411025 | record umask check status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-411025': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _411025_result.stdout else 'open',
        'finding_details': _411025_result.stdout | trim,
        'comments': 'Set umask 077 in /etc/profile or /etc/profile.d/umask.sh'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-411045 | V-258048
# All RHEL 9 interactive users must have a primary group that exists.
# CAT II (Medium) | CCI-000764

- name: RHEL-09-411045 | check interactive user primary groups with pwck
  shell: |
    # pwck -r exits non-zero and prints errors for invalid entries
    output=$(pwck -r 2>&1 | grep -i 'no group\|GID.*does not exist\|invalid group' || true)
    if [ -z "$output" ]; then
      echo "STATUS: PASS"
      echo "RAW: pwck -r reported no missing primary groups"
    else
      echo "STATUS: FAIL"
      echo "RAW: pwck -r output:"
      echo "$output"
    fi
  register: _411045_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-411045 | record primary group validity status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-411045': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _411045_result.stdout else 'open',
        'finding_details': _411045_result.stdout | trim,
        'comments': 'Create missing groups or reassign users to valid groups to resolve pwck errors'
      }
    }) }}"
  tags: [validate]

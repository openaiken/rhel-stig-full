---
# RHEL-09-411060 | V-258051
# All RHEL 9 local interactive users must have a home directory assigned in
# the /etc/passwd file.
# CAT II (Medium) | CCI-000764

- name: RHEL-09-411060 | check interactive users have home directory assigned
  shell: |
    findings=""
    while IFS=: read -r username _ uid _ _ homedir shell; do
      [ "$uid" -lt 1000 ] 2>/dev/null && continue
      [[ "$shell" =~ nologin|/false$ ]] && continue
      if [ -z "$homedir" ]; then
        findings="${findings}FAIL: ${username} (uid=${uid}): no home directory defined in /etc/passwd\n"
      else
        findings="${findings}PASS: ${username} (uid=${uid}): home=${homedir}\n"
      fi
    done < /etc/passwd
    if [ -z "$findings" ]; then
      echo "STATUS: PASS (no interactive users found)"
    elif echo -e "$findings" | grep -q '^FAIL:'; then
      echo "STATUS: FAIL"
      echo -e "$findings" | sed '/^$/d'
    else
      echo "STATUS: PASS"
      echo -e "$findings" | sed '/^$/d'
    fi
  register: _411060_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-411060 | record home directory assignment status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-411060': {
        'status': 'not_a_finding' if _411060_result.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _411060_result.stdout | trim,
        'comments': 'Assign a home directory: usermod -d /home/<username> -m <username>'
      }
    }) }}"
  tags: [validate]

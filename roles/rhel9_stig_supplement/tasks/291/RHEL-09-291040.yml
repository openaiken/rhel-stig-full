---
# RHEL-09-291040 | V-258040
# RHEL 9 wireless network adapters must be disabled.
# CAT II (Medium) | CCI-001443

# Not Applicable if the system has no physical wireless network radios
# (no wifi-type devices appear in nmcli — auto-detected).
#
# Compliant when all wifi radios are disabled via nmcli.
# If a wireless interface is configured and active, ISSO documentation
# is required — set rhel9_attest_wifi_approved: true and record the
# approval in rhel9_attest_wifi_comment.

- name: RHEL-09-291040 | check for wifi devices
  shell: nmcli -t -f DEVICE,TYPE device status 2>/dev/null | grep ':wifi$' || true
  register: _291040_wifi_devices
  changed_when: false
  tags: [validate]

- name: RHEL-09-291040 | check wifi radio state
  shell: nmcli radio wifi 2>/dev/null || echo "(nmcli unavailable)"
  register: _291040_radio
  changed_when: false
  when: _291040_wifi_devices.stdout | trim
  tags: [validate]

- name: RHEL-09-291040 | record wireless adapter status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-291040': {
        'status':
          'not_applicable' if not (_291040_wifi_devices.stdout | trim)
          else ('not_a_finding'
                if (_291040_radio.stdout | default('') | lower | trim) == 'disabled'
          else ('not_a_finding' if rhel9_attest_wifi_approved | bool
          else 'open')),
        'finding_details':
          'Wifi devices detected:\n'
          ~ (_291040_wifi_devices.stdout | trim if _291040_wifi_devices.stdout | trim
             else '(none — not applicable)')
          ~ '\nWifi radio state: '
          ~ (_291040_radio.stdout | default('') | trim
             if _291040_wifi_devices.stdout | trim else 'N/A')
          ~ '\nAttestation (rhel9_attest_wifi_approved): '
          ~ (rhel9_attest_wifi_approved | bool | string | lower)
          ~ '\nISSO approval documentation: '
          ~ (rhel9_attest_wifi_comment if rhel9_attest_wifi_comment else '(not provided)'),
        'comments':
          'Disable all wireless radios: sudo nmcli radio all off. '
          ~ 'If wireless is an operational requirement approved by the ISSO, '
          ~ 'set rhel9_attest_wifi_approved: true and record the approval '
          ~ 'in rhel9_attest_wifi_comment.'
      }
    }) }}"
  tags: [validate]

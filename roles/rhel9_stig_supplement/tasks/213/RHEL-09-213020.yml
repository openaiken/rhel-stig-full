---
# RHEL-09-213020 | V-257799
# RHEL 9 must prevent the loading of a new kernel for later execution.
# CAT II (Medium) | CCI-003992, CCI-001749

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-213020 | check kernel.kexec_load_disabled (running value)
  shell: |
    want='1'
    got=$(sysctl -n kernel.kexec_load_disabled 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?kernel[.]kexec_load_disabled[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: kernel.kexec_load_disabled = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _213020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-213020 | record kernel.kexec_load_disabled status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-213020': {
        'status':
          'not_a_finding' if _213020_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _213020_result.stdout | trim,
        'comments':
          'Set kernel.kexec_load_disabled = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

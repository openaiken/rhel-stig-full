---
- name: set supplement run timestamp
  set_fact:
    # Four-digit year so it cannot be misread as a day; seconds so a
    # tag-limited run in the same minute cannot overwrite a full run.
    supp_run_ts: "{{ '%Y%b%d-%H:%M:%S' | strftime }}"
  delegate_to: localhost
  become: false
  tags: always

- name: initialize supplement facts accumulator
  set_fact:
    supp_facts: {}
  tags: always


# Every rule task is tagged [validate], so a run with --tags remediate assesses
# nothing and leaves supp_facts empty. cklb.py merges results per rule, so an
# empty file would do no harm, but it would be noise; skip the write.
- name: write supplement facts to disk
  copy:
    content: "{{ supp_facts | to_nice_json(indent=2) }}"
    dest: "{{ supp_facts_dir }}/{{ supp_run_ts }}-{{ inventory_hostname }}.json"
  delegate_to: localhost
  become: false
  when: supp_facts | length > 0
  tags: always

---
# RHEL-09-231160 | V-257873
# RHEL 9 must mount /var/log/audit with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /var/log/audit is mounted with the nodev option.
# An empty result means /var/log/audit is not separately mounted, which is also a finding.

- name: RHEL-09-231160 | get /var/log/audit mount options
  shell: awk '$2 == "/var/log/audit" { print $4 }' /proc/mounts
  register: _231160_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-231160 | record /var/log/audit nodev mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231160': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231160_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/log/audit mount options: '
          ~ (_231160_result.stdout | default('') | trim
             if _231160_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /var/log/audit'
             if ('nodev' in (_231160_result.stdout | default('')))
             else 'OPEN - nodev not found in /var/log/audit mount options'),
        'comments': 'Add nodev to the /var/log/audit entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231105 | V-257862
# RHEL 9 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory.
# CAT II (Medium) | CCI-001764

# Checks that /boot/efi is mounted with the nosuid option.
# Not applicable on BIOS systems (detected via /sys/firmware/efi).

- name: RHEL-09-231105 | check for UEFI firmware
  stat:
    path: /sys/firmware/efi
  register: _231105_result_efi
  tags: [validate]

- name: RHEL-09-231105 | get /boot/efi mount options (UEFI only)
  shell: awk '$2 == "/boot/efi" { print $4 }' /proc/mounts
  register: _231105_result_opts
  changed_when: false
  when: _231105_result_efi.stat.exists
  tags: [validate]

- name: RHEL-09-231105 | record /boot/efi nosuid status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231105': {
        'status':
          'not_applicable' if not _231105_result_efi.stat.exists
          else ('not_a_finding'
                if 'nosuid' in (_231105_result_opts.stdout | default(''))
                else 'open'),
        'finding_details':
          'UEFI system: ' ~ (_231105_result_efi.stat.exists | string | lower)
          ~ '\n/boot/efi mount options: '
          ~ (_231105_result_opts.stdout | default('') | trim
             if _231105_result_opts.stdout | default('') | trim else '(not mounted or N/A)')
          ~ '\nResult: '
          ~ ('not_applicable - BIOS system, /boot/efi not applicable'
             if not _231105_result_efi.stat.exists
             else ('not_a_finding - nosuid is set on /boot/efi'
                   if 'nosuid' in (_231105_result_opts.stdout | default(''))
                   else 'OPEN - nosuid not found in /boot/efi mount options')),
        'comments': 'Add nosuid to the /boot/efi entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

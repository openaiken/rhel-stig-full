---
# RHEL-09-255064 | V-270177
# The RHEL 9 SSH client must be configured to use only DOD-approved encryption
# ciphers employing FIPS 140-3 validated cryptographic hash algorithms.
# CAT I (High) | CCI-000877

# Approved set (order-independent): aes256-gcm@openssh.com, aes256-ctr,
#   aes128-gcm@openssh.com, aes128-ctr
# Check sorts both the configured and approved sets before comparing so that
# a compliant system is not marked open due to differing cipher ordering.

- name: RHEL-09-255064 | check SSH client ciphers
  shell: |
    file=/etc/crypto-policies/back-ends/openssh.config
    approved="aes128-ctr,aes128-gcm@openssh.com,aes256-ctr,aes256-gcm@openssh.com"
    line=$(grep -i '^\s*Ciphers\s' "$file" 2>/dev/null | head -1)
    if [ -z "$line" ]; then
      echo "STATUS: FAIL"
      echo "RAW: (Ciphers line missing or file not found)"
    else
      actual=$(echo "$line" | awk '{print $2}' | tr ',' '\n' | sort | tr '\n' ',' | sed 's/,$//')
      echo "RAW: $line"
      if [ "$actual" = "$approved" ]; then
        echo "STATUS: PASS"
      else
        echo "STATUS: FAIL (sorted actual: $actual)"
      fi
    fi
  register: _255064_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-255064 | record SSH client cipher status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-255064': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _255064_result.stdout else 'open',
        'finding_details': _255064_result.stdout | trim,
        'comments':
          'Set FIPS crypto policy: sudo update-crypto-policies --set FIPS. '
          ~ 'Approved ciphers: aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr '
          ~ '(order does not matter for compliance, any set containing only these four is compliant).'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-253060 | V-257967
# RHEL 9 must limit the number of bogus Internet Control Message Protocol
# (ICMP) response errors logs.
# CAT II (Medium) | CCI-000366

# The STIG checks the running value (sysctl). The formal role's sysctl task
# compares against /etc/sysctl.conf, so a host setting this in
# /etc/sysctl.d/ (as ComplianceAsCode does) was reported open while
# compliant. The value persisted by the sysctl configuration is shown for
# context.

- name: RHEL-09-253060 | check net.ipv4.icmp_ignore_bogus_error_responses (running value)
  shell: |
    want='1'
    got=$(sysctl -n net.ipv4.icmp_ignore_bogus_error_responses 2>&1)
    persisted=$(/usr/lib/systemd/systemd-sysctl --cat-config 2>/dev/null \
      | grep -E '^[[:space:]]*-?net[.]ipv4[.]icmp_ignore_bogus_error_responses[[:space:]]*=' | tail -1 | cut -d= -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
    echo "RUNTIME: net.ipv4.icmp_ignore_bogus_error_responses = $got"
    echo "PERSISTED (systemd-sysctl --cat-config, last wins): ${persisted:-(not set)}"
    if [ "$got" = "$want" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: running value must be $want"
    fi
  register: _253060_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-253060 | record net.ipv4.icmp_ignore_bogus_error_responses status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-253060': {
        'status':
          'not_a_finding' if _253060_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _253060_result.stdout | trim,
        'comments':
          'Set net.ipv4.icmp_ignore_bogus_error_responses = 1 in a file in /etc/sysctl.d/ and apply it: sysctl --system'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-214020 | V-257821
# RHEL 9 must check the GPG signature of locally installed software packages
# before installation.
# CAT I (High) | CCI-003992, CCI-001749

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Parsed from the [main] section, with any spacing around the equals sign.

- name: RHEL-09-214020 | check dnf localpkg_gpgcheck
  shell: |
    val=$(awk -v want="localpkg_gpgcheck" '
      /^[[:space:]]*[#;]/ { next }
      /^[[:space:]]*\[/ { sec = tolower($0); gsub(/[][[:space:]]/, "", sec); next }
      sec == "main" && index($0, "=") {
        k = $0; sub(/=.*/, "", k); gsub(/[[:space:]]/, "", k)
        if (tolower(k) == want) { v = $0; sub(/^[^=]*=/, "", v); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v) }
      }
      END { print v }' /etc/dnf/dnf.conf 2>/dev/null)
    echo "[main] localpkg_gpgcheck in /etc/dnf/dnf.conf: ${val:-(not set)}"
    if [[ "${val,,}" =~ ^(1|true|yes)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: localpkg_gpgcheck must be enabled in [main] of /etc/dnf/dnf.conf"
    fi
  register: _214020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-214020 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-214020': {
        'status':
          'not_a_finding' if _214020_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _214020_result.stdout | trim,
        'comments':
          'Set localpkg_gpgcheck=1 in the [main] section of /etc/dnf/dnf.conf.'
      }
    }) }}"
  tags: [validate]

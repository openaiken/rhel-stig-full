---
# RHEL-09-214035 | V-257824
# RHEL 9 must remove all software components after updated versions have been
# installed.
# CAT III (Low) | CCI-002617

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Parsed from the [main] section, with any spacing around the equals sign.

- name: RHEL-09-214035 | check dnf clean_requirements_on_remove
  shell: |
    val=$(awk -v want="clean_requirements_on_remove" '
      /^[[:space:]]*[#;]/ { next }
      /^[[:space:]]*\[/ { sec = tolower($0); gsub(/[][[:space:]]/, "", sec); next }
      sec == "main" && index($0, "=") {
        k = $0; sub(/=.*/, "", k); gsub(/[[:space:]]/, "", k)
        if (tolower(k) == want) { v = $0; sub(/^[^=]*=/, "", v); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v) }
      }
      END { print v }' /etc/dnf/dnf.conf 2>/dev/null)
    echo "[main] clean_requirements_on_remove in /etc/dnf/dnf.conf: ${val:-(not set)}"
    if [[ "${val,,}" =~ ^(true|1|yes)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: clean_requirements_on_remove must be True in [main] of /etc/dnf/dnf.conf"
    fi
  register: _214035_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-214035 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-214035': {
        'status':
          'not_a_finding' if _214035_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _214035_result.stdout | trim,
        'comments':
          'Set clean_requirements_on_remove=True in the [main] section of /etc/dnf/dnf.conf.'
      }
    }) }}"
  tags: [validate]

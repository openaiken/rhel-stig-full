---
# RHEL-09-653120 | V-258173
# RHEL 9 must allocate an audit_backlog_limit of sufficient size to capture
# processes that start prior to the audit daemon.
# CAT III (Low) | CCI-001849

# The STIG says: if audit_backlog_limit is present AND < 8192, that is a
# finding. If not set at all, the kernel default (~64) is far below 8192 and
# is treated as a finding here. This is a deliberate, owner-confirmed
# reading (2026-09-30): unset means a small limit, not no limit, so do not
# relax it to the literal check text. Checks all boot entries via grubby --info=ALL
# and reports the minimum value found (the worst-case kernel wins).

- name: RHEL-09-653120 | check audit_backlog_limit in kernel parameters
  shell: |
    if ! command -v grubby &>/dev/null; then
      echo "STATUS: FAIL"
      echo "FAIL: grubby not available - cannot verify kernel boot parameters"
      exit 0
    fi

    all_args=$(grubby --info=ALL 2>/dev/null | grep '^args=' || true)

    if echo "$all_args" | grep -q 'audit_backlog_limit'; then
      min_val=$(echo "$all_args" \
        | grep -o 'audit_backlog_limit=[0-9]*' \
        | awk -F'=' '{print $2}' \
        | sort -n \
        | head -1)
      if [ -z "$min_val" ]; then
        echo "STATUS: FAIL"
        echo "FAIL: audit_backlog_limit found in kernel args but value could not be parsed"
      elif [ "$min_val" -ge 8192 ]; then
        echo "STATUS: PASS"
        echo "PASS: audit_backlog_limit=$min_val (>= 8192 required)"
      else
        echo "STATUS: FAIL"
        echo "FAIL: audit_backlog_limit=$min_val (minimum required: 8192)"
      fi
    else
      echo "STATUS: FAIL"
      echo "FAIL: audit_backlog_limit not set - kernel default (~64) is insufficient"
    fi
    echo "KERNEL_ARGS:"
    echo "$all_args" | head -5
  register: _653120_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-653120 | record audit_backlog_limit status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-653120': {
        'status':
          'not_a_finding' if 'STATUS: PASS' in _653120_result.stdout
          else 'open',
        'finding_details': _653120_result.stdout | trim,
        'comments':
          'Set audit_backlog_limit in all kernel boot entries: '
          ~ 'grubby --update-kernel=ALL --args=audit_backlog_limit=8192. '
          ~ 'Reboot to apply. Verify with: grubby --info=ALL | grep audit_backlog'
      }
    }) }}"
  tags: [validate]

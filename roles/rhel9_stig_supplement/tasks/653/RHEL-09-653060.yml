---
# RHEL-09-653060 | V-258161
# RHEL 9 must label all offloaded audit logs before sending them to the
# central log server.
# CAT II (Medium) | CCI-000132, CCI-001851

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# The formal role also enforces one exact value, but the STIG sets a limit
# ("X or more", "X or less", one of a set); a stricter value was reported open.
# The files are read as the consuming library reads them (drop-ins where it
# has them, comments ignored, last value wins) and compared as the STIG says.

- name: RHEL-09-653060 | check auditd name_format
  shell: |
    shopt -s nullglob
    files=(/etc/audit/auditd.conf)
    isint() { [[ "$1" =~ ^-?[0-9]+$ ]]; }
    val=$(awk -v k="name_format" -v m="eq" '
      { line = $0; sub(/#.*/, "", line) }
      line ~ /^[[:space:]]*$/ { next }
      m == "eq" && index(line, "=") {
        kk = substr(line, 1, index(line, "=") - 1); gsub(/[[:space:]]/, "", kk)
        if (tolower(kk) == tolower(k)) { v = substr(line, index(line, "=") + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); f = 1 }
      }
      m == "ws" { split(line, a, " "); if (tolower(a[1]) == tolower(k)) { v = a[2]; f = 1 } }
      m == "flag" { t = line; gsub(/[[:space:]]/, "", t); if (tolower(t) == tolower(k)) { v = "set"; f = 1 } }
      END { if (f) print v }' "${files[@]}" 2>/dev/null)
    echo "name_format (effective, last uncommented occurrence): ${val:-(not set)}"
    echo "lines: $(grep -Hi 'name_format' "${files[@]}" 2>/dev/null | grep -vE ':[[:space:]]*#' | tr '\n' ' ')"
    if [[ "${val,,}" =~ ^(hostname|fqd|numeric)$ ]]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: name_format must be hostname, fqd or numeric"
    fi
  register: _653060_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-653060 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-653060': {
        'status':
          'not_a_finding' if _653060_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _653060_result.stdout | trim,
        'comments':
          'Set name_format = hostname in /etc/audit/auditd.conf.'
      }
    }) }}"
  tags: [validate]

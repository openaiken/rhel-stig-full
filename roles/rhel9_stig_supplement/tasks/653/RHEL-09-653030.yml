---
# RHEL-09-653030 | V-258155
# RHEL 9 must allocate audit record storage capacity to store at least one
# week's worth of audit records.
# CAT II (Medium) | CCI-001849, CCI-001851

# Checks available space on the partition hosting audit logs against a
# site-configurable threshold. The STIG cites 10GB as typical; set
# rhel9_audit_min_storage_gb to reflect actual site requirements (default 2GB
# is appropriate for low-activity systems or those with remote offload).
#
# Not applicable when audit records are forwarded immediately to a remote
# facility (audisp-remote, SPLUNK heavy forwarder, etc.) such that extended
# local retention is not required — set rhel9_attest_audit_immediate_offload.

- name: RHEL-09-653030 | check audit log partition storage capacity
  shell: |
    conf=/etc/audit/auditd.conf
    if [ ! -f "$conf" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: $conf not found"
      exit 0
    fi

    log_file=$(grep -E '^\s*log_file\s*=' "$conf" | awk -F'=' '{print $2}' | xargs)
    log_file=${log_file:-/var/log/audit/audit.log}
    log_dir=$(dirname "$log_file")

    avail_kb=$(df -P "$log_dir" 2>/dev/null | awk 'NR==2{print $4}')
    if [ -z "$avail_kb" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: could not determine available space for $log_dir"
      exit 0
    fi

    avail_gb=$(awk "BEGIN{printf \"%.1f\", $avail_kb / 1048576}")
    min_gb=${AUDIT_MIN_STORAGE_GB:-2}

    if awk "BEGIN{exit ($avail_gb >= $min_gb ? 0 : 1)}"; then
      echo "STATUS: PASS"
      echo "PASS: ${avail_gb}GB available on partition hosting $log_dir (threshold: ${min_gb}GB)"
    else
      echo "STATUS: FAIL"
      echo "FAIL: only ${avail_gb}GB available on partition hosting $log_dir (threshold: ${min_gb}GB)"
    fi
    df -P "$log_dir" | awk 'NR==2{printf "PARTITION: %s  SIZE: %.1fGB  AVAIL: %.1fGB\n", $1, $2/1048576, $4/1048576}'
  register: _653030_result
  changed_when: false
  failed_when: false
  environment:
    AUDIT_MIN_STORAGE_GB: "{{ rhel9_audit_min_storage_gb | default(2) }}"
  tags: [validate]

- name: RHEL-09-653030 | record audit storage capacity status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-653030': {
        'status':
          'not_applicable' if (rhel9_attest_audit_immediate_offload | default(false) | bool)
          else ('not_a_finding' if 'STATUS: PASS' in _653030_result.stdout
          else 'open'),
        'finding_details':
          _653030_result.stdout | trim
          ~ '\nMinimum storage threshold (rhel9_audit_min_storage_gb): '
          ~ (rhel9_audit_min_storage_gb | default(2) | string)
          ~ 'GB\nAttestation (rhel9_attest_audit_immediate_offload): '
          ~ (rhel9_attest_audit_immediate_offload | default(false) | bool | string | lower),
        'comments':
          'Resize the partition hosting /var/log/audit/ or relocate audit logs '
          ~ 'to a larger dedicated partition. Adjust rhel9_audit_min_storage_gb '
          ~ 'to match site requirements (STIG cites 10GB; 2GB default appropriate '
          ~ 'for low-activity or remote-offload systems).'
      }
    }) }}"
  tags: [validate]

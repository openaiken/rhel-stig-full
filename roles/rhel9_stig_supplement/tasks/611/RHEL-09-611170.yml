---
# RHEL-09-611170 | V-258206
# RHEL 9 must implement certificate status checking for multifactor
# authentication.
# CAT II (Medium) | CCI-004046, CCI-001954, CCI-001948

# SSSD must have certificate_verification = ocsp_dgst=sha512 in the [sssd]
# section, delivered via any file in /etc/sssd/conf.d/ or /etc/sssd/sssd.conf.
# The STIG fix references certificate_verification.conf by name, but any
# conf.d drop-in is equivalent — check all of them.
#
# If SSSD is not the mechanism for MFA (e.g. pam_pkcs11, direct GSSAPI/Kerberos
# with a hardware token), the SA must demonstrate an alternate cert status
# checking mechanism. Set rhel9_attest_alt_mfa_cert_verification: true and
# describe the mechanism in rhel9_attest_alt_mfa_cert_verification_method.
#
# REMEDIATION NOTE: the certificate_verification option goes in the [sssd]
# section, not a domain section. If the system uses smart card auth through
# IPA/FreeIPA, the IPA server's OCSP responder provides this automatically;
# verify the sssd.conf [sssd] section still explicitly sets ocsp_dgst=sha512.
# After changes: systemctl restart sssd

- name: RHEL-09-611170 | check SSSD OCSP certificate verification
  shell: |
    if ! rpm -q sssd &>/dev/null; then
      echo "NA: sssd not installed"
      exit 0
    fi

    # Check all conf sources for certificate_verification = ocsp_dgst=sha512
    result=$(grep -sir 'certificate_verification' \
               /etc/sssd/sssd.conf /etc/sssd/conf.d/ 2>/dev/null \
             | grep -v '^\s*#' || true)

    if echo "$result" | grep -qi 'ocsp_dgst=sha512'; then
      echo "STATUS: PASS"
      echo "PASS: certificate_verification = ocsp_dgst=sha512 found"
      echo "$result"
    elif [ -n "$result" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: certificate_verification found but ocsp_dgst=sha512 missing:"
      echo "$result"
    else
      echo "STATUS: FAIL"
      echo "FAIL: certificate_verification not configured in sssd.conf or conf.d/"
    fi
  register: _611170_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-611170 | record SSSD OCSP status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-611170': {
        'status':
          'not_applicable' if _611170_result.stdout is search('^NA:')
          else ('not_a_finding' if 'STATUS: PASS' in _611170_result.stdout
          else ('not_a_finding' if (rhel9_attest_alt_mfa_cert_verification | bool)
          else 'open')),
        'finding_details':
          _611170_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_alt_mfa_cert_verification): '
          ~ (rhel9_attest_alt_mfa_cert_verification | bool | string | lower)
          ~ '\nAlternate method: '
          ~ (rhel9_attest_alt_mfa_cert_verification_method
             if rhel9_attest_alt_mfa_cert_verification_method else '(not provided)'),
        'comments':
          'Add to /etc/sssd/conf.d/ (any .conf file): '
          ~ '[sssd]  certificate_verification = ocsp_dgst=sha512  '
          ~ 'then: systemctl restart sssd'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-611200 | V-258129
# RHEL 9 must require authentication to access single-user mode.
# CAT II (Medium) | CCI-000213

# sulogin must be present in the rescue.service ExecStart line.
# Config can be in the default systemd-shipped location OR in a drop-in
# under /etc/systemd/system/rescue.service.d/ — but NOT both (systemd
# applies only the drop-in ExecStart if one exists).

- name: RHEL-09-611200 | check single-user mode authentication
  shell: |
    default_file=/usr/lib/systemd/system/rescue.service
    dropin_dir=/etc/systemd/system/rescue.service.d

    # Decide on the effective ExecStart. The files alone mislead: a drop-in that
    # resets ExecStart to a plain shell left the default file still matching
    # sulogin, and the check passed.
    effective=$(systemctl show rescue.service -p ExecStart --value 2>/dev/null)
    echo "EFFECTIVE ExecStart: ${effective:-(unavailable)}"
    echo "default file: $(grep -h 'sulogin' "$default_file" 2>/dev/null | grep -v '^\s*#')"
    echo "drop-ins: $(grep -h 'ExecStart' "$dropin_dir"/*.conf 2>/dev/null | grep -v '^\s*#' | tr '\n' ' ')"
    if echo "$effective" | grep -q 'argv\[\]=[^;]*sulogin'; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: rescue.service does not run sulogin"
    fi
  register: _611200_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-611200 | record single-user mode auth status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-611200': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _611200_result.stdout else 'open',
        'finding_details': _611200_result.stdout | trim,
        'comments':
          'Create /etc/systemd/system/rescue.service.d/sulogin.conf with: '
          ~ 'ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue  '
          ~ 'then: systemctl daemon-reload'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-611155 | V-258120
# RHEL 9 must not have accounts configured with blank or null passwords.
# CAT II (Medium) | CCI-000366

# Field 2 of /etc/shadow being empty (length 0) means a blank password.
# Locked accounts have '!', '!!', or '*' in field 2 — those are not findings.
# REMEDIATION NOTE: in SSSD/IdM environments, domain user accounts in shadow
# may have an empty or placeholder password field because auth is via Kerberos/
# pam_sss.so. Verify any flagged account is not an SSSD-managed account before
# forcing a local password set. Locking the account (passwd -l) is a safe option
# for accounts that should never authenticate locally.

- name: RHEL-09-611155 | check for blank shadow passwords
  shell: |
    findings=$(awk -F: '!$2 {print $1}' /etc/shadow 2>/dev/null || true)
    if [ -n "$findings" ]; then
      echo "STATUS: FAIL"
      echo "$findings"
    else
      echo "STATUS: PASS"
      echo "PASS: no accounts with blank password field in /etc/shadow"
    fi
  register: _611155_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-611155 | record blank shadow password status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-611155': {
        'status': 'not_a_finding' if _611155_result.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _611155_result.stdout | trim,
        'comments':
          'Set a password (passwd <user>) or lock the account (passwd -l <user>). '
          ~ 'Verify SSSD-managed accounts before setting a local password.'
      }
    }) }}"
  tags: [validate]

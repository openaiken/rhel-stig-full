---
# RHEL-09-611010 | V-258091
# RHEL 9 must ensure the password complexity module in the system-auth file
# is configured for three retries or less.
# CAT II (Medium) | CCI-004066, CCI-000192

# The retry value controls how many failed complexity attempts pam_pwquality
# allows before returning an error. 0 means unlimited (finding); >3 is also
# a finding. Check both pwquality.conf and any drop-in conf.d file.
# REMEDIATION NOTE: prefer drop-in under /etc/security/pwquality.conf.d/
# rather than editing the base file, so upgrades don't clobber the setting.

- name: RHEL-09-611010 | check pwquality retry setting
  shell: |
    # Collect retry values from base config and all drop-in files.
    # Last matching line wins (same precedence as the library applies).
    val=$(grep -rh '^\s*retry\s*=' \
            /etc/security/pwquality.conf \
            /etc/security/pwquality.conf.d/*.conf \
            2>/dev/null \
          | awk -F= '{print $2}' | xargs | tail -1)

    if [ -z "$val" ]; then
      echo "STATUS: FAIL"
      echo "FAIL: retry not set in pwquality.conf or pwquality.conf.d/ (must be 1-3)"
      exit 0
    fi

    if [ "$val" -eq 0 ] || [ "$val" -gt 3 ]; then
      echo "STATUS: FAIL"
      echo "FAIL: retry=$val (must be 1-3; 0 means unlimited)"
    else
      echo "STATUS: PASS"
      echo "PASS: retry=$val"
    fi
  register: _611010_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-611010 | record pwquality retry status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-611010': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _611010_result.stdout else 'open',
        'finding_details': _611010_result.stdout | trim,
        'comments':
          'Add retry = 3 to /etc/security/pwquality.conf.d/stig.conf'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-611165 | V-258122
# RHEL 9 must enable certificate based smart card authentication.
# CAT II (Medium) | CCI-000765, CCI-004046, CCI-004047, CCI-001948

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Read from sssd.conf and conf.d, last value wins. Not applicable when the SA
# demonstrates an approved alternate MFA method (rhel9_attest_alt_mfa_no_pki).

- name: RHEL-09-611165 | check sssd pam_cert_auth
  shell: |
    shopt -s nullglob
    val=$(grep -hiE '^[[:space:]]*pam_cert_auth[[:space:]]*=' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '[:space:]')
    echo "pam_cert_auth (sssd.conf and conf.d, last wins): ${val:-(not set)}"
    if [ "${val,,}" = "true" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: pam_cert_auth must be True"
    fi
  register: _611165_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-611165 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-611165': {
        'status':
          'not_applicable' if (rhel9_attest_alt_mfa_no_pki | bool)
          else 'not_a_finding' if _611165_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _611165_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_alt_mfa_no_pki): '
          ~ (rhel9_attest_alt_mfa_no_pki | bool | string | lower),
        'comments':
          'Set pam_cert_auth = True in the [pam] section of sssd.conf or a conf.d file.'
      }
    }) }}"
  tags: [validate]

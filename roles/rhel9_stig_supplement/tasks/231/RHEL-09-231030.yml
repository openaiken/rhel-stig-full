---
# RHEL-09-231030 | V-257847
# RHEL 9 must use a separate file system for the system audit data path.
# CAT III (Low) | CCI-001849

# Checks that /var/log/audit is mounted as a separate filesystem.

- name: RHEL-09-231030 | check /var/log/audit is a separate filesystem
  shell: awk '$2 == "/var/log/audit"' /proc/mounts
  register: _231030_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-231030 | record /var/log/audit separate filesystem status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231030': {
        'status': 'not_a_finding' if (_231030_result.stdout | trim) else 'open',
        'finding_details':
          '/proc/mounts entry: '
          ~ (_231030_result.stdout | trim if _231030_result.stdout | trim else '(not a separate mount - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - /var/log/audit is a separate filesystem'
             if (_231030_result.stdout | trim)
             else 'OPEN - /var/log/audit is not on a separate filesystem'),
        'comments': 'Requires a dedicated partition or logical volume. Configure in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

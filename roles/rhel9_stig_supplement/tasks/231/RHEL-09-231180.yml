---
# RHEL-09-231180 | V-257877
# RHEL 9 must mount /var/tmp with the noexec option.
# CAT II (Medium) | CCI-001764

# Checks that /var/tmp is mounted with the noexec option.
# An empty result means /var/tmp is not separately mounted, which is also a finding.

- name: RHEL-09-231180 | get /var/tmp mount options
  shell: awk '$2 == "/var/tmp" { print $4 }' /proc/mounts
  register: _231180_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231180 | record /var/tmp noexec mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231180': {
        'status':
          'not_a_finding'
          if ('noexec' in (_231180_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/tmp mount options: '
          ~ (_231180_result.stdout | default('') | trim
             if _231180_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - noexec is set on /var/tmp'
             if ('noexec' in (_231180_result.stdout | default('')))
             else 'OPEN - noexec not found in /var/tmp mount options'),
        'comments': 'Add noexec to the /var/tmp entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

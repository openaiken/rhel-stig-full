---
# RHEL-09-231080 | V-257857
# RHEL 9 must prevent code from being executed on file systems that are used with removable media.
# CAT II (Medium) | CCI-000366

# Removable media: fstab entries whose type (vfat, fat, msdos, ntfs, ntfs3, exfat, iso9660, udf)
# is used for removable media, excluding /boot and /boot/efi, which are fixed
# disks (on UEFI, /boot/efi is always vfat). Fields are parsed exactly: the
# option must be a whole comma-separated token, not a substring of the line.
# This formerly missed CD/DVD types (iso9660, udf), and 231085/231090 did not
# exclude /boot/efi, reporting every stock host a finding.

- name: RHEL-09-231080 | get removable media entries from fstab
  shell: >-
    awk '!/^[[:space:]]*#/ && NF >= 4 && $3 ~ /^(vfat|fat|msdos|ntfs|ntfs3|exfat|iso9660|udf)$/ && $2 != "/boot" && $2 != "/boot/efi"' /etc/fstab
    grep -Ei '^[^#]' /etc/fstab | grep -Ei '\b(vfat|fat|ntfs|exfat)\b'
    | awk '$2 != "/boot/efi" && $2 != "/boot"' || true
  register: _231080_result_all
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231080 | get removable media fstab entries missing noexec
  shell: >-
    awk '!/^[[:space:]]*#/ && NF >= 4 && $3 ~ /^(vfat|fat|msdos|ntfs|ntfs3|exfat|iso9660|udf)$/ && $2 != "/boot" && $2 != "/boot/efi" && ("," $4 ",") !~ /,noexec,/' /etc/fstab
    grep -Ei '^[^#]' /etc/fstab | grep -Ei '\b(vfat|fat|ntfs|exfat)\b'
    | awk '$2 != "/boot/efi" && $2 != "/boot"' | grep -v 'noexec' || true
  register: _231080_result_bad
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231080 | record removable media noexec status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231080': {
        'status':
          'not_applicable' if not (_231080_result_all.stdout | trim)
          else ('not_a_finding' if not (_231080_result_bad.stdout | trim) else 'open'),
        'finding_details':
          'Removable media fstab entries: '
          ~ (_231080_result_all.stdout | trim if _231080_result_all.stdout | trim else '(none - not applicable)')
          ~ '\nEntries missing noexec: '
          ~ (_231080_result_bad.stdout | trim if _231080_result_bad.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_applicable - no removable media entries in fstab'
             if not (_231080_result_all.stdout | trim)
             else ('not_a_finding - all removable media entries have noexec'
                   if not (_231080_result_bad.stdout | trim)
                   else 'OPEN - one or more removable media entries missing noexec')),
        'comments': 'Add noexec to all removable media entries in /etc/fstab.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231175 | V-257876
# RHEL 9 must mount /var/tmp with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /var/tmp is mounted with the nodev option.
# An empty result means /var/tmp is not separately mounted, which is also a finding.

- name: RHEL-09-231175 | get /var/tmp mount options
  shell: awk '$2 == "/var/tmp" { print $4 }' /proc/mounts
  register: _231175_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231175 | record /var/tmp nodev mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231175': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231175_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/tmp mount options: '
          ~ (_231175_result.stdout | default('') | trim
             if _231175_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /var/tmp'
             if ('nodev' in (_231175_result.stdout | default('')))
             else 'OPEN - nodev not found in /var/tmp mount options'),
        'comments': 'Add nodev to the /var/tmp entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

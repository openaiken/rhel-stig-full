---
# RHEL-09-231140 | V-257869
# RHEL 9 must mount /var with the nodev option.
# CAT II (Medium) | CCI-001764

# Checks that /var is mounted with the nodev option.
# An empty result means /var is not separately mounted, which is also a finding.

- name: RHEL-09-231140 | get /var mount options
  shell: awk '$2 == "/var" { print $4 }' /proc/mounts
  register: _231140_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231140 | record /var nodev mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231140': {
        'status':
          'not_a_finding'
          if ('nodev' in (_231140_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var mount options: '
          ~ (_231140_result.stdout | default('') | trim
             if _231140_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nodev is set on /var'
             if ('nodev' in (_231140_result.stdout | default('')))
             else 'OPEN - nodev not found in /var mount options'),
        'comments': 'Add nodev to the /var entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-231130 | V-257867
# RHEL 9 must mount /tmp with the noexec option.
# CAT II (Medium) | CCI-001764

# Checks that /tmp is mounted with the noexec option.
# An empty result means /tmp is not separately mounted, which is also a finding.

- name: RHEL-09-231130 | get /tmp mount options
  shell: awk '$2 == "/tmp" { print $4 }' /proc/mounts
  register: _231130_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231130 | record /tmp noexec mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231130': {
        'status':
          'not_a_finding'
          if ('noexec' in (_231130_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/tmp mount options: '
          ~ (_231130_result.stdout | default('') | trim
             if _231130_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - noexec is set on /tmp'
             if ('noexec' in (_231130_result.stdout | default('')))
             else 'OPEN - noexec not found in /tmp mount options'),
        'comments': 'Add noexec to the /tmp entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

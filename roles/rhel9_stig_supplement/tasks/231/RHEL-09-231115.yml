---
# RHEL-09-231115 | V-257864
# RHEL 9 must mount /dev/shm with the noexec option.
# CAT II (Medium) | CCI-001764

# Checks that /dev/shm is mounted with the noexec option.
# An empty result means /dev/shm is not separately mounted, which is also a finding.

- name: RHEL-09-231115 | get /dev/shm mount options
  shell: awk '$2 == "/dev/shm" { print $4 }' /proc/mounts
  register: _231115_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-231115 | record /dev/shm noexec mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231115': {
        'status':
          'not_a_finding'
          if ('noexec' in (_231115_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/dev/shm mount options: '
          ~ (_231115_result.stdout | default('') | trim
             if _231115_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - noexec is set on /dev/shm'
             if ('noexec' in (_231115_result.stdout | default('')))
             else 'OPEN - noexec not found in /dev/shm mount options'),
        'comments': 'Add noexec to the /dev/shm entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

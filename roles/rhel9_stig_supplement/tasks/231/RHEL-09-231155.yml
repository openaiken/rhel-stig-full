---
# RHEL-09-231155 | V-257872
# RHEL 9 must mount /var/log with the nosuid option.
# CAT II (Medium) | CCI-001764

# Checks that /var/log is mounted with the nosuid option.
# An empty result means /var/log is not separately mounted, which is also a finding.

- name: RHEL-09-231155 | get /var/log mount options
  shell: awk '$2 == "/var/log" { print $4 }' /proc/mounts
  register: _231155_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231155 | record /var/log nosuid mount option status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231155': {
        'status':
          'not_a_finding'
          if ('nosuid' in (_231155_result.stdout | default('')))
          else 'open',
        'finding_details':
          '/var/log mount options: '
          ~ (_231155_result.stdout | default('') | trim
             if _231155_result.stdout | default('') | trim
             else '(not separately mounted - FINDING)')
          ~ '\nResult: '
          ~ ('not_a_finding - nosuid is set on /var/log'
             if ('nosuid' in (_231155_result.stdout | default('')))
             else 'OPEN - nosuid not found in /var/log mount options'),
        'comments': 'Add nosuid to the /var/log entry in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

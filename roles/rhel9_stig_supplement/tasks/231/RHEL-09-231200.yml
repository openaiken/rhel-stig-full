---
# RHEL-09-231200 | V-257881
# RHEL 9 must prevent special devices on non-root local partitions.
# CAT II (Medium) | CCI-000366

# Checks that all non-root local disk partitions are mounted with nodev.
# Root (/) is excluded: mount output format ensures /dev/x on /WORD matches
# only non-root mounts (root mount point ends with a space, not a word char).

- name: RHEL-09-231200 | check non-root local partitions for missing nodev
  shell: mount | grep '^/dev\S* on /\S' | grep --invert-match nodev || true
  register: _231200_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-231200 | record nodev non-root partition status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-231200': {
        'status': 'not_a_finding' if not (_231200_result.stdout | trim) else 'open',
        'finding_details':
          'Non-root local mounts missing nodev: '
          ~ (_231200_result.stdout | trim if _231200_result.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - all non-root local partitions have nodev'
             if not (_231200_result.stdout | trim)
             else 'OPEN - one or more non-root local partitions missing nodev'),
        'comments': 'Add nodev to affected entries in /etc/fstab and remount.'
      }
    }) }}"
  tags: [validate]

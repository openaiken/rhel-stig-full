---
# RHEL-09-412070 | V-258075
# RHEL 9 must define default permissions for the system default profile.
# CAT II (Medium) | CCI-000366

# The formal role checks for its own line in one specific file, so a host
# configured equivalently elsewhere (a drop-in, other spacing or case) was
# reported open while compliant.
# Every uncommented umask statement must set 077, with at least one.

- name: RHEL-09-412070 | check umask in /etc/profile
  shell: |
    vals=$(grep -vE '^[[:space:]]*#' /etc/profile 2>/dev/null | grep -oE '(^|[^[:alnum:]_])umask[[:space:]]+[0-7]{3,4}' | awk '{print $NF}')
    echo "umask values set in /etc/profile: $(echo $vals)"
    bad=$(echo "$vals" | grep -vE '^0?077$' | grep .)
    if [ -n "$vals" ] && [ -z "$bad" ]; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "FAIL: every umask statement must set 077"
    fi
  register: _412070_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-412070 | record status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-412070': {
        'status':
          'not_a_finding' if _412070_result.stdout is search('^STATUS: PASS', multiline=True)
          else 'open',
        'finding_details':
          _412070_result.stdout | trim,
        'comments':
          'Set every umask statement in /etc/profile to 077.'
      }
    }) }}"
  tags: [validate]

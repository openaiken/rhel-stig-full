---
# RHEL-09-212055 | V-257796
# RHEL 9 must enable auditing of processes that start prior to the audit daemon.
# CAT III (Low) | CCI-000169
#
# The STIG states TWO finding conditions and both must hold:
#   1. every current kernel carries audit=1 (grubby)
#   2. GRUB_CMDLINE_LINUX in /etc/default/grub carries it too, so the
#      setting survives the next kernel install
# Checking only 1 was a false negative: a host configured with
# grubby --update-kernel=ALL passes today and silently loses auditing of pre-audit-daemon processes
# on the next kernel update.

- name: RHEL-09-212055 | check audit=1 in kernel args and grub defaults
  shell: |
    fail=0
    # grubby printing no kernel entries would otherwise read as compliant
    if [ "$(grubby --info=ALL 2>/dev/null | grep -c '^args=')" -eq 0 ]; then
      fail=1
      echo "FAIL: grubby --info=ALL returned no kernel entries; cannot verify"
    fi
    missing=$(grubby --info=ALL | grep args | grep -v 'audit=1')
    if [ -n "$missing" ]; then
      fail=1
      echo "FAIL: kernels missing audit=1:"
      echo "$missing"
    else
      echo "PASS: audit=1 present in all current kernel args"
    fi
    if grep -q '^[[:space:]]*GRUB_CMDLINE_LINUX=.*audit=1' /etc/default/grub 2>/dev/null; then
      echo "PASS: audit=1 present in GRUB_CMDLINE_LINUX"
    else
      fail=1
      echo "FAIL: audit=1 absent from GRUB_CMDLINE_LINUX in /etc/default/grub"
      echo "      setting will not persist across kernel updates"
      echo "CURRENT: $(grep '^[[:space:]]*GRUB_CMDLINE_LINUX=' /etc/default/grub 2>/dev/null || echo none)"
    fi
    if [ "$fail" -eq 0 ]; then echo "STATUS: PASS"; else echo "STATUS: FAIL"; fi
  register: _212055_audit
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212055 | record audit kernel arg status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212055': {
        'status': 'not_a_finding' if 'STATUS: PASS' in _212055_audit.stdout else 'open',
        'finding_details': _212055_audit.stdout | trim,
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=audit=1 && '
          ~ 'add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

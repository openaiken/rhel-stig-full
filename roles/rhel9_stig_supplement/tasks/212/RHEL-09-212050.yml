---
# RHEL-09-212050 | V-257795
# RHEL 9 must enable mitigations against processor-based vulnerabilities.
# CAT III (Low) | CCI-000366
#
# pti=on must be present in ALL kernel args. grubby returns lines missing the
# param; empty output means all kernels have it (not_a_finding).

- name: RHEL-09-212050 | check pti=on in grub kernel args
  shell: grubby --info=ALL | grep args | grep -v 'pti=on'
  register: _212050_pti
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212050 | record pti status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212050': {
        'status': 'not_a_finding' if not (_212050_pti.stdout | trim) else 'open',
        'finding_details':
          'Kernels missing pti=on: '
          ~ (_212050_pti.stdout | trim if _212050_pti.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - pti=on present in all kernel args'
             if not (_212050_pti.stdout | trim)
             else 'OPEN - one or more kernels missing pti=on'),
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=pti=on && '
          ~ 'add pti=on to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

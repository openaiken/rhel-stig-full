---
# RHEL-09-212050 | V-257795
# RHEL 9 must enable mitigations against processor-based vulnerabilities.
# CAT III (Low) | CCI-000366
#
# The STIG states TWO finding conditions and both must hold:
#   1. every current kernel carries pti=on (grubby)
#   2. GRUB_CMDLINE_LINUX in /etc/default/grub carries it too, so the
#      setting survives the next kernel install
# Checking only 1 was a false negative: a host configured with
# grubby --update-kernel=ALL passes today and silently loses kernel page-table isolation
# on the next kernel update.

- name: RHEL-09-212050 | check pti=on in kernel args and grub defaults
  shell: |
    fail=0
    # grubby printing no kernel entries would otherwise read as compliant
    if [ "$(grubby --info=ALL 2>/dev/null | grep -c '^args=')" -eq 0 ]; then
      fail=1
      echo "FAIL: grubby --info=ALL returned no kernel entries; cannot verify"
    fi
    missing=$(grubby --info=ALL | grep args | grep -v 'pti=on')
    if [ -n "$missing" ]; then
      fail=1
      echo "FAIL: kernels missing pti=on:"
      echo "$missing"
    else
      echo "PASS: pti=on present in all current kernel args"
    fi
    if grep -q '^[[:space:]]*GRUB_CMDLINE_LINUX=.*pti=on' /etc/default/grub 2>/dev/null; then
      echo "PASS: pti=on present in GRUB_CMDLINE_LINUX"
    else
      fail=1
      echo "FAIL: pti=on absent from GRUB_CMDLINE_LINUX in /etc/default/grub"
      echo "      setting will not persist across kernel updates"
      echo "CURRENT: $(grep '^[[:space:]]*GRUB_CMDLINE_LINUX=' /etc/default/grub 2>/dev/null || echo none)"
    fi
    if [ "$fail" -eq 0 ]; then echo "STATUS: PASS"; else echo "STATUS: FAIL"; fi
  register: _212050_pti
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212050 | record pti status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212050': {
        'status': 'not_a_finding' if _212050_pti.stdout is search('^STATUS: PASS', multiline=True) else 'open',
        'finding_details': _212050_pti.stdout | trim,
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=pti=on && '
          ~ 'add pti=on to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

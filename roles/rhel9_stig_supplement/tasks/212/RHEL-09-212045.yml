---
# RHEL-09-212045 | V-257794
# RHEL 9 must clear memory when it is freed to prevent use-after-free attacks.
# CAT II (Medium) | CCI-001084
#
# init_on_free=1 must appear in GRUB_CMDLINE_LINUX in /etc/default/grub.
# This check follows the STIG method (grub default file, not grubby runtime).

- name: RHEL-09-212045 | check init_on_free=1 in /etc/default/grub
  command: grep -i GRUB_CMDLINE_LINUX /etc/default/grub
  register: _212045_cmdline
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212045 | record init_on_free status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212045': {
        'status':
          'not_a_finding'
          if 'init_on_free=1' in (_212045_cmdline.stdout | default(''))
          else 'open',
        'finding_details':
          'GRUB_CMDLINE_LINUX: '
          ~ (_212045_cmdline.stdout | default('') | trim
             if _212045_cmdline.stdout | default('') | trim else '(not found)')
          ~ '\nResult: '
          ~ ('not_a_finding - init_on_free=1 present in GRUB_CMDLINE_LINUX'
             if 'init_on_free=1' in (_212045_cmdline.stdout | default(''))
             else 'OPEN - init_on_free=1 missing from GRUB_CMDLINE_LINUX in /etc/default/grub'),
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=init_on_free=1 && '
          ~ 'add init_on_free=1 to GRUB_CMDLINE_LINUX in /etc/default/grub && '
          ~ 'sudo grub2-mkconfig -o /boot/grub2/grub.cfg'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-212015 | V-257788
# RHEL 9 must disable the ability of systemd to spawn an interactive boot process.
# CAT II (Medium) | CCI-000366
#
# systemd.confirm_spawn must NOT appear in any kernel's args. If grubby returns
# any output (lines with the arg present), it is a finding.

- name: RHEL-09-212015 | check for systemd.confirm_spawn in grub kernel args
  shell: grubby --info=ALL | grep args | grep 'systemd.confirm_spawn'
  register: _212015_spawn
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212015 | record interactive boot status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212015': {
        'status': 'not_a_finding' if not (_212015_spawn.stdout | trim) else 'open',
        'finding_details':
          'Kernels with systemd.confirm_spawn: '
          ~ (_212015_spawn.stdout | trim if _212015_spawn.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - systemd.confirm_spawn not present in any kernel args'
             if not (_212015_spawn.stdout | trim)
             else 'OPEN - systemd.confirm_spawn found in kernel args'),
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --remove-args=systemd.confirm_spawn'
      }
    }) }}"
  tags: [validate]

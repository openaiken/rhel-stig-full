---
# RHEL-09-212040 | V-257793
# RHEL 9 must clear the page allocator to prevent use-after-free attacks.
# CAT II (Medium) | CCI-001084
#
# page_poison=1 must be present in ALL kernel args. grubby returns lines missing
# the param; empty output means all kernels have it (not_a_finding).

- name: RHEL-09-212040 | check page_poison=1 in grub kernel args
  shell: grubby --info=ALL | grep args | grep -v 'page_poison=1'
  register: _212040_poison
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212040 | record page_poison status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212040': {
        'status': 'not_a_finding' if not (_212040_poison.stdout | trim) else 'open',
        'finding_details':
          'Kernels missing page_poison=1: '
          ~ (_212040_poison.stdout | trim if _212040_poison.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - page_poison=1 present in all kernel args'
             if not (_212040_poison.stdout | trim)
             else 'OPEN - one or more kernels missing page_poison=1'),
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=page_poison=1 && '
          ~ 'add page_poison=1 to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

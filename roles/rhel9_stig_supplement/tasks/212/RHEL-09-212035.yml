---
# RHEL-09-212035 | V-257792
# RHEL 9 must disable virtual system calls.
# CAT II (Medium) | CCI-000366
#
# vsyscall=none must be present in ALL kernel args. grubby returns lines missing
# the param; empty output means all kernels have it (not_a_finding).

- name: RHEL-09-212035 | check vsyscall=none in grub kernel args
  shell: grubby --info=ALL | grep args | grep -v 'vsyscall=none'
  register: _212035_vsyscall
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-212035 | record vsyscall status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-212035': {
        'status': 'not_a_finding' if not (_212035_vsyscall.stdout | trim) else 'open',
        'finding_details':
          'Kernels missing vsyscall=none: '
          ~ (_212035_vsyscall.stdout | trim if _212035_vsyscall.stdout | trim else '(none)')
          ~ '\nResult: '
          ~ ('not_a_finding - vsyscall=none present in all kernel args'
             if not (_212035_vsyscall.stdout | trim)
             else 'OPEN - one or more kernels missing vsyscall=none'),
        'comments':
          'To remediate: sudo grubby --update-kernel=ALL --args=vsyscall=none && '
          ~ 'add vsyscall=none to GRUB_CMDLINE_LINUX in /etc/default/grub'
      }
    }) }}"
  tags: [validate]

---
# RHEL-09-431016 | V-258038
# RHEL 9 must elevate the SELinux context when an administrator calls the
# sudo command.
# CAT II (Medium) | CCI-002233

# Check looks for TYPE=sysadm_t ROLE=sysadm_r in local sudoers files.
# If sudo rules are managed centrally via IdM/SSSD, they will not appear in
# local files. In that case, document the IdM-side enforcement via the
# attestation vars below.

- name: RHEL-09-431016 | check sudoers for sysadm_r SELinux context elevation
  shell: |
    local_result=$(grep -rh 'sysadm_r' /etc/sudoers /etc/sudoers.d/ 2>/dev/null | grep -v '^#' || true)
    sssd_sudo=$(grep -i '^\s*sudo_provider\s*=' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf 2>/dev/null | head -1 | awk -F= '{print $2}' | xargs)

    echo "LOCAL_SUDOERS_MATCH: ${local_result:-none}"
    echo "SSSD_SUDO_PROVIDER: ${sssd_sudo:-not configured}"

    if [ -n "$local_result" ]; then
      echo "STATUS: PASS (sysadm_r found in local sudoers)"
    elif [ -n "$sssd_sudo" ] && [ "$sssd_sudo" != "none" ]; then
      echo "STATUS: CENTRALIZED (sudo via SSSD provider: $sssd_sudo)"
    else
      echo "STATUS: FAIL (sysadm_r not found and no SSSD sudo provider detected)"
    fi
  register: _431016_result
  changed_when: false
  tags: [validate]

- name: RHEL-09-431016 | record sudo SELinux context elevation status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-431016': {
        'status':
          'not_a_finding' if ('STATUS: PASS' in _431016_result.stdout)
          else ('not_a_finding' if (rhel9_attest_sel_sudo_context_compliant | bool)
          else 'open'),
        'finding_details':
          _431016_result.stdout | trim
          ~ '\nAttestation (rhel9_attest_sel_sudo_context_compliant): '
          ~ (rhel9_attest_sel_sudo_context_compliant | bool | string | lower)
          ~ '\nIdM/centralized method: '
          ~ (rhel9_attest_sel_sudo_context_method if rhel9_attest_sel_sudo_context_method else '(not provided)'),
        'comments':
          'If sudo is managed via IdM, configure HBAC/sudo rules in IdM to include '
          ~ 'TYPE=sysadm_t ROLE=sysadm_r, then set rhel9_attest_sel_sudo_context_compliant: true '
          ~ 'and document the IdM rule name(s) in rhel9_attest_sel_sudo_context_method.'
      }
    }) }}"
  tags: [validate]

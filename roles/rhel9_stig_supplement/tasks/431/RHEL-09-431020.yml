---
# RHEL-09-431020 | V-258080
# RHEL 9 must configure SELinux context type to allow the use of a nondefault
# faillock tally directory.
# CAT II (Medium) | CCI-000366

# Not Applicable if SELinux is not enforcing or pam_faillock has no custom dir.
# If a custom dir is configured, it must have the faillog_t SELinux type label.

- name: RHEL-09-431020 | check SELinux context of faillock tally directory
  shell: |
    # check SELinux enforcement
    sel_mode=$(getenforce 2>/dev/null)
    if [ "$sel_mode" != "Enforcing" ]; then
      echo "NA: SELinux is not enforcing (mode: ${sel_mode:-unknown})"
      exit 0
    fi

    # check for a custom faillock dir
    custom_dir=$(grep -w '^\s*dir' /etc/security/faillock.conf 2>/dev/null \
                 | awk '{print $NF}' | xargs)
    if [ -z "$custom_dir" ]; then
      echo "NA: No custom faillock dir configured in /etc/security/faillock.conf"
      exit 0
    fi

    echo "FAILLOCK_DIR: $custom_dir"

    if [ ! -d "$custom_dir" ]; then
      echo "STATUS: FAIL"
      echo "RAW: Directory $custom_dir does not exist"
      exit 0
    fi

    ctx=$(ls -Zd "$custom_dir" 2>/dev/null | awk '{print $1}')
    echo "SELINUX_CONTEXT: $ctx"

    if echo "$ctx" | grep -q ':faillog_t:'; then
      echo "STATUS: PASS"
    else
      echo "STATUS: FAIL"
      echo "RAW: Expected type faillog_t, got: $ctx"
      echo "RAW: Fix with: semanage fcontext -a -t faillog_t '${custom_dir}(/.*)?' && restorecon -Rv $custom_dir"
    fi
  register: _431020_result
  changed_when: false
  failed_when: false
  tags: [validate]

- name: RHEL-09-431020 | record faillock dir SELinux context status
  set_fact:
    supp_facts: "{{ supp_facts | combine({
      'RHEL-09-431020': {
        'status':
          'not_applicable' if _431020_result.stdout is search('^NA:')
          else ('not_a_finding' if 'STATUS: PASS' in _431020_result.stdout
          else 'open'),
        'finding_details': _431020_result.stdout | trim,
        'comments':
          'If a nondefault faillock dir is configured, apply the correct SELinux label: '
          ~ 'semanage fcontext -a -t faillog_t <dir>(/.*)?  then restorecon -Rv <dir>'
      }
    }) }}"
  tags: [validate]

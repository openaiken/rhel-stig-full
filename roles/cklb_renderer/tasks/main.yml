---
- name: set run timestamp
  set_fact:
    cklb_run_ts: "{{ '%y%b%d-%H:%M' | strftime }}"
  run_once: true
  delegate_to: localhost
  tags: [validate]

- name: find XCCDF results for host
  find:
    paths: "{{ reports_dir }}"
    patterns: "*-{{ inventory_hostname }}-xccdf-results.xml"
  register: xccdf_files
  delegate_to: localhost
  tags: [validate]

- name: find supplement facts for host
  find:
    paths: "{{ supp_facts_dir }}"
    patterns: "*-{{ inventory_hostname }}.json"
  register: supp_files
  delegate_to: localhost
  tags: [validate]

- name: slurp CKLB template
  slurp:
    src: "{{ cklb_template_path }}"
  register: cklb_template_raw
  delegate_to: localhost
  run_once: true
  tags: [validate]

- name: render and write CKLB
  copy:
    content: "{{ cklb_template_raw.content | b64decode | cklb_render(
        hostname=inventory_hostname,
        fqdn=host_fqdn | default(inventory_hostname),
        ip_address=ansible_host | default(''),
        xccdf_paths=xccdf_files.files | map(attribute='path') | list,
        supp_paths=supp_files.files | map(attribute='path') | list
      ) | to_nice_json(indent=2) }}"
    dest: "{{ cklb_output_dir }}/{{ cklb_run_ts }}-{{ inventory_hostname }}.cklb"
  delegate_to: localhost
  tags: [validate]

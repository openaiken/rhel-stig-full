---
# ─── Operator Attestation ──────────────────────────────────────────────────────
# These variables require human judgment or organizational context that cannot
# be determined programmatically. Review each entry, verify the described
# condition on the system, and set to true only when the system is compliant.
# A false value results in an open finding in the generated checklist.
#
# ┄┄ RHEL-09-211015 | V-257778 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Vendor security patches are installed and up to date per the organizational
# patching policy. Patching frequency is org-defined and cannot be verified
# programmatically. Before setting true, confirm currency via:
#   sudo dnf history list | more
rhel9_attest_patching_current: false
#
# ┄┄ RHEL-09-211030 | V-257781 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# A graphical display manager is required for this system and has been approved
# by the ISSO. If true, graphical.target as the default boot target is treated
# as not_a_finding. Default false assumes server/headless use.
rhel9_gui_approved: false
#
# ┄┄ RHEL-09-231190 | V-257879 | RHEL 9 V2R8 | CAT I ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Local disk partitions must use LUKS encryption unless encryption is provided
# at the hypervisor or storage array level with documented organizational
# approval. Set true only when that documented exception applies; the check
# will auto-detect LUKS otherwise via lsblk. Document the encryption method
# (e.g. "VMware vSphere VM encryption at the datastore level") in
# rhel9_attest_disk_encryption_method so the checklist reviewer has context.
rhel9_attest_disk_encryption_na: false
rhel9_attest_disk_encryption_method: ""
#
# ┄┄ RHEL-09-212020 | V-257789 | RHEL 9 V2R8 | CAT I ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# The grub2 superuser account name configured on this system. Must not be a
# common name (root, admin, administrator). The supplement check verifies that
# /etc/grub2.cfg contains a superusers line matching this value. Leave blank
# if grub superuser authentication has not been configured (results in open).
# To configure: sudo grub2-setpassword (sets password for 'root' superuser) or
# edit /etc/grub.d/01_users to define a custom non-default username.
rhel9_grub_superuser: ""
#
# ┄┄ RHEL-09-251035 | V-257940 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Ports, protocols, and services configured in the firewall comply with the
# organizationally defined PPSM CAL and vulnerability assessments. Before
# setting true, compare the output in the supplement facts for this rule
# against the approved PPSM CAL for this system.
rhel9_attest_ppsm_compliant: false
#
# ┄┄ RHEL-09-252020 | V-257950 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Configured NTP server(s) in /etc/chrony.conf are organizationally approved
# authoritative time sources. The STIG requires DoD NTP pool servers; sites
# that cannot reach DoD NTP directly may use upstream-synchronized sources with
# documented organizational approval. The supplement check verifies maxpoll <= 16
# automatically; set this true only after confirming the NTP source is approved.
rhel9_attest_ntp_source_approved: false
#
# ┄┄ RHEL-09-252045 | V-257956 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# All IPsec tunnel connections configured in /etc/ipsec.conf and /etc/ipsec.d/
# are documented and approved by the ISSO. Only relevant when the ipsec service
# is active. Leave false if ipsec is inactive (supplement check auto-detects
# that and marks not_a_finding regardless of this value).
rhel9_attest_ipsec_tunnels_approved: false
#
# ┄┄ RHEL-09-291030 | V-258168 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Set rhel9_attest_usbguard_na: true if this system is a VM with no virtual
# or physical USB peripherals attached (Not Applicable per STIG check note).
# If usbguard is not in use but unauthorized peripherals are blocked by another
# mechanism, set rhel9_attest_usbguard_compliant: true and document the
# mechanism in rhel9_attest_usbguard_method. If usbguard list-rules returns
# output, the check passes automatically without these attestations.
rhel9_attest_usbguard_na: false
rhel9_attest_usbguard_compliant: false
rhel9_attest_usbguard_method: ""
#
# ┄┄ RHEL-09-291040 | V-258171 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Systems with no wifi-type devices detected are marked Not Applicable
# automatically. If wireless adapters are present and have been approved by
# the ISSO as an operational requirement, set rhel9_attest_wifi_approved: true
# and record the ISSO approval details in rhel9_attest_wifi_comment.
rhel9_attest_wifi_approved: false
rhel9_attest_wifi_comment: ""
#
# ┄┄ RHEL-09-252060 | V-257959 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# If postfix is installed but the postmaster: root alias is not configured,
# the SA must document the alternative mechanism by which the SA and ISSO are
# notified of audit processing failures. Set compliant: true and describe the
# mechanism in rhel9_attest_audit_notification_method (e.g. monitoring system,
# different alias, external alerting).
rhel9_attest_audit_notification_compliant: false
rhel9_attest_audit_notification_method: ""
#
# ┄┄ RHEL-09-411095 | V-258058 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# Complete list of ALL account usernames (system and interactive) authorized to
# exist in /etc/passwd on this system. Any account not on this list is flagged
# as a finding. Populate by running on the target host:
#   awk -F: '{print $1}' /etc/passwd
# Start with the accounts present at initial system build; add new accounts only
# after obtaining ISSO approval.
rhel9_authorized_users:
  - root
  - bin
  - daemon
  - adm
  - lp
  - sync
  - shutdown
  - halt
  - mail
  - operator
  - games
  - ftp
  - nobody
  - systemd-coredump
  - dbus
  - polkitd
  - pegasus
  - sssd
  - tss
  - clevis
  - unbound
  - fapolicyd
  - libstoragemgmt
  - setroubleshoot
  - postfix
  - sshd
  - chrony
  - tcpdump
  - locadmin
#
# ┄┄ RHEL-09-411040 | V-257993 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# List of temporary account usernames currently provisioned on this system.
# Temporary accounts must have an expiration date set within 72 hours of
# creation. Leave this list empty if no temporary accounts exist. The check
# will report not_a_finding automatically for an empty list.
# Set expiration: sudo chage -E $(date -d +72hours +%Y-%m-%d) <account>
rhel9_temporary_accounts: []
#
# ┄┄ RHEL-09-431016 | V-258038 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# sudo rules must include TYPE=sysadm_t ROLE=sysadm_r for administrator
# accounts. If sudo is managed via IdM/SSSD rather than local sudoers files,
# the automated check will detect the SSSD provider and set status to CENTRALIZED
# in finding_details. Set rhel9_attest_sel_sudo_context_compliant: true only
# after verifying that the IdM sudo rules include the sysadm_t/sysadm_r context.
# Document the IdM sudo rule name(s) or HBAC policy in the method field.
rhel9_attest_sel_sudo_context_compliant: false
rhel9_attest_sel_sudo_context_method: ""
#
# ┄┄ RHEL-09-611085 | V-258139 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# NOPASSWD found in local sudoers files. The STIG allows this only when the
# ISSO has documented that the affected account(s) use an approved MFA method
# (e.g. PIV/CAC, FIDO2 hardware token) making a password prompt redundant.
# Note: sudo rules managed via IdM/SSSD do not appear in local sudoers — this
# attestation applies only to NOPASSWD entries in /etc/sudoers or sudoers.d/.
# Set true only after obtaining documented ISSO approval.
rhel9_attest_nopasswd_isso_approved: false
#
# ┄┄ RHEL-09-611170 | V-258206 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# If SSSD is not the MFA mechanism on this system (e.g. direct GSSAPI Kerberos
# with hardware token, pam_pkcs11 without sssd), the SA must demonstrate that
# certificate status checking (OCSP or equivalent) is implemented by the
# alternate method. Set true only after confirming certificate revocation
# checking is enforced. Document the mechanism below.
rhel9_attest_alt_mfa_cert_verification: false
rhel9_attest_alt_mfa_cert_verification_method: ""
#
# ┄┄ RHEL-09-611190 | V-258212 | RHEL 9 V2R8 | CAT II ┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄
# If an approved alternate MFA mechanism is in use that does not rely on SSH
# private key files for authentication (e.g. PIV/CAC via PKCS#11, FIDO2
# hardware tokens, certificate-based Kerberos), set true and document below.
# This makes the SSH private key passphrase check not applicable.
rhel9_attest_alt_mfa_pki: false
rhel9_attest_alt_mfa_pki_method: ""
